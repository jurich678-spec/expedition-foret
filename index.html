.pv-briques{background:linear-gradient(#4fc3ff,#c4ecff 62%,#3cc46a 62%,#3cc46a 74%,#2a9a52 74%)}
.pv-briques:before,.pv-briques:after{content:'';position:absolute;width:26px;height:26px;border-radius:5px;background:#ff5a5a;box-shadow:inset -5px -5px 0 rgba(0,0,0,.2),inset 4px 4px 0 rgba(255,255,255,.4);left:25%;top:30%;animation:fly 2.6s ease-in-out infinite alternate}
.pv-briques:after{background:#ffd23f;left:62%;top:22%;width:20px;height:20px;animation-delay:-1.3s}
body.t-aurore{
  --bg1:#081430;--bg2:#13284d;--ink:#eef4ff;--ink2:#a9b8d6;--panel:rgba(20,34,66,.82);--panel2:rgba(40,62,110,.7);--line:#6fe3c1;
  --acc:#4fd6a8;--acc2:#2aa883;--radius:18px;--shadow:0 0 24px rgba(79,214,168,.25);--border:2px solid rgba(111,227,193,.55);
  --title:'Nunito',system-ui,sans-serif;
}
body.t-jungle{
  --bg1:#0f3b25;--bg2:#1f5f33;--ink:#f3f8ea;--ink2:#bdd6b0;--panel:rgba(16,52,32,.86);--panel2:rgba(34,90,52,.75);--line:#b8e65a;
  --acc:#b8e65a;--acc2:#7fb52f;--radius:24px;--shadow:0 10px 30px rgba(0,0,0,.35);--border:2px solid rgba(184,230,90,.5);
  --title:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--body);color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));user-select:none;-webkit-user-select:none;touch-action:manipulation}
#bg,#fx,#wipe{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:50}#wipe{z-index:60}
#app{position:fixed;inset:0;z-index:10;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen{min-height:100%;max-width:980px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 18px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,.btn,.title{font-family:var(--title)}
h1{font-size:clamp(34px,7vw,64px);margin:0;line-height:1.05;letter-spacing:.5px}
h2{font-size:clamp(24px,4.4vw,36px);margin:0}
h3{font-size:clamp(19px,3.2vw,24px);margin:0}
p{margin:0;line-height:1.45;font-size:clamp(16px,2.6vw,20px)}
.muted{color:var(--ink2)}
.panel{background:var(--panel);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.t-blocs .panel{box-shadow:inset -4px -4px 0 rgba(0,0,0,.12),inset 4px 4px 0 rgba(255,255,255,.6),0 6px 0 rgba(0,0,0,.25)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.center{text-align:center;align-items:center;justify-content:center}
.btn{appearance:none;border:var(--border);border-radius:var(--radius);background:var(--acc);color:#fff;font-size:clamp(18px,3vw,24px);padding:14px 22px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.25)}
body.t-blocs .btn{box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.35),0 6px 0 rgba(0,0,0,.3)}
body.t-aurore .btn,body.t-jungle .btn{color:#06210f;text-shadow:none}
body.t-aurore .btn.alt,body.t-jungle .btn.alt,body.t-aurore .btn.ghost,body.t-jungle .btn.ghost{color:var(--ink)}
body.t-aurore .btn.warn,body.t-jungle .btn.warn{color:#2a1200}
.btn:active{transform:translateY(4px) scale(.98)}
.btn.big{font-size:clamp(22px,3.8vw,30px);padding:20px 26px}
.btn.alt{background:var(--panel2);color:var(--ink);text-shadow:none}
.btn.warn{background:var(--warn)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink);text-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.pix{image-rendering:pixelated;display:block}
input.txt{font:inherit;font-size:clamp(18px,3vw,24px);padding:12px 14px;border:var(--border);border-radius:calc(var(--radius) / 2);background:rgba(255,255,255,.95);color:#1d2330;width:100%;user-select:text;-webkit-user-select:text}
input.txt:focus{outline:4px solid var(--gold)}
/* topbar */
.topbar{display:flex;align-items:center;gap:10px}
.topbar .btn{padding:8px 14px;font-size:18px}
.progress{flex:1;height:18px;background:rgba(0,0,0,.18);border-radius:var(--radius);overflow:hidden;border:2px solid var(--line)}
.progress>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));width:0;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel2);border:2px solid var(--line);font-weight:800;font-size:16px}
/* choix (onboarding) */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.choice{cursor:pointer;padding:16px;text-align:center;transition:transform .15s}
.choice.sel{outline:5px solid var(--gold);transform:translateY(-4px)}
.choice .pix{margin:0 auto 8px}
.preview{height:110px;border-radius:calc(var(--radius) / 1.5);margin-bottom:10px;position:relative;overflow:hidden;border:2px solid rgba(0,0,0,.25)}
.pv-blocs{background:linear-gradient(#7ec8f0,#bfe6ff 60%,#5aa83a 60%,#5aa83a 72%,#8a5a32 72%);image-rendering:pixelated}
.pv-blocs:after{content:'';position:absolute;left:10%;top:18%;width:40px;height:16px;background:#fff;box-shadow:16px -8px 0 #fff,32px 0 0 #fff;animation:cloud 6s linear infinite}
.pv-aurore{background:linear-gradient(#050c22,#1a2f5a)}
.pv-aurore:before{content:'';position:absolute;inset:-20% -10% 40%;background:linear-gradient(100deg,transparent 20%,rgba(79,214,168,.7) 40%,rgba(140,110,255,.5) 60%,transparent 80%);filter:blur(10px);animation:aur 4s ease-in-out infinite alternate}
.pv-jungle{background:radial-gradient(circle at 30% 70%,#2f8a45,#0f3b25 70%)}
.pv-jungle:before,.pv-jungle:after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:#e9ff8a;box-shadow:0 0 12px #e9ff8a;left:30%;top:40%;animation:fly 3s ease-in-out infinite alternate}
.pv-jungle:after{left:70%;top:60%;animation-delay:-1.5s}
@keyframes cloud{from{transform:translateX(-60px)}to{transform:translateX(260px)}}
@keyframes aur{to{transform:translateX(20%) skewX(-10deg)}}
@keyframes fly{to{transform:translate(30px,-25px)}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hop{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{30%{transform:translateY(-22px) scale(1.08,.94)}60%{transform:translateY(0) scale(.95,1.06)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.fadein{animation:fadein .4s both}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}}
/* accueil */
.hero{display:flex;align-items:center;gap:16px}
.hero .comp{flex:none}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),rgba(0,0,0,.15) 0);display:grid;place-items:center;flex:none}
.ring>span{width:72px;height:72px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:900;font-size:22px;font-family:var(--title)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.menu .btn{justify-content:flex-start;text-align:left;min-height:84px}
.menu .btn small{display:block;font-family:var(--body);font-weight:600;font-size:15px;opacity:.9;text-shadow:none}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.day{flex:none;width:64px;padding:8px 4px;text-align:center;border:2px solid var(--line);border-radius:calc(var(--radius) / 2);background:var(--panel2);font-weight:800;font-size:14px}
.day.done{background:var(--good);color:#fff}
.day.today{outline:4px solid var(--gold)}
.day.exam{background:var(--warn);color:#fff}
/* carte d'expédition */
.trail{position:relative;display:grid;gap:14px}
.node{display:flex;align-items:center;gap:14px;cursor:pointer;padding:14px}
.node:nth-child(even){margin-left:8%}
.node .badge{width:64px;height:64px;flex:none;display:grid;place-items:center;background:var(--panel2);border:var(--border);border-radius:calc(var(--radius) / 1.2)}
.node .mini{height:10px;background:rgba(0,0,0,.15);border-radius:6px;overflow:hidden;margin-top:6px}
.node .mini>div{height:100%;background:var(--acc)}
/* jeux */
.qtitle{font-size:clamp(20px,3.4vw,28px);font-weight:900;line-height:1.25}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{font-family:var(--body);font-size:clamp(17px,2.8vw,22px);font-weight:800;padding:16px;text-align:left;background:var(--panel);color:var(--ink);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;transition:transform .1s,background .2s}
.opt:active{transform:scale(.97)}
.opt.good{background:var(--good);color:#fff}
.opt.bad{background:var(--bad);color:#fff}
.opt.sel{outline:5px solid var(--gold)}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px 18px max(16px,env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1)}
.feedback.show{transform:none}
.feedback .panel{max-width:940px;margin:0 auto;display:flex;gap:14px;align-items:center}
.feedback.good .panel{border-color:var(--good)}
.feedback.bad .panel{border-color:var(--warn)}
.fb-title{font-family:var(--title);font-size:24px;font-weight:900}
.feedback.good .fb-title{color:var(--good)}
.feedback.bad .fb-title{color:var(--warn)}
.mapwrap{position:relative;width:100%;border:var(--border);border-radius:var(--radius);overflow:hidden;background:#a9d3ee;touch-action:none}
body.t-aurore .mapwrap{background:#0d2148}
body.t-jungle .mapwrap{background:#174a59}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap path.c{fill:#f3efe2;stroke:#6b7280;stroke-width:.6;transition:fill .3s}
body.t-aurore .mapwrap path.c{fill:#2a3f6e;stroke:#5c7bb3}
body.t-jungle .mapwrap path.c{fill:#2f6a3c;stroke:#5c9a5a}
.mapwrap path.c.good{fill:var(--good)!important}
.mapwrap path.c.found{fill:#8ad08f!important}
.mapwrap path.c.bad{fill:var(--bad)!important}
.mapwrap path.c.glow{fill:var(--gold)!important;filter:drop-shadow(0 0 6px var(--gold))}
.maplabel{font-family:var(--body);font-weight:900;font-size:16px;fill:#1d2330;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}
.river-faint{fill:none;stroke:#7fb2d9;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.river-draw{fill:none;stroke:#e0249a;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #ff6ad5)}
.river-flow{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:6 18;stroke-linecap:round;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
/* tri */
.buckets{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.bucket{min-height:110px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.bucket.hint{outline:4px dashed var(--gold)}
.bucket h3{font-size:18px;font-family:var(--body);font-weight:900;line-height:1.2}
.bucket .dropped{font-size:14px;font-weight:700;padding:4px 8px;background:var(--panel2);border-radius:8px}
.card{padding:16px;font-size:clamp(18px,3vw,23px);font-weight:800;text-align:center}
/* phrases à compléter */
.sentence{font-size:clamp(19px,3.2vw,26px);line-height:2.1;font-weight:700}
.sentence input{font:inherit;font-weight:900;width:7.5em;padding:2px 8px;border:none;border-bottom:4px solid var(--acc);background:rgba(255,255,255,.9);color:#1d2330;border-radius:6px;text-align:center;user-select:text;-webkit-user-select:text}
.sentence input.ok{border-color:var(--good);background:#d9f5df}
.sentence input.ko{border-color:var(--warn);background:#ffe6d6}
.pick{display:inline-flex;gap:6px;vertical-align:middle}
.pick button{font:inherit;font-size:.9em;font-weight:800;padding:2px 12px;border-radius:999px;border:3px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.pick button.on{background:var(--gold);color:#1d2330;box-shadow:0 0 0 4px rgba(242,195,53,.4)}
.pick button.good{background:var(--good);color:#fff}
.pick button.bad{background:var(--bad);color:#fff;text-decoration:line-through}
/* relier */
.match{position:relative;display:grid;grid-template-columns:1.4fr .5fr 1fr;gap:10px;align-items:center}
.match svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mrow{padding:12px 14px;font-weight:800;font-size:clamp(15px,2.5vw,19px);cursor:pointer;position:relative}
.mrow.sel{outline:5px solid var(--gold)}
.mrow.done{opacity:.75}
.mtarget{padding:16px;font-weight:900;font-size:clamp(16px,2.7vw,21px);cursor:pointer;text-align:center}
/* swipe */
.deck{position:relative;height:300px;max-width:520px;width:100%;margin:0 auto}
.swcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-size:clamp(22px,4vw,30px);font-weight:900;padding:24px;touch-action:none;cursor:grab}
.swcard .tag{position:absolute;top:18px;padding:6px 14px;border:4px solid;border-radius:10px;font-family:var(--title);font-size:22px;opacity:0}
.swcard .tag.l{left:18px;color:var(--good);border-color:var(--good);transform:rotate(-12deg)}
.swcard .tag.r{right:18px;color:var(--warn);border-color:var(--warn);transform:rotate(12deg)}
.sides{display:flex;justify-content:space-between;gap:12px;max-width:520px;margin:0 auto;width:100%}
/* ordre */
.zonecanvas{width:100%;display:block;border:var(--border);border-radius:var(--radius);background:#cfe0e6}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips .opt{text-align:center;flex:1 1 180px}
/* forêt */
.forestcv{width:100%;display:block;border:var(--border);border-radius:var(--radius)}
.species{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.sp{padding:8px;text-align:center;cursor:pointer;font-weight:800;font-size:15px}
.sp canvas{display:block;margin:0 auto}
.fact{font-size:16px;font-weight:700;padding:10px 14px;border-left:6px solid var(--gold);background:var(--panel2);border-radius:8px}
.reveal-list{display:flex;flex-wrap:wrap;gap:8px}
.reveal-list span{padding:6px 12px;border-radius:999px;font-weight:800;border:2px solid var(--line);background:var(--panel2)}
.reveal-list span.got{background:var(--good);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-weight:800;font-size:18px}
.toggle input{width:28px;height:28px}
.score{font-family:var(--title);font-size:clamp(48px,10vw,88px);font-weight:900;line-height:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (orientation:landscape) and (min-width:900px){.deck{height:260px}}

.aura-verte{filter:drop-shadow(0 0 4px #6cff8a) drop-shadow(0 0 12px #2bff5a) drop-shadow(0 0 20px #2bff5a)}
.aura-doree{filter:drop-shadow(0 0 4px #ffd84a) drop-shadow(0 0 12px #ffb800) drop-shadow(0 0 20px #ffb800)}
.aura-arc{filter:drop-shadow(0 0 5px #ff5ab4) drop-shadow(0 0 14px #ff5ab4) drop-shadow(0 0 22px #ff5ab4);animation:hue 3s linear infinite}
.aura-arc.bob{animation:hue 3s linear infinite,bob 1.6s ease-in-out infinite}
@keyframes hue{to{filter:drop-shadow(0 0 4px #ff5ab4) drop-shadow(0 0 9px #ff5ab4) hue-rotate(360deg)}}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{padding:12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800}
.item.worn{outline:5px solid var(--gold)}
.item .price{font-size:15px}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.bdg{width:96px;text-align:center;font-size:13px;font-weight:800;padding:8px 4px;border-radius:12px;border:2px solid var(--line);background:var(--panel2)}
.bdg .pix{margin:0 auto 4px}
.bdg.off{opacity:.35;filter:grayscale(1)}
.bdg.new{outline:4px solid var(--gold);animation:pop .5s}

</style>

function gridSVG(grid, size = 64, extra = '') {
  const h = grid.length, w = grid[0].length;
  let r = '';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = grid[y][x]; if (c === '.') continue;
    r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[c] || c}"/>`;
  }
  return `<svg class="pix" ${extra} viewBox="0 0 ${w} ${h}" width="${size}" height="${size * h / w}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

// growth : 0..1 (animation de pousse)
function drawTree(ctx, sp, x, base, s, growth = 1, autumn = false) {
  const px = (dx, dy, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x + dx * s), Math.round(base - dy * s * growth), Math.ceil(s), Math.ceil(s * growth) + 1); };
  const blob = (cx, cy, r, c1, c2) => {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy <= r * r + r * 0.6) px(cx + dx, cy + dy, (dx + dy + cy) % 3 === 0 ? c2 : c1);
    }
  };
  const trunk = (h, c = '#6b4423') => { for (let i = 0; i < h; i++) { px(0, i, c); } };
  const cone = (h, w, c1, c2, start = 2) => {
    for (let i = 0; i < h; i++) {
      const half = Math.max(0, Math.round((h - i) * w / h - (i % 3 === 0 ? 1 : 0)));
      for (let dx = -half; dx <= half; dx++) px(dx, start + i, (dx + i) % 4 === 0 ? c2 : c1);
    }
    px(0, start + h, c1);
  };
  switch (sp) {
    case 'epinette': trunk(3); cone(12, 3, '#1f5a3a', '#174630'); break;
    case 'sapin': trunk(2); cone(10, 4, '#2c7a4b', '#1f5a3a'); break;
    case 'pin': trunk(7, '#7a4a2a'); blob(-2, 8, 2, '#3f8a4f', '#2d6b3b'); blob(2, 10, 2, '#3f8a4f', '#2d6b3b'); blob(0, 12, 2, '#3f8a4f', '#2d6b3b'); break;
    case 'meleze': trunk(3); cone(10, 3, autumn ? '#e3b23c' : '#8fbf4d', autumn ? '#c99526' : '#78a63e'); break;
    case 'erable': trunk(5); blob(0, 9, 4, autumn ? '#d8432f' : '#3f9a48', autumn ? '#f08a24' : '#2f7d3a'); break;
    case 'chene': trunk(5, '#5a3a20'); blob(-2, 9, 3, '#2f6e35', '#245a2a'); blob(2, 9, 3, '#2f6e35', '#3a8040'); blob(0, 12, 3, '#3a8040', '#245a2a'); break;
    case 'bouleau': for (let i = 0; i < 6; i++) px(0, i, i % 2 ? '#e7d29a' : '#c8a85c'); blob(0, 9, 3, autumn ? '#f2c335' : '#7cbf4a', autumn ? '#e0a82a' : '#5ea83c'); break;
    case 'hetre': trunk(5, '#8a8f96'); blob(0, 9, 4, autumn ? '#c9772a' : '#4a9a4a', autumn ? '#a85c1e' : '#3a8a3a'); break;
    case 'palmier': for (let i = 0; i < 12; i++) px(i > 8 ? 1 : 0, i, i % 2 ? '#8a6a3a' : '#a07a44');
      [[-4, 12], [-3, 13], [-2, 13], [-1, 13], [2, 13], [3, 13], [4, 12], [5, 11], [-5, 11], [0, 14], [1, 14], [-1, 11], [2, 11], [3, 11]].forEach(p => px(p[0], p[1], '#3aa04a')); break;
    case 'cocotier': for (let i = 0; i < 12; i++) px(i > 6 ? 1 : 0, i, i % 2 ? '#8a6a3a' : '#a07a44');
      [[-4, 12], [-3, 13], [-2, 13], [-1, 13], [2, 13], [3, 13], [4, 12], [5, 11], [-5, 11], [0, 14], [1, 14]].forEach(p => px(p[0], p[1], '#4cb35a'));
      [[0, 11], [1, 11], [2, 11]].forEach(p => px(p[0], p[1], '#5a3a1a')); break;
    case 'hevea': trunk(8, '#9a8a70'); blob(0, 12, 4, '#2f8f3f', '#247a33'); break;
    case 'acajou': trunk(7, '#8a3a24'); blob(-2, 11, 4, '#2a6e2a', '#1f5a20'); blob(3, 12, 3, '#2a6e2a', '#3a7e3a'); break;
    case 'cacaoyer': trunk(4); blob(0, 7, 3, '#2f7d3a', '#3f9a48'); px(-2, 4, '#e8762b'); px(2, 5, '#d8a02b'); px(1, 3, '#e8762b'); break;
    case 'arbuste': blob(0, 1, 1, '#6a7a4a', '#7a8a5a'); break;
    case 'lichen': px(0, 0, '#c9cfa8'); px(1, 0, '#b6bd92'); px(-1, 0, '#d8dcc0'); break;
    default: trunk(3); cone(8, 3, '#2c7a4b', '#1f5a3a');
  }
}

];

function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function drawZoneBand(ctx, zi, x0, y0, w, h, growth, s) {
  const z = ZONE_STYLE[zi];
  ctx.fillStyle = z.ground; ctx.fillRect(x0, y0, w, h);
  const rnd = seeded(97 + zi * 31);
  ctx.fillStyle = z.ground2;
  for (let i = 0; i < w * h / (s * s * 9); i++) ctx.fillRect(x0 + Math.floor(rnd() * w / s) * s, y0 + Math.floor(rnd() * h / s) * s, s, s);
  const list = [];
  z.trees.forEach(([sp, n]) => { for (let i = 0; i < n * (w / 600); i++) list.push({ sp, x: x0 + 20 + rnd() * (w - 40), y: y0 + h * 0.35 + rnd() * h * 0.62, d: rnd() }); });
  list.sort((a, b) => a.y - b.y);
  list.forEach(t => {
    const g = Math.max(0, Math.min(1, growth * 1.6 - t.d * 0.6));
    if (g > 0) drawTree(ctx, t.sp, t.x, t.y, s, g, zi >= 3);
  });
}

      line.split('').forEach((c, x) => { if (c !== '.') row[x] = c; });
      rows[r] = row.join('');
    });
  }
  return rows;
}

/* ---------- Réponses tapées : tolérance aux accents et fautes ---------- */
function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’'`\-]/g, ' ').replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim(); }
const stripArt = s => s.replace(/^(le|la|les|l|un|une|des|du|de|d|faire de la|faire du|faire la) /, '');
function lev(a, b) { const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let p = Array.from({ length: n + 1 }, (_, j) => j); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
function matchAns(v, answers, numeric) {
  if (numeric) { const d = String(v).replace(/\D/g, ''); return { ok: answers.some(a => a.replace(/\D/g, '') === d && d !== '') }; }
  const x = stripArt(norm(v)); if (!x) return { ok: false };
  for (const a of answers) { if (x === stripArt(norm(a))) { const exact = v.trim().toLowerCase() === a.toLowerCase(); return { ok: true, near: !exact, right: answers[0] }; } }
  for (const a of answers) { const y = stripArt(norm(a)); const tol = y.length >= 8 ? 2 : y.length >= 5 ? 1 : 0; if (tol && lev(x, y) <= tol) return { ok: true, near: true, right: answers[0] }; }
  return { ok: false, right: answers[0] };
}

/* ---------- Constructeurs ---------- */
const ZONE_Q = [

}

function buildQuest(key, focus) {

    const tr = FORESTS.filter(f => inc('f-' + f.key + '-arbres')).map(f => ({ id: 'f-' + f.key + '-arbres', text: f.name, bucket: f.key, fact: f.trees + '.' }));
    if (tr.length) steps.push(sortStep({ quest: 'labo', qnum: 'Q4', title: 'Quel genre d’arbres dans chaque forêt ?', buckets: [{ key: 'feuillus', label: 'Surtout des feuillus' }, { key: 'boreale', label: 'Surtout des conifères' }, { key: 'mixte', label: 'Mélange de feuillus et de conifères' }, { key: 'tropicale', label: 'Arbres tropicaux qui gardent leurs feuilles toute l’année' }] }, tr));
    const cl = FORESTS.filter(f => inc('f-' + f.key + '-climat')).map(f => ({ id: 'f-' + f.key + '-climat', text: f.name, bucket: f.key, fact: 'Climat : ' + f.climate.toLowerCase() + '.' }));
    if (cl.length) steps.push(sortStep({ quest: 'labo', qnum: 'Q4', title: 'Quel type de climat pour chaque forêt ?', buckets: [{ key: 'feuillus', label: 'Tempéré' }, { key: 'boreale', label: 'Froid (hémisphère Nord)' }, { key: 'mixte', label: 'Froid et tempéré' }, { key: 'tropicale', label: 'Chaud et humide' }] }, cl));
    const bl = FAO.blanks.filter(b => inc(b.id));
    if (bl.length) { const mk = (ids) => ({ type: 'fill', quest: 'labo', qnum: 'Q3', title: 'Les critères de la FAO pour qu’un territoire soit une forêt', intro: FAO.intro, lines: FAO.blanks.filter(b => ids.includes(b.id)).map(b => [b.before + ' ', { a: b.answer, id: b.id, num: true, unit: b.unit }, ' ' + b.after]), subset: (f) => mk(f) }); steps.push(mk(bl.map(b => b.id))); }
    shuffle(FAO.cases).filter(c => inc(c.id)).forEach(c => steps.push(mcqStep({ quest: 'labo', qnum: 'Q3', item: c.id, q: '<span class="muted" style="font-size:.8em">Selon la FAO, est-ce une forêt ?</span><br>' + c.text, correct: c.forest ? 'Oui, c’est une forêt' : 'Non, ce n’est pas une forêt', options: ['Oui, c’est une forêt', 'Non, ce n’est pas une forêt'], explain: c.why + ' Rappel : <b>5 000 m²</b>, <b>10 %</b> du sol couvert, arbres de plus de <b>5 m</b>.' })));
  }

    const rc = ROLES.filter(r => inc(r.id)).map(r => ({ id: r.id, text: r.text, bucket: r.aspect }));
    if (rc.length) steps.push(sortStep({ quest: 'roles', qnum: 'Q7', title: 'À quel aspect appartient ce rôle de la forêt ?', buckets: Object.entries(ASPECTS).map(([k, v]) => ({ key: k, label: v, hint: ASPECT_HINT[k].split('= ')[1] })) }, rc));
  }
  if (key === 'monde') {
    const tg = shuffle(WORLD_TARGETS.filter(c => inc('w-' + c.id)));
    tg.forEach(c => { const mk = () => ({ type: 'mapTap', map: 'world', quest: 'monde', qnum: 'Q1', item: 'w-' + c.id, target: c, prompt: 'Touche ce pays sur la carte :', subset: () => mk() }); steps.push(mk()); });
    if (!focus) shuffle(WORLD_TARGETS).slice(0, 3).forEach(c => steps.push(mcqStep({ type: 'mapName', map: 'world', quest: 'monde', qnum: 'Q1', item: 'w-' + c.id, target: c, q: 'Quel est ce pays en jaune ?', correct: c.name, options: shuffle(WORLD_TARGETS.filter(x => x.id !== c.id).map(x => x.name)).slice(0, 3).concat(c.name), explain: c.name + ' fait partie des 10 pays les plus boisés du monde.' })));

  }

  }

  }

    const cs = CUT_KEEP.filter(c => inc(c.id));
    if (cs.length) { const mk = (l) => ({ type: 'swipe', quest: 'couper', qnum: 'Q11', cards: shuffle(l), subset: (f) => mk(CUT_KEEP.filter(c => f.includes(c.id))) }); steps.push(mk(cs)); }

  return steps;
}

function buildExam() {
  const s = [];
  shuffle(WORLD_TARGETS).slice(0, 5).forEach(c => s.push({ type: 'mapTap', map: 'world', quest: 'monde', qnum: 'Q1', item: 'w-' + c.id, target: c, prompt: 'Situe ce pays :' }));
  shuffle(AMAZON_TARGETS).slice(0, 3).forEach(c => s.push({ type: 'mapTap', map: 'sa', quest: 'carto', qnum: 'Q2', item: 'a-' + c.id, target: c, prompt: 'Pays de la forêt amazonienne :' }));
  s.push({ type: 'cityTap', quest: 'carto', qnum: 'Q2', item: 'city-' + pick(['manaus', 'belem']), city: null });
  s[s.length - 1].city = s[s.length - 1].item.slice(5);
  s.push({ type: 'fill', quest: 'labo', qnum: 'Q3', title: 'Les critères de la FAO', intro: FAO.intro, lines: FAO.blanks.map(b => [b.before + ' ', { a: b.answer, id: b.id, num: true, unit: b.unit }, ' ' + b.after]) });
  buildQuest('labo', null).filter(x => x.type === 'sort' && x.title.startsWith('Quel')).forEach(x => s.push(Object.assign(x, { subset: null })));
  s.push({ type: 'order', quest: 'nord', qnum: 'Q5', item: 'z-ordre' });
  s.push({ type: 'recall', quest: 'roles', qnum: 'Q6', item: 'act-6' });
  const r6 = ['eco', 'econ', 'soc'].flatMap(a => shuffle(ROLES.filter(r => r.aspect === a)).slice(0, 2)).map(r => ({ id: r.id, text: r.text, bucket: r.aspect }));
  s.push(Object.assign(sortStep({ quest: 'roles', qnum: 'Q7', title: 'Rôles de la forêt : quel aspect ?', buckets: Object.entries(ASPECTS).map(([k, v]) => ({ key: k, label: v })) }, r6), { subset: null }));
  AMAZON_FILL.forEach(f => s.push({ type: 'fill', quest: 'coeur', qnum: 'Q8', title: 'Complète l’énoncé', lines: [f.parts.map(p => typeof p === 'string' ? p : Object.assign({ id: f.id }, p))] }));
  AMAZON_CIRCLE.forEach(f => s.push({ type: 'circle', quest: 'coeur', qnum: 'Q9', item: f.id, parts: f.parts }));
  s.push({ type: 'match', quest: 'transport', qnum: 'Q10', rows: TRANSPORT.rows });
  s.push({ type: 'swipe', quest: 'couper', qnum: 'Q11', cards: shuffle(CUT_KEEP) });
  return s;
}

function mapMarkup(which, extra = '') {
  const m = MAPS[which];
  return `<div class="mapwrap"><svg viewBox="0 0 ${m.w} ${m.h}" preserveAspectRatio="xMidYMid meet">
    ${m.countries.map(c => `<path class="c" data-id="${c.id}" d="${c.d}"/>`).join('')}
    ${which === 'sa' ? `<polyline class="river-faint" points="${m.river.map(p => p.join(',')).join(' ')}"/>` : ''}
    <g class="labels"></g>${extra}</svg></div>`;
}
function svgPoint(svg, ev) { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function tweenViewBox(svg, to, ms = 650) {
  const from = svg.getAttribute('viewBox').split(' ').map(Number); const t0 = performance.now();
  if (REDUCED) { svg.setAttribute('viewBox', to.join(' ')); return; }
  const fr = (t) => { const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; svg.setAttribute('viewBox', from.map((v, i) => v + (to[i] - v) * e).join(' ')); if (k < 1) requestAnimationFrame(fr); };
  requestAnimationFrame(fr);
}
function zoomTo(svg, path, which) {
  const m = MAPS[which]; const b = path.getBBox(); const ar = m.w / m.h;
  let w = Math.max(b.width * 2.2, m.w * .28), h = w / ar; if (b.height * 2.2 > h) { h = b.height * 2.2; w = h * ar; }
  w = Math.min(w, m.w); h = Math.min(h, m.h);
  let x = b.x + b.width / 2 - w / 2, y = b.y + b.height / 2 - h / 2; x = Math.max(0, Math.min(m.w - w, x)); y = Math.max(0, Math.min(m.h - h, y));
  tweenViewBox(svg, [x, y, w, h]);
}
function addLabel(svg, which, id, text, cls = '') {
  const c = MAPS[which].countries.find(x => x.id === id); if (!c) return;
  const g = $('.labels', svg); const vb = svg.getAttribute('viewBox').split(' ').map(Number);
  const fs = Math.max(12, vb[2] / 45);
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', c.c[0]); t.setAttribute('y', c.c[1]); t.setAttribute('text-anchor', 'middle'); t.setAttribute('class', 'maplabel pop ' + cls); t.setAttribute('font-size', fs);
  t.textContent = text; g.appendChild(t); return t;
}
const frName = (id) => { const n = COUNTRY_FR[id]; return n ? n.charAt(0).toUpperCase() + n.slice(1) : null; };

const GAMES = {};

// ----- Choix multiple -----
GAMES.mcq = (stage, s, api) => {
  stage.appendChild(el(`<div class="panel fadein"><div class="qtitle">${s.q}</div></div>`));
  const box = el('<div class="opts"></div>'); let locked = false;
  s.options.forEach((o, i) => {

    b.onclick = () => {

      b.classList.add(ok ? 'good' : 'bad'); if (!ok) { box.children[s.answer].classList.add('good'); b.classList.add('shake'); } else burstAt(b, 20);

// ----- Toucher un pays -----
GAMES.mapTap = (stage, s, api) => {
  stage.appendChild(el(`<div class="panel fadein row"><div class="grow qtitle">${esc(s.prompt)} <span style="color:var(--acc);font-size:1.25em">${esc(s.target.name)}</span></div></div>`));
  const wrap = el(mapMarkup(s.map)); stage.appendChild(wrap);
  const tip = el('<p class="muted center" style="font-weight:700">Astuce : touche directement le pays.</p>'); stage.appendChild(tip);
  const svg = $('svg', wrap); api.ctx.found = api.ctx.found || { world: new Set(), sa: new Set() };
  api.ctx.found[s.map].forEach(id => { const p = $(`path[data-id="${id}"]`, svg); if (p && id !== s.target.id) p.classList.add('found'); });
  let tries = 0, done = false;
  const targetPath = $(`path[data-id="${s.target.id}"]`, svg);
  const finish = (ok) => {
    done = true; api.ctx.found[s.map].add(s.target.id);
    targetPath.classList.remove('bad'); targetPath.classList.add(ok ? 'good' : 'glow'); zoomTo(svg, targetPath, s.map);
    setTimeout(() => addLabel(svg, s.map, s.target.id, s.target.name), 500);
    if (ok) { const r = targetPath.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 30); }
    const where = s.map === 'sa' ? (s.target.id === 'GUF' ? 'C’est un territoire de la France, en Amérique du Sud.' : '') : '';
    setTimeout(() => api.result([{ id: s.item, ok }], { explain: ok ? `Oui, voilà ${esc(COUNTRY_FR[s.target.id] || s.target.name)}. ${where}` : `Le voici, en jaune : <b>${esc(s.target.name)}</b>. ${where} Regarde bien sa place sur la carte.` }), 1100);
  };

    const id = p.dataset.id;
    if (id === s.target.id) { finish(tries === 0); return; }
    tries++; p.classList.add('bad'); sfx('bad'); buzz(30);
    const lb = addLabel(svg, s.map, id, COUNTRY_FR[id] ? 'Ça, c’est ' + COUNTRY_FR[id] : 'Pas ce pays-là', '');
    setTimeout(() => { p.classList.remove('bad'); if (lb) lb.remove(); }, 1300);

};

// ----- Tracer le fleuve -----
GAMES.trace = (stage, s, api) => {
  stage.appendChild(el(`<div class="panel fadein"><div class="qtitle">Trace le fleuve <span style="color:var(--acc)">Amazone</span> avec ton doigt, d’ouest en est.</div><p class="muted" style="margin-top:6px">Pars du point qui clignote (au Pérou) et suis le fleuve jusqu’à l’océan Atlantique.</p></div>`));
  const R = MAPS.sa.river; const st0 = R[0];
  const wrap = el(mapMarkup('sa', `<polyline class="river-draw" points=""/><polyline class="river-flow" points="" style="display:none"/><circle cx="${st0[0]}" cy="${st0[1]}" r="18" fill="#e0249a" class="pulse"/><circle cx="${st0[0]}" cy="${st0[1]}" r="9" fill="#e0249a" stroke="#fff" stroke-width="3"/>`));
  stage.appendChild(wrap);
  const help = el('<div class="row"><span class="grow"></span><button class="btn alt" id="show">Je n’y arrive pas, montre-moi</button></div>'); stage.appendChild(help);
  const svg = $('svg', wrap), draw = $('.river-draw', svg), flow = $('.river-flow', svg);
  let prog = 0, active = false, done = false;
  const render = () => draw.setAttribute('points', R.slice(0, prog + 1).map(p => p.join(',')).join(' '));
  const complete = (ok) => {
    done = true; prog = R.length - 1; render(); flow.style.display = ''; flow.setAttribute('points', R.map(p => p.join(',')).join(' '));
    const r = wrap.getBoundingClientRect(); if (ok) burst(r.left + r.width * .64, r.top + r.height * .35, 40);
    setTimeout(() => api.result([{ id: s.item, ok }], { explain: 'L’Amazone coule d’ouest en est : des Andes, au Pérou, jusqu’à l’océan Atlantique. Elle passe par Manaus.' }), 900);
  };
  const move = (ev) => {
    if (!active || done) return; const pt = svgPoint(svg, ev);
    for (let i = prog; i < Math.min(R.length, prog + 6); i++) { if (Math.hypot(pt.x - R[i][0], pt.y - R[i][1]) < 34) { if (i > prog) { prog = i; render(); if (prog % 8 === 0) sfx('tap'); } } }
    if (prog >= R.length - 2) complete(true);
  };
  svg.addEventListener('pointerdown', (ev) => { active = true; svg.setPointerCapture(ev.pointerId); move(ev); });
  svg.addEventListener('pointermove', move);

/* =========================================================
   MOTEUR DE PARTIE (quête, séance, examen)
   ========================================================= */
function startQuest(key) { const steps = buildQuest(key, null); runSteps(steps, { mode: 'quest', title: QUESTS.find(q => q.key === key).title, quest: key }); }
function startSession() {
  let due = ITEMS.filter(i => isDue(i.id));
  if (!due.length) { go(() => screenNothingDue()); return; }
  // priorité : jamais vus et boîtes faibles ; limite ~28 éléments ; quêtes entremêlées
  due.sort((a, b) => st(a.id).b - st(b.id).b || Math.random() - .5);
  const chosen = new Set(due.slice(0, 28).map(i => i.id));
  const quests = shuffle(QUESTS.map(q => q.key).filter(k => ITEMS.some(i => i.quest === k && chosen.has(i.id))));
  let steps = [];
  quests.forEach(k => steps = steps.concat(buildQuest(k, chosen)));
  runSteps(steps, { mode: 'session', title: 'Séance du jour' });
}
function screenNothingDue() {
  const n = mount(`<div class="screen fadein center" style="justify-content:center;min-height:90vh"><div class="panel hero">${compSVG(90)}<div><h2>Tout est à jour</h2><p>${esc(compName())} : « Tu as fait tout ce qu’il fallait pour aujourd’hui. Ton cerveau a besoin de temps entre les séances pour bien retenir. Tu peux quand même jouer une quête ou faire un examen blanc. »</p></div></div><div class="row center"><button class="btn" id="m">L’expédition</button><button class="btn alt" id="h">Accueil</button></div></div>`);
  $('#m', n).onclick = () => go(screenMap); $('#h', n).onclick = () => go(screenHome);
}
function startExam() { runSteps(buildExam(), { mode: 'exam', title: 'Examen blanc' }); }

function runSteps(steps, opt) {
  const run = { steps: steps.slice(), i: 0, opt, results: [], seeds: 0, total: steps.length, ctx: {}, retried: new Set() };
  go(() => renderStep(run));
}
function renderStep(run) {
  if (run.i >= run.steps.length) { finishRun(run); return; }
  const step = run.steps[run.i]; window.__step = step;
  const q = QUESTS.find(x => x.key === step.quest);
  setBiome(q ? q.biome : 'default');
  const done = run.i, pct = Math.round(100 * done / run.steps.length);
  const n = mount(`<div class="screen fadein">
    <div class="topbar"><button class="btn alt" id="quit">Quitter</button><div class="progress"><div style="width:${pct}%"></div></div><span class="chip">${icon('seed', 18)} ${S.seeds}</span></div>
    <div class="row muted" style="font-weight:800;font-size:15px"><span>${esc(run.opt.title)}${q && run.opt.mode !== 'quest' ? ' · ' + esc(q.title) : ''}</span><span class="grow"></span><span>${q ? q.q + ' du cahier' : ''}</span></div>
    <div id="stage" class="grow" style="display:flex;flex-direction:column;gap:14px"></div></div>`);
  $('#quit', n).onclick = () => { if (run.results.length) finishRun(run, true); else go(screenHome); };
  const api = {
    ctx: run.ctx, exam: run.opt.mode === 'exam',
    result: (results, info = {}) => onResult(run, step, results, info)
  };
  GAMES[step.type](  $('#stage', n), step, api);
}
function onResult(run, step, results, info) {
  let gained = 0;
  results.forEach(r => { run.results.push(Object.assign({ q: step.qnum || '' }, r)); if (record(r.id, r.ok)) gained++; });
  run.seeds += gained;
  const allOk = results.every(r => r.ok);
  // Requeue des éléments ratés (une fois), sauf en examen
  if (!allOk && run.opt.mode !== 'exam' && step.subset) {
    const failed = results.filter(r => !r.ok).map(r => r.id);
    const key = step.type + ':' + failed.join(',');
    if (!run.retried.has(key)) { run.retried.add(key); const again = step.subset(failed); if (again) run.steps.push(Object.assign(again, { retry: true })); }
  }
  showFeedback(allOk, info, gained, () => { run.i++; renderStep(run); });
}
function showFeedback(ok, info, gained, next) {
  if (ok) { sfx('good'); buzz(25); } else { sfx('bad'); buzz([40, 60, 40]); }
  const fb = el(`<div class="feedback ${ok ? 'good' : 'bad'}"><div class="panel">
    <div class="comp">${compSVG(64, ok ? 'hop' : 'shake')}</div>
    <div class="grow"><div class="fb-title">${esc(info.title || fmt(pick(ok ? PRAISE : OOPS)))}</div>
    ${info.explain ? `<p style="margin-top:4px">${info.explain}</p>` : ''}
    ${gained ? `<p class="muted" style="font-size:15px;margin-top:4px">+${gained} graine${gained > 1 ? 's' : ''} pour ta forêt</p>` : ''}</div>
    <button class="btn" id="cont">Continuer</button></div></div>`);
  document.body.appendChild(fb);
  requestAnimationFrame(() => requestAnimationFrame(() => fb.classList.add('show')));
  if (ok) burst(innerWidth / 2, innerHeight - 120, 22);
  let used = false;
  const go2 = () => { if (used) return; used = true; sfx('tap'); fb.classList.remove('show'); setTimeout(() => fb.remove(), 350); next(); };
  $('#cont', fb).onclick = go2;
  $('#cont', fb).focus({ preventScroll: true });
}
function finishRun(run, quit) {
  const total = run.results.length, good = run.results.filter(r => r.ok).length;
  if (total) { S.sessions[dayStr()] = (S.sessions[dayStr()] || 0) + 1; }
  if (run.opt.mode === 'exam' && total) S.exams.push({ d: dayStr(), score: Math.round(100 * good / total) });
  const nb = checkBadges();
  let examBlock = '';
  if (run.opt.mode === 'exam' && total) {
    const score = Math.round(100 * good / total);
    const byQ = {};
    run.results.forEach(r => { const k = r.q || '?'; byQ[k] = byQ[k] || [0, 0]; byQ[k][1]++; if (r.ok) byQ[k][0]++; });
    const weak = Object.entries(byQ).filter(([, v]) => v[0] < v[1]).map(([k]) => k);
    examBlock = `<div class="panel center"><div class="score">${score} %</div><p class="muted">Résultat de l’examen blanc</p></div>
      <div class="panel"><h3>Par question du cahier</h3><div class="reveal-list" style="margin-top:10px">${Object.entries(byQ).sort((a, b) => parseInt(a[0].slice(1)) - parseInt(b[0].slice(1))).map(([k, v]) => `<span class="${v[0] === v[1] ? 'got' : ''}">${k} : ${v[0]}/${v[1]}</span>`).join('')}</div>
      ${weak.length ? `<p style="margin-top:10px">À revoir : <b>${weak.join(', ')}</b>. La séance du jour va te les ramener.</p>` : '<p style="margin-top:10px"><b>Tout est réussi.</b></p>'}</div>`;
  }
  save();
  go(() => {
    setBiome('default');
    const n = mount(`<div class="screen fadein">
      <div class="panel hero">${compSVG(90, 'hop')}<div class="grow"><h2>${quit ? 'Pause bien méritée' : 'Expédition terminée'}</h2><p>${esc(compName())} : « ${total ? `${good} bonne${good > 1 ? 's' : ''} réponse${good > 1 ? 's' : ''} sur ${total}.` : 'À la prochaine !'} ${good === total && total ? 'Impressionnant, ' + esc(S.name) + '.' : 'Chaque erreur d’aujourd’hui, c’est une réponse que tu vas retenir.'} »</p></div></div>
      ${examBlock}
      ${nb.length ? `<div class="panel"><h3>Nouveau badge${nb.length > 1 ? 's' : ''}</h3><div class="badges" style="margin-top:10px">${nb.map(b => `<div class="bdg new">${icon(b.icon, 40)}${esc(b.name)}</div>`).join('')}</div></div>` : ''}
      ${run.seeds ? `<div class="panel row">${icon('seed', 40)}<p class="grow"><b>+${run.seeds} graine${run.seeds > 1 ? 's' : ''}</b> à planter dans ta forêt.</p><button class="btn" id="pl">Planter</button></div>` : ''}
      <div class="row"><button class="btn alt" id="hm">Accueil</button><span class="grow"></span><button class="btn" id="mp">L’expédition</button></div></div>`);
    if (!quit && total) { sfx('win'); confetti(); }
    $('#hm', n).onclick = () => go(screenHome); $('#mp', n).onclick = () => go(screenMap);
    if ($('#pl', n)) $('#pl', n).onclick = () => go(screenForest);
  });
}

/* =========================================================
   MA FORÊT
   ========================================================= */
const ZONE_OF = { conifere: 'boreale', feuillu: 'feuillus', tropical: 'tropicale' };
const ZONE_X = { boreale: [0.02, 0.36], feuillus: [0.40, 0.68], tropicale: [0.76, 0.98] };
const ZONE_NAME = { boreale: 'forêt boréale', feuillus: 'forêt de feuillus', tropicale: 'forêt tropicale' };
function screenForest() {
  setBiome('default');
  const n = mount(`<div class="screen fadein">
    <div class="topbar"><button class="btn alt" id="bk">Retour</button><h2 class="grow">Ma forêt</h2><span class="chip" id="sd">${icon('seed', 20)} ${S.seeds}</span></div>
    <canvas class="forestcv" id="fc"></canvas>
    <div id="msg" class="fact">${S.seeds ? 'Choisis un arbre à planter. Il ira pousser dans la bonne forêt.' : 'Plus de graines pour l’instant. Réponds à des défis pour en gagner.'}</div>
    <div class="species" id="spl">${SPECIES.map(s => `<div class="panel sp" data-k="${s.key}"><canvas width="60" height="70"></canvas>${s.name}</div>`).join('')}</div></div>`);
  $('#bk', n).onclick = () => go(screenHome);
  $$('.sp', n).forEach(d => { const c = $('canvas', d).getContext('2d'); drawTree(c, d.dataset.k, 30, 66, 3, 1, true); d.onclick = () => plant(d.dataset.k, d); });
  const cv = $('#fc', n); let anim = null;
  const draw = (extraG) => {
    const w = cv.clientWidth, h = Math.round(Math.min(420, Math.max(260, w * .45)));
    const dpr = Math.min(2, devicePixelRatio || 1); cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.imageSmoothingEnabled = false;
    const night = S.theme === 'aurore';
    const sky = c.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, night ? '#0b1a3f' : S.theme === 'jungle' ? '#5fa86a' : '#8fd3f5'); sky.addColorStop(1, night ? '#24467a' : S.theme === 'jungle' ? '#b6e08a' : '#e4f6ff');
    c.fillStyle = sky; c.fillRect(0, 0, w, h);
    const gy = h * .42;
    // sols des 3 zones + eau
    const zcol = { boreale: ['#5a7a48', '#4d6b3d'], feuillus: ['#7a9a44', '#6b8a3a'], tropicale: ['#3f8f4a', '#357a3f'] };
    Object.entries(ZONE_X).forEach(([z, [a, b]]) => { c.fillStyle = zcol[z][0]; c.fillRect(a * w, gy, (b - a) * w, h - gy); c.fillStyle = zcol[z][1]; for (let i = 0; i < 40; i++) c.fillRect(a * w + ((i * 53) % ((b - a) * w)), gy + ((i * 37) % (h - gy)), 6, 6); });
    c.fillStyle = night ? '#2a5a9a' : '#4aa3df'; c.fillRect(0.68 * w, gy, 0.08 * w, h - gy);
    c.fillStyle = 'rgba(255,255,255,.35)'; for (let i = 0; i < 8; i++) c.fillRect(0.69 * w + (i % 2) * 10, gy + 14 + i * 22, 12, 3);
    c.font = '800 13px Nunito, sans-serif'; c.fillStyle = night ? '#fff' : '#1d2330';
    Object.entries(ZONE_X).forEach(([z, [a]]) => c.fillText(ZONE_NAME[z].toUpperCase(), a * w + 6, gy - 8));
    const s = Math.max(3, Math.round(w / 150));
    S.forest.slice().sort((p, q) => p.y - q.y).forEach((t, i) => { const g = (extraG && t === extraG.t) ? extraG.g : 1; drawTree(c, t.sp, t.x * w, gy + t.y * (h - gy - 8) + 8, s, g, true); });
    if (!S.forest.length) { c.font = '800 18px Nunito, sans-serif'; c.fillStyle = 'rgba(0,0,0,.45)'; c.fillText('Ta forêt est encore vide…', w * .3, h * .75); }
  };
  draw();
  const ro = new ResizeObserver(() => draw()); ro.observe(cv);
  function plant(k, card) {
    const sp = SPECIES.find(s => s.key === k);
    if (S.seeds <= 0) { card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 400); $('#msg', n).textContent = 'Plus de graines. Fais une séance pour en gagner.'; sfx('bad'); return; }
    const zone = ZONE_OF[sp.fam], [a, b] = ZONE_X[zone];
    const t = { sp: k, x: a + .03 + Math.random() * (b - a - .06), y: Math.random() };
    S.forest.push(t); S.seeds--; save(); if (checkBadges().length) setTimeout(() => { sfx('win'); confetti(); $('#msg', n).innerHTML += ' <b>Nouveau badge : Jardinière.</b>'; }, 800);
    $('#sd', n).innerHTML = icon('seed', 20) + ' ' + S.seeds;
    $('#msg', n).innerHTML = `<b>${sp.name}</b> → ${ZONE_NAME[zone]} (c’est un ${FAMILIES[sp.fam].toLowerCase()}). ${sp.fact}`;
    sfx('plant'); buzz(20);
    const r = cv.getBoundingClientRect(); burst(r.left + t.x * r.width, r.top + r.height * .75, 30);
    const t0 = performance.now(); cancelAnimationFrame(anim);
    const fr = (tt) => { const g = Math.min(1, (tt - t0) / 700); draw({ t, g: 1 - Math.pow(1 - g, 3) }); if (g < 1) anim = requestAnimationFrame(fr); };
    anim = requestAnimationFrame(fr);
  }
}

/* =========================================================
   BADGES
   ========================================================= */
const BADGES = QUESTS.map(q => ({ id: 'q-' + q.key, name: q.title, icon: q.icon, ok: () => masteryPct(q.key) === 100 })).concat([
  { id: 'premiere', name: 'Première séance', icon: 'star', ok: () => Object.keys(S.sessions).length >= 1 },
  { id: 'trois-jours', name: '3 jours d’étude', icon: 'seed', ok: () => Object.keys(S.sessions).length >= 3 },
  { id: 'jardin', name: 'Jardinière : 10 arbres', icon: 'tree', ok: () => S.forest.length >= 10 },
  { id: 'style', name: 'Premier accessoire', icon: 'leaf', ok: () => (S.acc || []).length >= 1 },
  { id: 'examen90', name: 'Examen blanc 90 %', icon: 'lab', ok: () => (S.exams || []).some(e => e.score >= 90) }
]);
function checkBadges() {
  const fresh = BADGES.filter(b => !S.badges.includes(b.id) && b.ok());
  fresh.forEach(b => { S.badges.push(b.id); S.newBadges = (S.newBadges || []).concat(b.id); });
  if (fresh.length) save();
  return fresh;
}

/* =========================================================
   BOUTIQUE
   ========================================================= */
function screenShop() {
  setBiome('default');
  const all = Object.entries(HATS).map(([k, v]) => ({ k, slot: 'hat', ...v })).concat(Object.entries(AURAS).map(([k, v]) => ({ k, slot: 'aura', ...v })));
  const render = () => {
    const n = mount(`<div class="screen fadein">
      <div class="topbar"><button class="btn alt" id="bk">Retour</button><h2 class="grow">Boutique</h2><span class="chip">${icon('seed', 20)} ${S.seeds}</span></div>
      <div class="panel hero center" style="justify-content:center"><div id="big">${compSVG(150)}</div><div><h3>${esc(compName())}</h3><p class="muted">Touche un objet pour l’acheter, puis pour le porter ou le retirer. Tes graines servent aussi à planter des arbres : à toi de choisir.</p></div></div>
      <div class="shop">${all.map(it => { const own = S.acc.includes(it.k), worn = S.wear[it.slot] === it.k;
        const prev = it.slot === 'hat' ? compSVG(70, '', it.k, '') : compSVG(70, '', '', it.k);
        return `<div class="panel item ${worn ? 'worn' : ''}" data-k="${it.k}" data-slot="${it.slot}">${prev}<span>${esc(it.name)}</span><span class="price chip">${own ? (worn ? 'Porté' : 'À toi') : icon('seed', 16) + ' ' + it.price}</span></div>`; }).join('')}</div>
      <div id="msg" class="fact">${S.acc.length ? 'Ta collection : ' + S.acc.length + ' objet' + (S.acc.length > 1 ? 's' : '') + '.' : 'Ton premier accessoire débloque un badge.'}</div></div>`);
    $('#bk', n).onclick = () => go(screenHome);
    $$('.item', n).forEach(d => d.onclick = () => {
      const it = all.find(x => x.k === d.dataset.k);
      if (S.acc.includes(it.k)) { S.wear[it.slot] = S.wear[it.slot] === it.k ? '' : it.k; save(); sfx('tap'); render(); burstAt($('#big'), 20); return; }
      if (S.seeds < it.price) { d.classList.add('shake'); setTimeout(() => d.classList.remove('shake'), 400); sfx('bad'); $('#msg', n).textContent = `Il te manque ${it.price - S.seeds} graine${it.price - S.seeds > 1 ? 's' : ''}. Une séance du jour t’en donnera.`; return; }
      S.seeds -= it.price; S.acc.push(it.k); S.wear[it.slot] = it.k; save(); checkBadges();
      sfx('win'); buzz([20, 40, 20]); render(); burstAt($('#big'), 40, 'gold');
    });
  };
  render();
}

/* ---------- Démarrage ---------- */
function boot() {
  applyTheme(); bgInit();
  document.addEventListener('pointerdown', () => audio(), { once: true });
  if (S.onboarded) screenHome(); else screenWelcome();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
}

boot();
</script>
