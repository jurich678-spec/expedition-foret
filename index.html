body.t-briques h1,body.t-briques h2,body.t-briques .btn{font-weight:900}
body.t-briques .btn{box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 6px 0 rgba(28,38,51,.4)}
.pv-briques{background:linear-gradient(#4fc3ff,#c4ecff 62%,#3cc46a 62%,#3cc46a 74%,#2a9a52 74%)}
.pv-briques:before,.pv-briques:after{content:'';position:absolute;width:26px;height:26px;border-radius:5px;background:#ff5a5a;box-shadow:inset -5px -5px 0 rgba(0,0,0,.2),inset 4px 4px 0 rgba(255,255,255,.4);left:25%;top:30%;animation:fly 2.6s ease-in-out infinite alternate}
.pv-briques:after{background:#ffd23f;left:62%;top:22%;width:20px;height:20px;animation-delay:-1.3s}
body.t-aurore{
  --bg1:#081430;--bg2:#13284d;--ink:#eef4ff;--ink2:#a9b8d6;--panel:rgba(20,34,66,.95);--panel2:rgba(40,62,110,.92);--line:#6fe3c1;
  --acc:#4fd6a8;--acc2:#2aa883;--radius:18px;--shadow:0 0 24px rgba(79,214,168,.25);--border:2px solid rgba(111,227,193,.55);
  --title:'Nunito',system-ui,sans-serif;
}
body.t-jungle{
  --bg1:#0f3b25;--bg2:#1f5f33;--ink:#f3f8ea;--ink2:#bdd6b0;--panel:rgba(16,52,32,.95);--panel2:rgba(34,90,52,.92);--line:#b8e65a;
  --acc:#b8e65a;--acc2:#7fb52f;--radius:24px;--shadow:0 10px 30px rgba(0,0,0,.35);--border:2px solid rgba(184,230,90,.5);
  --title:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--body);color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}
#bg,#fx,#wipe{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:50}#wipe{z-index:60}
#app{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.screen{min-height:100%;max-width:980px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 18px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,.btn,.title{font-family:var(--title)}
h1{font-size:clamp(34px,7vw,64px);margin:0;line-height:1.05;letter-spacing:.5px}
h2{font-size:clamp(24px,4.4vw,36px);margin:0}
h3{font-size:clamp(19px,3.2vw,24px);margin:0}
p{margin:0;line-height:1.45;font-size:clamp(16px,2.6vw,20px)}
.muted{color:var(--ink2)}
.panel{background:var(--panel);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
body.t-blocs .panel{box-shadow:inset -4px -4px 0 rgba(0,0,0,.12),inset 4px 4px 0 rgba(255,255,255,.6),0 6px 0 rgba(0,0,0,.25)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.center{text-align:center;align-items:center;justify-content:center}
.btn{appearance:none;border:var(--border);border-radius:var(--radius);background:var(--acc);color:#fff;font-size:clamp(18px,3vw,24px);padding:14px 22px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.25)}
body.t-blocs .btn{box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.35),0 6px 0 rgba(0,0,0,.3)}
body.t-aurore .btn,body.t-jungle .btn{color:#06210f;text-shadow:none}
body.t-aurore .btn.alt,body.t-jungle .btn.alt,body.t-aurore .btn.ghost,body.t-jungle .btn.ghost{color:var(--ink)}
body.t-aurore .btn.warn,body.t-jungle .btn.warn{color:#2a1200}
.btn:active{transform:translateY(4px) scale(.98)}
.btn.big{font-size:clamp(22px,3.8vw,30px);padding:20px 26px}
.btn.alt{background:var(--panel2);color:var(--ink);text-shadow:none}
.btn.warn{background:var(--warn)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink);text-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.pix{image-rendering:pixelated;display:block}
input.txt{font:inherit;font-size:clamp(18px,3vw,24px);padding:12px 14px;border:var(--border);border-radius:calc(var(--radius) / 2);background:rgba(255,255,255,.95);color:#1d2330;width:100%;user-select:text;-webkit-user-select:text}
input.txt:focus{outline:4px solid var(--gold)}
/* topbar */
.topbar{display:flex;align-items:center;gap:10px}
.topbar .btn{padding:8px 14px;font-size:18px}
.progress{flex:1;height:18px;background:rgba(0,0,0,.18);border-radius:var(--radius);overflow:hidden;border:2px solid var(--line)}
.progress>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));width:0;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel2);border:2px solid var(--line);font-weight:800;font-size:16px}
/* choix (onboarding) */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.choice{cursor:pointer;padding:16px;text-align:center;transition:transform .15s}
.choice.sel{outline:5px solid var(--gold);transform:translateY(-4px)}
.choice .pix{margin:0 auto 8px}
.preview{height:110px;border-radius:calc(var(--radius) / 1.5);margin-bottom:10px;position:relative;overflow:hidden;border:2px solid rgba(0,0,0,.25)}
.pv-blocs{background:linear-gradient(#7ec8f0,#bfe6ff 60%,#5aa83a 60%,#5aa83a 72%,#8a5a32 72%);image-rendering:pixelated}
.pv-blocs:after{content:'';position:absolute;left:10%;top:18%;width:40px;height:16px;background:#fff;box-shadow:16px -8px 0 #fff,32px 0 0 #fff;animation:cloud 6s linear infinite}
.pv-aurore{background:linear-gradient(#050c22,#1a2f5a)}
.pv-aurore:before{content:'';position:absolute;inset:-20% -10% 40%;background:linear-gradient(100deg,transparent 20%,rgba(79,214,168,.7) 40%,rgba(140,110,255,.5) 60%,transparent 80%);filter:blur(10px);animation:aur 4s ease-in-out infinite alternate}
.pv-jungle{background:radial-gradient(circle at 30% 70%,#2f8a45,#0f3b25 70%)}
.pv-jungle:before,.pv-jungle:after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:#e9ff8a;box-shadow:0 0 12px #e9ff8a;left:30%;top:40%;animation:fly 3s ease-in-out infinite alternate}
.pv-jungle:after{left:70%;top:60%;animation-delay:-1.5s}
@keyframes cloud{from{transform:translateX(-60px)}to{transform:translateX(260px)}}
@keyframes aur{to{transform:translateX(20%) skewX(-10deg)}}
@keyframes fly{to{transform:translate(30px,-25px)}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hop{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{30%{transform:translateY(-22px) scale(1.08,.94)}60%{transform:translateY(0) scale(.95,1.06)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.fadein{animation:fadein .4s both}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}}
/* accueil */
.hero{display:flex;align-items:center;gap:16px}
.hero .comp{flex:none}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),rgba(0,0,0,.15) 0);display:grid;place-items:center;flex:none}
.ring>span{width:72px;height:72px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:900;font-size:22px;font-family:var(--title)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.menu .btn{justify-content:flex-start;text-align:left;min-height:84px}
.btn small{display:block;font-family:var(--body);font-weight:600;font-size:15px;opacity:.9;text-shadow:none}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.day{flex:none;width:64px;padding:8px 4px;text-align:center;border:2px solid var(--line);border-radius:calc(var(--radius) / 2);background:var(--panel2);font-weight:800;font-size:14px}
.day.done{background:var(--good);color:#fff}
.day.today{outline:4px solid var(--gold)}
.day.exam{background:var(--warn);color:#fff}
/* carte d'expédition */
.trail{position:relative;display:grid;gap:14px}
.node{display:flex;align-items:center;gap:14px;cursor:pointer;padding:14px}
.node:nth-child(even){margin-left:8%}
.node .badge{width:64px;height:64px;flex:none;display:grid;place-items:center;background:var(--panel2);border:var(--border);border-radius:calc(var(--radius) / 1.2)}
.node .mini{height:10px;background:rgba(0,0,0,.15);border-radius:6px;overflow:hidden;margin-top:6px}
.node .mini>div{height:100%;background:var(--acc)}
/* jeux */
.qtitle{font-size:clamp(20px,3.4vw,28px);font-weight:900;line-height:1.25}
.opts{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{font-family:var(--body);font-size:clamp(17px,2.8vw,22px);font-weight:800;padding:16px;text-align:left;background:var(--panel);color:var(--ink);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;transition:transform .1s,background .2s}
.opt:active{transform:scale(.97)}
.opt.good{background:var(--good);color:#fff}
.opt.bad{background:var(--bad);color:#fff}
.opt.sel{outline:5px solid var(--gold)}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px 18px max(16px,env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1)}
.feedback.show{transform:none}
.feedback .panel{max-width:940px;margin:0 auto;display:flex;gap:14px;align-items:center}
.feedback.good .panel{border-color:var(--good)}
.feedback.bad .panel{border-color:var(--warn)}
.fb-title{font-family:var(--title);font-size:24px;font-weight:900}
.feedback.good .fb-title{color:var(--good)}
.feedback.bad .fb-title{color:var(--warn)}
.mapwrap{position:relative;width:100%;border:var(--border);border-radius:var(--radius);overflow:hidden;background:#62a9de;touch-action:pan-y}
.mapwrap.parch{background:#bfd9d6;border-color:#5c4424}
.mapwrap.parch:after{content:'';position:absolute;top:5px;left:5px;right:5px;bottom:5px;border:2px solid rgba(92,68,36,.45);border-radius:calc(var(--radius) / 1.4);pointer-events:none}
.mapin{position:relative;transform-origin:0 0;will-change:transform}
.mapin svg{display:block;width:100%;height:auto;max-height:62vh;margin:0 auto}
.mapin svg.fx{position:absolute;left:0;top:0;height:100%;pointer-events:none}
.mapwrap path.c{fill:#f3efe2;stroke:#6b7280;stroke-width:.6}
body.t-aurore .mapwrap:not(.parch) path.c{fill:#2a3f6e;stroke:#5c7bb3}
body.t-jungle .mapwrap:not(.parch) path.c{fill:#2f6a3c;stroke:#5c9a5a}
.mapwrap.parch path.c{fill:#f1e4c3;stroke:#a88c62;stroke-width:.5}
.mapwrap path.c.good{fill:var(--good)!important}
.mapwrap path.c.found{fill:#8ad08f!important}
.mapwrap path.c.bad{fill:var(--bad)!important}
.mapwrap path.c.glow{fill:var(--gold)!important;stroke:#9a6b00;stroke-width:1.6}
.geo{font-family:var(--body);font-weight:900;letter-spacing:.14em;fill:#7a5c33;opacity:.72;pointer-events:none}
.geo.o{font-style:italic;font-weight:800;fill:#4a7b86;letter-spacing:.2em}
.zn{stroke:#8a6a3a;stroke-width:.6}
.zn.on{stroke:#3a2c18;stroke-width:.8}
.zn.ask{stroke:#8a5a00;stroke-width:1.8}
.zn.dim{opacity:.35}
.zn.flash{animation:znf .45s 2}
@keyframes znf{50%{opacity:.2}}
.maplabel{font-family:var(--body);font-weight:900;font-size:16px;fill:#1d2330;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.lbin{animation:lbin .3s both}
@keyframes lbin{from{opacity:0}}
.rip{animation:rip .5s ease-out both;transform-origin:center;transform-box:fill-box}
@keyframes rip{from{transform:scale(.3);opacity:.95}to{transform:scale(1.6);opacity:0}}
.river-faint{fill:none;stroke:#7fb2d9;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.river-draw{fill:none;stroke:#e0249a;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.river-flow{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:6 18;stroke-linecap:round;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.6);opacity:.3}}
.hl{color:var(--acc);font-size:1.15em}
.tipline{font-weight:700}
.palette{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pal{display:flex;align-items:center;gap:10px;font-family:var(--body);font-weight:900;font-size:clamp(16px,2.7vw,20px);padding:12px 14px;border-radius:var(--radius);border:var(--border);background:var(--panel);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;text-align:left}
.pal i{flex:none;width:30px;height:30px;border-radius:8px;background:var(--c);border:3px solid var(--line)}
.pal.sel{outline:5px solid var(--gold);background:var(--panel2)}
.pal.done{opacity:.55}
/* tri */
.buckets{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.bucket{min-height:110px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.bucket.hint{outline:4px dashed var(--gold)}
.bucket h3{font-size:18px;font-family:var(--body);font-weight:900;line-height:1.2}
.bucket .dropped{font-size:14px;font-weight:700;padding:4px 8px;background:var(--panel2);border-radius:8px}
.card{padding:16px;font-size:clamp(18px,3vw,23px);font-weight:800;text-align:center}
/* phrases à compléter */
.sentence{font-size:clamp(19px,3.2vw,26px);line-height:2.1;font-weight:700}
.sentence input{font:inherit;font-weight:900;width:7.5em;padding:2px 8px;border:none;border-bottom:4px solid var(--acc);background:rgba(255,255,255,.9);color:#1d2330;border-radius:6px;text-align:center;user-select:text;-webkit-user-select:text}
.sentence input.ok{border-color:var(--good);background:#d9f5df}
.sentence input.ko{border-color:var(--warn);background:#ffe6d6}
.pick{display:inline-flex;gap:6px;vertical-align:middle}
.pick button{font:inherit;font-size:.9em;font-weight:800;padding:2px 12px;border-radius:999px;border:3px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.pick button.on{background:var(--gold);color:#1d2330;box-shadow:0 0 0 4px rgba(242,195,53,.4)}
.pick button.good{background:var(--good);color:#fff}
.pick button.bad{background:var(--bad);color:#fff;text-decoration:line-through}
/* relier */
.match{position:relative;display:grid;grid-template-columns:1.4fr .5fr 1fr;gap:10px;align-items:center}
.match svg.lines{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mrow{padding:12px 14px;font-weight:800;font-size:clamp(15px,2.5vw,19px);cursor:pointer;position:relative}
.mrow.sel{outline:5px solid var(--gold)}
.mrow.done{opacity:.75}
.mtarget{padding:16px;font-weight:900;font-size:clamp(16px,2.7vw,21px);cursor:pointer;text-align:center}
/* swipe */
.deck{position:relative;height:300px;max-width:520px;width:100%;margin:0 auto}
.swcard{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-size:clamp(22px,4vw,30px);font-weight:900;padding:24px;touch-action:none;cursor:grab}
.swcard .tag{position:absolute;top:18px;padding:6px 14px;border:4px solid;border-radius:10px;font-family:var(--title);font-size:22px;opacity:0}
.swcard .tag.l{left:18px;color:var(--good);border-color:var(--good);transform:rotate(-12deg)}
.swcard .tag.r{right:18px;color:var(--warn);border-color:var(--warn);transform:rotate(12deg)}
.sides{display:flex;justify-content:space-between;gap:12px;max-width:520px;margin:0 auto;width:100%}
/* ordre */
.zonecanvas{width:100%;display:block;border:var(--border);border-radius:var(--radius);background:#cfe0e6}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips .opt{text-align:center;flex:1 1 180px}
/* forêt */
.forestcv{width:100%;display:block;border:var(--border);border-radius:var(--radius)}
.species{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.sp{padding:8px;text-align:center;cursor:pointer;font-weight:800;font-size:15px}
.sp canvas{display:block;margin:0 auto}
.fact{font-size:16px;font-weight:700;padding:10px 14px;border-left:6px solid var(--gold);background:var(--panel2);border-radius:8px}
.reveal-list{display:flex;flex-wrap:wrap;gap:8px}
.reveal-list span{padding:6px 12px;border-radius:999px;font-weight:800;border:2px solid var(--line);background:var(--panel2)}
.reveal-list span.got{background:var(--good);color:#fff}
.reveal-list span.miss{background:var(--warn);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-weight:800;font-size:18px}
.toggle input{width:28px;height:28px}
.score{font-family:var(--title);font-size:clamp(48px,10vw,88px);font-weight:900;line-height:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (orientation:landscape) and (min-width:900px){.deck{height:260px}}

.aura-verte{filter:drop-shadow(0 0 4px #6cff8a) drop-shadow(0 0 12px #2bff5a) drop-shadow(0 0 20px #2bff5a)}
.aura-doree{filter:drop-shadow(0 0 4px #ffd84a) drop-shadow(0 0 12px #ffb800) drop-shadow(0 0 20px #ffb800)}
.aura-arc{filter:drop-shadow(0 0 5px #ff5ab4) drop-shadow(0 0 14px #ff5ab4) drop-shadow(0 0 22px #ff5ab4);animation:hue 3s linear infinite}
.aura-arc.bob{animation:hue 3s linear infinite,bob 1.6s ease-in-out infinite}
@keyframes hue{to{filter:drop-shadow(0 0 4px #ff5ab4) drop-shadow(0 0 9px #ff5ab4) hue-rotate(360deg)}}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{padding:12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800}
.item.worn{outline:5px solid var(--gold)}
.item .price{font-size:15px}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.bdg{width:96px;text-align:center;font-size:13px;font-weight:800;padding:8px 4px;border-radius:12px;border:2px solid var(--line);background:var(--panel2)}
.bdg .pix{margin:0 auto 4px}
.bdg.off{opacity:.35;filter:grayscale(1)}
.bdg.new{outline:4px solid var(--gold);animation:pop .5s}
.scene{display:block;width:100%;height:170px;border:var(--border);border-radius:var(--radius);image-rendering:pixelated}
.scene.tappable{cursor:pointer;outline:5px solid var(--gold);animation:pulsebox .6s ease-in-out infinite alternate}
@keyframes pulsebox{to{outline-color:#ff5a5a}}
.flyseed{position:fixed;z-index:70;pointer-events:none;transition:transform .8s cubic-bezier(.4,-0.3,.6,1),opacity .8s;margin:-15px 0 0 -15px}
.sp.sel{outline:5px solid var(--gold);transform:translateY(-3px)}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);cursor:pointer}
.sw.on{outline:4px solid var(--gold);transform:scale(1.12)}
.zoombar{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zb{width:48px;height:48px;border-radius:12px;border:3px solid #1d2330;background:#fff;color:#1d2330;font:900 26px Nunito,sans-serif;box-shadow:0 4px 0 rgba(0,0,0,.3);cursor:pointer;line-height:1}
.zb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.maplegend{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.9);color:#1d2330;border:2px solid #1d2330;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;pointer-events:none}
.maplegend i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#2e7d32}
.maplegend i.r{border-radius:2px;height:4px;width:18px;background:#7fb2d9}
.zoomhint{position:absolute;left:8px;top:8px;background:rgba(29,35,48,.75);color:#fff;font-size:13px;font-weight:800;padding:4px 8px;border-radius:8px;pointer-events:none;transition:opacity .6s}
@media (max-height:900px){.scene{height:130px}}
.opt.chk{display:flex;gap:12px;align-items:center}
.opt.chk .box{flex:none;width:26px;height:26px;border:3px solid var(--line);border-radius:6px;background:#fff}
.opt.chk.sel .box{background:var(--gold)}
.opt.chk.good .box{background:#fff}

/* matière, bannière, accueil */
.subj{display:inline-block;flex:none;background:#8a3b12;color:#fff6df;font-weight:900;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:4px 11px;border-radius:999px;line-height:1.3}
body.ch-foret .subj{background:#1f7a3d}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--radius);border:var(--border);box-shadow:var(--shadow);color:#3b2a14;background:linear-gradient(135deg,#f8ebc8,#e7cc92)}
.banner.b-foret{background:linear-gradient(135deg,#dff4cb,#a9dc8b);color:#173d1f}
.banner p{font-size:clamp(15px,2.4vw,18px)}
.bn-svg{width:clamp(96px,20vw,150px);height:auto;flex:none}
.bn-art{display:flex;align-items:flex-end;gap:4px;flex:none}
.bn-txt{min-width:200px}
.bn-title{font-size:clamp(20px,3.6vw,30px);line-height:1.15;margin:5px 0 3px}
.btn.sm{padding:8px 14px;font-size:17px}
.btn.cta{width:100%;justify-content:flex-start;text-align:left;min-height:96px}
.btn span{display:block}
.menu.two{grid-template-columns:1fr 1fr}
.menu.two .btn{min-height:64px}
details.fold summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary:after{content:'Voir';margin-left:auto;font-weight:800;font-size:15px;color:var(--ink2)}
details.fold[open] summary:after{content:'Cacher'}
.ver{font-size:14px}
.metarow{font-weight:800;font-size:15px;gap:8px}
.chip.st-ok{background:var(--good);color:#fff}
.chip.st-mid{background:var(--gold);color:#1d2330}
.newtopic{align-items:center}
/* fiches de révision */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:45;overflow-y:auto;background:linear-gradient(180deg,var(--bg1),var(--bg2));-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.sheet{max-width:980px;margin:0 auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-family:var(--body);font-size:17px;color:var(--ink);cursor:pointer}
.fbody{display:flex;flex-direction:column;gap:14px}
.fhead{display:flex;align-items:center;gap:14px}
.fsec h3{margin-bottom:10px}
.fsec h4{margin:0 0 4px;font-size:18px}
.fsec h4.pos{color:var(--good)}
.fsec h4.neg{color:var(--warn)}
.ans{font-size:clamp(17px,2.8vw,21px);font-weight:700;background:var(--panel2);border-left:6px solid var(--acc);padding:10px 14px;border-radius:8px;margin-top:8px}
.kv>div{display:grid;grid-template-columns:minmax(120px,26%) 1fr;gap:12px;padding:10px 0;border-top:2px solid rgba(0,0,0,.1)}
.kv>div:first-child{border-top:none;padding-top:0}
.kv b{font-size:clamp(16px,2.7vw,19px)}
.kv span{font-size:clamp(16px,2.6vw,19px);line-height:1.4}
.flist{margin:6px 0 0;padding-left:22px;font-size:clamp(16px,2.6vw,19px);line-height:1.5}
.flist li{margin:4px 0}
.fact.trick{border-left-color:var(--acc);line-height:1.45}
.rlist{display:grid;gap:8px;margin-top:12px}
.rcard{display:flex;align-items:center;gap:12px;text-align:left;font-family:var(--body);font-size:clamp(16px,2.7vw,19px);color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-left:10px solid var(--c);border-radius:12px;padding:10px 12px;cursor:pointer}
.rcard.sel{outline:4px solid var(--gold)}
.rletter{flex:none;width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}
.rsub{display:block;font-size:15px;color:var(--ink2);font-weight:600}
.ryear{flex:none;font-size:14px;font-weight:800;color:var(--ink2)}
.klist{display:grid;gap:10px;margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.krow{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.35}
.krow i{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);margin-top:2px}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tli{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-weight:700;font-size:clamp(15px,2.5vw,18px)}
.tli b{display:block;font-family:var(--title);font-size:clamp(26px,5vw,38px);color:var(--acc2)}
.tli.wide{grid-column:1/-1}
.tech{display:grid;gap:12px}
.trow{display:flex;gap:12px;align-items:center;font-size:clamp(16px,2.6vw,19px);line-height:1.35}
.trow .pix{flex:none}
.tri{width:100%;max-width:640px;display:block;margin:0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.two,.tl{grid-template-columns:1fr}.menu.two{grid-template-columns:1fr}}
/* mode léger : on coupe les animations qui tournent en boucle */
body.lite .bob,body.lite .pulse,body.lite .river-flow,body.lite .fadein,body.lite .lbin,body.lite .scene.tappable,body.lite .pv-briques:before,body.lite .pv-briques:after,body.lite .pv-blocs:after,body.lite .pv-aurore:before,body.lite .pv-jungle:before,body.lite .pv-jungle:after{animation:none}
body.lite .aura-verte{filter:drop-shadow(0 0 6px #2bff5a)}
body.lite .aura-doree{filter:drop-shadow(0 0 6px #ffb800)}
body.lite .aura-arc,body.lite .aura-arc.bob{filter:drop-shadow(0 0 6px #ff5ab4);animation:none}
body.lite .progress>div{transition:none}
/* carte des Amériques (haute) : en jeu, on garde de la place pour la question et les réponses */
#stage .mapwrap[data-map="am"] .mapin svg{max-height:46vh}
/* tablette à l'horizontale : question et boutons à gauche, carte à droite (tout tient dans l'écran, même avec le clavier) */
@media (orientation:landscape) and (min-width:900px){
  .screen.mapstep #stage{display:grid!important;grid-template-columns:minmax(300px,40%) 1fr;align-items:start;align-content:start;column-gap:14px}
  .screen.mapstep #stage>*{grid-column:1;min-width:0}
  .screen.mapstep #stage>.mapwrap{grid-column:2;grid-row:1/span 9}
  .screen.mapstep #stage .mapwrap .mapin svg{max-height:60vh}
  .screen.mapstep .opts,.screen.mapstep .palette{grid-template-columns:1fr}
  .screen.mapstep .match{grid-template-columns:1fr .25fr 1.25fr}
}
/* réponse au clavier : on cache la petite scène pour que la carte reste visible au-dessus du clavier */
.screen.typing #scenebox{display:none}

function buildItems() {
  const it = [];
  WORLD_TARGETS.forEach(c => it.push({ id: 'w-' + c.id, quest: 'monde', label: c.name + ' (carte du monde)' }));
  AMAZON_TARGETS.forEach(c => it.push({ id: 'a-' + c.id, quest: 'carto', label: c.name + ' (Amazonie)' }));
  it.push({ id: 'city-manaus', quest: 'carto', label: 'Situer Manaus' }, { id: 'city-belem', quest: 'carto', label: 'Situer Belém' }, { id: 'river', quest: 'carto', label: 'Tracer l’Amazone' });
  FAO.blanks.forEach(b => it.push({ id: b.id, quest: 'labo', label: 'Critère FAO' }));
  FAO.cases.forEach(c => it.push({ id: c.id, quest: 'labo', label: 'Est-ce une forêt ?' }));
  FORESTS.forEach(f => { it.push({ id: 'f-' + f.key + '-arbres', quest: 'labo', label: f.name + ' : arbres' }); it.push({ id: 'f-' + f.key + '-climat', quest: 'labo', label: f.name + ' : climat' }); });
  SPECIES.forEach(s => it.push({ id: 'sp-' + s.key, quest: 'labo', label: s.name }));
  it.push({ id: 'z-ordre', quest: 'nord', label: 'Les 5 zones dans l’ordre' });
  ['z-nord', 'z-sud', 'z-avant-boreale', 'z-apres-boreale'].forEach(z => it.push({ id: z, quest: 'nord', label: 'Position des zones' }));
  it.push({ id: 'act-6', quest: 'roles', label: 'Six activités en forêt' });
  ROLES.forEach(r => it.push({ id: r.id, quest: 'roles', label: r.text }));
  AMAZON_FILL.forEach(f => it.push({ id: f.id, quest: 'coeur', label: 'Compléter : Amazonie' }));
  AMAZON_CIRCLE.forEach(f => it.push({ id: f.id, quest: 'coeur', label: 'Population de l’Amazonie' }));
  TRANSPORT.rows.forEach(r => it.push({ id: r.id, quest: 'transport', label: r.text }));
  CUT_KEEP.forEach(c => it.push({ id: c.id, quest: 'couper', label: c.text }));
  return it;
}

// Une route à la fois : reconnaître (choix), situer (toucher) ou écrire le nom
function routeStep(x, mode) {
  const base = { type: 'route', mode, quest: 'eu-explo', qnum: 'Q1', item: 'eu-r-' + x.key, ex: x };
  if (mode === 'name') return mcqStep(Object.assign(base, { q: `Qui a suivi la route <b>${x.letter}</b>, en jaune ?`, correct: exName(x), options: shuffle(EXPLORERS.filter(y => y.key !== x.key).map(exName)).slice(0, 3).concat(exName(x)), explain: routeExplain(x) }));
  const mk = () => mode === 'type'
    ? Object.assign({}, base, { keys: [x.key], explain: routeExplain(x), subset: () => mk() })
    : Object.assign({}, base, { subset: () => mk() });
  return mk();
}

}

function buildQuestEU(key, focus) {
  const inc = id => !focus || focus.has(id);

  if (key === 'eu-explo') {
    const xs = shuffle(EXPLORERS.filter(x => inc('eu-r-' + x.key)));

      steps.push(routeAll('match', EXPLORERS), routeAll('table', EXPLORERS));
    } else { // séance : au début on relie (avec la carte) ; une route déjà réussie une fois, on écrit le nom, comme à l'examen
      const easy = xs.filter(x => !knows('eu-r-' + x.key)), hard = xs.filter(x => knows('eu-r-' + x.key));
      if (easy.length >= 3) steps.push(routeAll('match', easy)); else easy.forEach((x, i) => steps.push(routeStep(x, i % 2 ? 'tap' : 'name')));
      if (hard.length >= 2) steps.push(routeAll('table', hard)); else hard.forEach(x => steps.push(routeStep(x, 'type')));

    const ks = Object.keys(KINGDOMS).filter(k => inc('eu-e-' + k));

  if (key === 'eu-ameriques') {

// growth : 0..1 (animation de pousse)
function drawTree(ctx, sp, x, base, s, growth = 1, autumn = false) {
  const px = (dx, dy, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x + dx * s), Math.round(base - dy * s * growth), Math.ceil(s), Math.ceil(s * growth) + 1); };
  const blob = (cx, cy, r, c1, c2) => {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy <= r * r + r * 0.6) px(cx + dx, cy + dy, (dx + dy + cy) % 3 === 0 ? c2 : c1);
    }
  };
  const trunk = (h, c = '#6b4423') => { for (let i = 0; i < h; i++) { px(0, i, c); } };
  const cone = (h, w, c1, c2, start = 2) => {
    for (let i = 0; i < h; i++) {
      const half = Math.max(0, Math.round((h - i) * w / h - (i % 3 === 0 ? 1 : 0)));
      for (let dx = -half; dx <= half; dx++) px(dx, start + i, (dx + i) % 4 === 0 ? c2 : c1);
    }
    px(0, start + h, c1);
  };
  switch (sp) {
    case 'epinette': trunk(3); cone(12, 3, '#1f5a3a', '#174630'); break;
    case 'sapin': trunk(2); cone(10, 4, '#2c7a4b', '#1f5a3a'); break;
    case 'pin': trunk(7, '#7a4a2a'); blob(-2, 8, 2, '#3f8a4f', '#2d6b3b'); blob(2, 10, 2, '#3f8a4f', '#2d6b3b'); blob(0, 12, 2, '#3f8a4f', '#2d6b3b'); break;
    case 'meleze': trunk(3); cone(10, 3, autumn ? '#e3b23c' : '#8fbf4d', autumn ? '#c99526' : '#78a63e'); break;
    case 'erable': trunk(5); blob(0, 9, 4, autumn ? '#d8432f' : '#3f9a48', autumn ? '#f08a24' : '#2f7d3a'); break;
    case 'chene': trunk(5, '#5a3a20'); blob(-2, 9, 3, '#2f6e35', '#245a2a'); blob(2, 9, 3, '#2f6e35', '#3a8040'); blob(0, 12, 3, '#3a8040', '#245a2a'); break;
    case 'bouleau': for (let i = 0; i < 6; i++) px(0, i, i % 2 ? '#e7d29a' : '#c8a85c'); blob(0, 9, 3, autumn ? '#f2c335' : '#7cbf4a', autumn ? '#e0a82a' : '#5ea83c'); break;
    case 'hetre': trunk(5, '#8a8f96'); blob(0, 9, 4, autumn ? '#c9772a' : '#4a9a4a', autumn ? '#a85c1e' : '#3a8a3a'); break;
    case 'palmier': for (let i = 0; i < 12; i++) px(i > 8 ? 1 : 0, i, i % 2 ? '#8a6a3a' : '#a07a44');
      [[-4, 12], [-3, 13], [-2, 13], [-1, 13], [2, 13], [3, 13], [4, 12], [5, 11], [-5, 11], [0, 14], [1, 14], [-1, 11], [2, 11], [3, 11]].forEach(p => px(p[0], p[1], '#3aa04a')); break;
    case 'cocotier': for (let i = 0; i < 12; i++) px(i > 6 ? 1 : 0, i, i % 2 ? '#8a6a3a' : '#a07a44');
      [[-4, 12], [-3, 13], [-2, 13], [-1, 13], [2, 13], [3, 13], [4, 12], [5, 11], [-5, 11], [0, 14], [1, 14]].forEach(p => px(p[0], p[1], '#4cb35a'));
      [[0, 11], [1, 11], [2, 11]].forEach(p => px(p[0], p[1], '#5a3a1a')); break;
    case 'hevea': trunk(8, '#9a8a70'); blob(0, 12, 4, '#2f8f3f', '#247a33'); break;
    case 'acajou': trunk(7, '#8a3a24'); blob(-2, 11, 4, '#2a6e2a', '#1f5a20'); blob(3, 12, 3, '#2a6e2a', '#3a7e3a'); break;
    case 'cacaoyer': trunk(4); blob(0, 7, 3, '#2f7d3a', '#3f9a48'); px(-2, 4, '#e8762b'); px(2, 5, '#d8a02b'); px(1, 3, '#e8762b'); break;
    case 'arbuste': blob(0, 1, 1, '#6a7a4a', '#7a8a5a'); break;
    case 'lichen': px(0, 0, '#c9cfa8'); px(1, 0, '#b6bd92'); px(-1, 0, '#d8dcc0'); break;
    default: trunk(3); cone(8, 3, '#2c7a4b', '#1f5a3a');
  }
}

];

function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function drawZoneBand(ctx, zi, x0, y0, w, h, growth, s) {
  const z = ZONE_STYLE[zi];
  ctx.fillStyle = z.ground; ctx.fillRect(x0, y0, w, h);
  const rnd = seeded(97 + zi * 31);
  ctx.fillStyle = z.ground2;
  for (let i = 0; i < w * h / (s * s * 9); i++) ctx.fillRect(x0 + Math.floor(rnd() * w / s) * s, y0 + Math.floor(rnd() * h / s) * s, s, s);
  const list = [];
  z.trees.forEach(([sp, n]) => { for (let i = 0; i < n * (w / 600); i++) list.push({ sp, x: x0 + 20 + rnd() * (w - 40), y: y0 + h * 0.35 + rnd() * h * 0.62, d: rnd() }); });
  list.sort((a, b) => a.y - b.y);
  list.forEach(t => {
    const g = Math.max(0, Math.min(1, growth * 1.6 - t.d * 0.6));
    if (g > 0) drawTree(ctx, t.sp, t.x, t.y, s, g, zi >= 3);
  });
}

function companionGrid(comp, hat, glasses) {

  const rows = [pad, pad, pad].concat(g);
  if (hat && HATS[hat]) {
    HATS[hat].grid.forEach((line, r) => {

      line.split('').forEach((c, x) => { if (c !== '.') row[x] = c; });
      rows[r] = row.join('');

  if (glasses && GLASSES[glasses]) {
    const r0 = (EYE_ROW[comp] || 4) + 3;
    GLASSES[glasses].grid.forEach((line, r) => {
      if (!rows[r0 + r]) return;

      line.split('').forEach((c, x) => { if (c !== '.') row[x] = c; });
      rows[r0 + r] = row.join('');
    });
  }

function matchAns(v, answers, numeric) {
  if (numeric) { const d = String(v).replace(/\D/g, ''); return { ok: answers.some(a => a.replace(/\D/g, '') === d && d !== '') }; }
  const x = stripArt(norm(v)); if (!x) return { ok: false };
  for (const a of answers) { if (x === stripArt(norm(a))) { const exact = v.trim().toLowerCase() === a.toLowerCase(); return { ok: true, near: !exact, right: answers[0] }; } }
  for (const a of answers) { const y = stripArt(norm(a)); const tol = y.length >= 8 ? 2 : y.length >= 5 ? 1 : 0; if (tol && lev(x, y) <= tol) return { ok: true, near: true, right: answers[0] }; }
  return { ok: false, right: answers[0] };
}

/* ---------- Constructeurs ---------- */
const ZONE_Q = [
  { id: 'z-nord', q: 'Quelle zone de végétation est la plus au <b>nord</b> du Québec ?', a: 'Toundra' },
  { id: 'z-sud', q: 'Quelle zone de végétation est la plus au <b>sud</b> du Québec ?', a: 'Forêt de feuillus' },
  { id: 'z-avant-boreale', q: 'Quelle zone se trouve <b>juste au nord</b> de la forêt boréale ?', a: 'Taïga' },
  { id: 'z-apres-boreale', q: 'Quelle zone se trouve <b>juste au sud</b> de la forêt boréale ?', a: 'Forêt mixte' }
];
const ZONE_LINE = 'Du nord au sud : <b>Toundra → Taïga → Forêt boréale → Forêt mixte → Forêt de feuillus</b>.';

function mcqStep(o) {
  const mk = () => { const opts = shuffle(o.options); return Object.assign({}, o, { type: o.type || 'mcq', options: opts, answer: opts.indexOf(o.correct), subset: () => mk() }); };
  return mk();
}
function sortStep(base, cards) {
  const mk = (cs) => Object.assign({}, base, { type: 'sort', cards: shuffle(cs), subset: (failed) => mk(cards.filter(c => failed.includes(c.id))) });
  return mk(cards);
}

function buildQuest(key, focus) {
  const inc = id => !focus || focus.has(id);
  const steps = [];
  if (key === 'nord') {
    if (inc('z-ordre')) { const mk = () => ({ type: 'order', quest: 'nord', qnum: 'Q5', item: 'z-ordre', subset: () => mk() }); steps.push(mk()); }
    shuffle(ZONE_Q).filter(z => inc(z.id)).forEach(z => steps.push(mcqStep({ quest: 'nord', qnum: 'Q5', item: z.id, q: z.q, correct: z.a, options: shuffle(ZONES.filter(x => x !== z.a)).slice(0, 3).concat(z.a), explain: ZONE_LINE })));
  }
  if (key === 'labo') {
    const spc = SPECIES.filter(s => inc('sp-' + s.key)).map(s => ({ id: 'sp-' + s.key, text: s.name, bucket: s.fam, fact: s.fact }));
    if (spc.length) steps.push(sortStep({ quest: 'labo', qnum: 'Q4', title: 'Feuillu, conifère ou arbre tropical ?', buckets: [{ key: 'feuillu', label: 'Feuillu', hint: 'Des feuilles larges qui tombent à l’automne' }, { key: 'conifere', label: 'Conifère', hint: 'Des aiguilles et des cônes' }, { key: 'tropical', label: 'Arbre tropical', hint: 'Garde ses feuilles toute l’année, pays chauds' }] }, spc));
    const tr = FORESTS.filter(f => inc('f-' + f.key + '-arbres')).map(f => ({ id: 'f-' + f.key + '-arbres', text: f.name, bucket: f.key, fact: f.trees + '.' }));
    if (tr.length) steps.push(sortStep({ quest: 'labo', qnum: 'Q4', title: 'Quel genre d’arbres dans chaque forêt ?', buckets: [{ key: 'feuillus', label: 'Surtout des feuillus' }, { key: 'boreale', label: 'Surtout des conifères' }, { key: 'mixte', label: 'Mélange de feuillus et de conifères' }, { key: 'tropicale', label: 'Arbres tropicaux qui gardent leurs feuilles toute l’année' }] }, tr));
    const cl = FORESTS.filter(f => inc('f-' + f.key + '-climat')).map(f => ({ id: 'f-' + f.key + '-climat', text: f.name, bucket: f.key, fact: 'Climat : ' + f.climate.toLowerCase() + '.' }));
    if (cl.length) steps.push(sortStep({ quest: 'labo', qnum: 'Q4', title: 'Quel type de climat pour chaque forêt ?', buckets: [{ key: 'feuillus', label: 'Tempéré' }, { key: 'boreale', label: 'Froid (hémisphère Nord)' }, { key: 'mixte', label: 'Froid et tempéré' }, { key: 'tropicale', label: 'Chaud et humide' }] }, cl));
    const bl = FAO.blanks.filter(b => inc(b.id));
    if (bl.length) { const mk = (ids) => ({ type: 'fill', quest: 'labo', qnum: 'Q3', title: 'Les critères de la FAO pour qu’un territoire soit une forêt', intro: FAO.intro, lines: FAO.blanks.filter(b => ids.includes(b.id)).map(b => [b.before + ' ', { a: b.answer, id: b.id, num: true, unit: b.unit }, ' ' + b.after]), subset: (f) => mk(f) }); steps.push(mk(bl.map(b => b.id))); }
    shuffle(FAO.cases).filter(c => inc(c.id)).forEach(c => steps.push(mcqStep({ quest: 'labo', qnum: 'Q3', item: c.id, q: '<span class="muted" style="font-size:.8em">Selon la FAO, est-ce une forêt ?</span><br>' + c.text, correct: c.forest ? 'Oui, c’est une forêt' : 'Non, ce n’est pas une forêt', options: ['Oui, c’est une forêt', 'Non, ce n’est pas une forêt'], explain: c.why + ' Rappel : <b>5 000 m²</b>, <b>10 %</b> du sol couvert, arbres de plus de <b>5 m</b>.' })));
  }
  if (key === 'roles') {
    if (inc('act-6')) { const mk = () => ({ type: 'recall', quest: 'roles', qnum: 'Q6', item: 'act-6', subset: () => mk() }); steps.push(mk()); }
    const rc = ROLES.filter(r => inc(r.id)).map(r => ({ id: r.id, text: r.text, bucket: r.aspect }));
    if (rc.length) steps.push(sortStep({ quest: 'roles', qnum: 'Q7', title: 'À quel aspect appartient ce rôle de la forêt ?', buckets: Object.entries(ASPECTS).map(([k, v]) => ({ key: k, label: v, hint: ASPECT_HINT[k].split('= ')[1] })) }, rc));
  }
  if (key === 'monde') {
    const tg = shuffle(WORLD_TARGETS.filter(c => inc('w-' + c.id)));
    tg.forEach(c => { const mk = () => ({ type: 'mapTap', map: 'world', quest: 'monde', qnum: 'Q1', item: 'w-' + c.id, target: c, prompt: 'Touche ce pays sur la carte :', subset: () => mk() }); steps.push(mk()); });
    if (!focus) shuffle(WORLD_TARGETS).slice(0, 3).forEach(c => steps.push(mcqStep({ type: 'mapName', map: 'world', quest: 'monde', qnum: 'Q1', item: 'w-' + c.id, target: c, q: 'Quel est ce pays en jaune ?', correct: c.name, options: shuffle(WORLD_TARGETS.filter(x => x.id !== c.id).map(x => x.name)).slice(0, 3).concat(c.name), explain: c.name + ' fait partie des 10 pays les plus boisés du monde.' })));
  }
  if (key === 'carto') {
    shuffle(AMAZON_TARGETS.filter(c => inc('a-' + c.id))).forEach(c => { const mk = () => ({ type: 'mapTap', map: 'sa', quest: 'carto', qnum: 'Q2', item: 'a-' + c.id, target: c, prompt: 'La forêt amazonienne s’étend dans 9 pays. Touche :', subset: () => mk() }); steps.push(mk()); });
    ['manaus', 'belem'].filter(k => inc('city-' + k)).forEach(k => { const mk = () => ({ type: 'cityTap', quest: 'carto', qnum: 'Q2', item: 'city-' + k, city: k, subset: () => mk() }); steps.push(mk()); });
    if (inc('river')) { const mk = () => ({ type: 'trace', quest: 'carto', qnum: 'Q2', item: 'river', subset: () => mk() }); steps.push(mk()); }
  }
  if (key === 'coeur') {
    AMAZON_FILL.filter(f => inc(f.id)).forEach(f => { const mk = () => ({ type: 'fill', quest: 'coeur', qnum: 'Q8', title: 'Complète l’énoncé sur la forêt amazonienne', lines: [f.parts.map(p => typeof p === 'string' ? p : Object.assign({ id: f.id }, p))], subset: () => mk() }); steps.push(mk()); });
    AMAZON_CIRCLE.filter(f => inc(f.id)).forEach(f => { const mk = () => ({ type: 'circle', quest: 'coeur', qnum: 'Q9', item: f.id, parts: f.parts, subset: () => mk() }); steps.push(mk()); });
  }
  if (key === 'transport') {
    const rows = TRANSPORT.rows.filter(r => inc(r.id));
    if (rows.length) { const mk = (rs) => ({ type: 'match', quest: 'transport', qnum: 'Q10', rows: rs, subset: (f) => mk(TRANSPORT.rows.filter(r => f.includes(r.id))) }); steps.push(mk(rows)); }
  }
  if (key === 'couper') {
    const cs = CUT_KEEP.filter(c => inc(c.id));
    if (cs.length) { const mk = (l) => ({ type: 'swipe', quest: 'couper', qnum: 'Q11', cards: shuffle(l), subset: (f) => mk(CUT_KEEP.filter(c => f.includes(c.id))) }); steps.push(mk(cs)); }
  }
  return steps;
}

function buildExam() {
  const s = [];
  shuffle(WORLD_TARGETS).slice(0, 5).forEach(c => s.push({ type: 'mapTap', map: 'world', quest: 'monde', qnum: 'Q1', item: 'w-' + c.id, target: c, prompt: 'Situe ce pays :' }));
  shuffle(AMAZON_TARGETS).slice(0, 3).forEach(c => s.push({ type: 'mapTap', map: 'sa', quest: 'carto', qnum: 'Q2', item: 'a-' + c.id, target: c, prompt: 'Pays de la forêt amazonienne :' }));
  s.push({ type: 'cityTap', quest: 'carto', qnum: 'Q2', item: 'city-' + pick(['manaus', 'belem']), city: null });
  s[s.length - 1].city = s[s.length - 1].item.slice(5);
  s.push({ type: 'fill', quest: 'labo', qnum: 'Q3', title: 'Les critères de la FAO', intro: FAO.intro, lines: FAO.blanks.map(b => [b.before + ' ', { a: b.answer, id: b.id, num: true, unit: b.unit }, ' ' + b.after]) });
  buildQuest('labo', null).filter(x => x.type === 'sort' && x.title.startsWith('Quel')).forEach(x => s.push(Object.assign(x, { subset: null })));
  s.push({ type: 'order', quest: 'nord', qnum: 'Q5', item: 'z-ordre' });
  s.push({ type: 'recall', quest: 'roles', qnum: 'Q6', item: 'act-6' });
  const r6 = ['eco', 'econ', 'soc'].flatMap(a => shuffle(ROLES.filter(r => r.aspect === a)).slice(0, 2)).map(r => ({ id: r.id, text: r.text, bucket: r.aspect }));
  s.push(Object.assign(sortStep({ quest: 'roles', qnum: 'Q7', title: 'Rôles de la forêt : quel aspect ?', buckets: Object.entries(ASPECTS).map(([k, v]) => ({ key: k, label: v })) }, r6), { subset: null }));
  AMAZON_FILL.forEach(f => s.push({ type: 'fill', quest: 'coeur', qnum: 'Q8', title: 'Complète l’énoncé', lines: [f.parts.map(p => typeof p === 'string' ? p : Object.assign({ id: f.id }, p))] }));
  AMAZON_CIRCLE.forEach(f => s.push({ type: 'circle', quest: 'coeur', qnum: 'Q9', item: f.id, parts: f.parts }));
  s.push({ type: 'match', quest: 'transport', qnum: 'Q10', rows: TRANSPORT.rows });
  s.push({ type: 'swipe', quest: 'couper', qnum: 'Q11', cards: shuffle(CUT_KEEP) });
  return s;
}

    const dpr = Math.min(2, devicePixelRatio || 1); cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.imageSmoothingEnabled = false;

    }
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(w - 64, 6, 58, 26); c.fillRect(w - 64, h - 32, 58, 26);
    c.fillStyle = '#fff'; c.font = '900 15px Nunito, sans-serif'; c.fillText('NORD', w - 56, 25); c.fillText('SUD', w - 50, h - 13);

  const grow = (i) => { const t0 = performance.now(); const fr = (t) => { growth[i] = Math.min(1, (t - t0) / 900); draw(); if (growth[i] < 1) requestAnimationFrame(fr); }; requestAnimationFrame(fr); };

// ----- Trier dans des paniers -----

  const bEls = {};
  s.buckets.forEach(b => { const d = el(`<div class="panel bucket" data-k="${b.key}"><h3>${esc(b.label)}</h3>${b.hint ? `<p class="muted" style="font-size:14px">${esc(b.hint)}</p>` : ''}<div class="drops row" style="gap:6px"></div></div>`); bEls[b.key] = d; d.onclick = () => choose(b.key); bk.appendChild(d); });
  const next = () => {

    cardBox.appendChild(el(`<div class="panel card pop">${esc(cur.text)}</div>`));
  };
  const choose = (k) => {
    if (!cur || lock) return;

    if (k === cur.bucket) {
      lock = true; res.push({ id: cur.id, ok: !missed });
      const card = $('.card', cardBox); const a = card.getBoundingClientRect(), b = target.getBoundingClientRect();
      card.style.transition = 'transform .45s cubic-bezier(.5,-0.3,.6,1), opacity .45s'; card.style.transform = `translate(${b.left + b.width / 2 - a.left - a.width / 2}px,${b.top + b.height / 2 - a.top - a.height / 2}px) scale(.35)`; card.style.opacity = '.2';
      tone(700, 0, .08, S.theme === 'blocs' ? 'square' : 'triangle', .07); tone(1050, .07, .1, S.theme === 'blocs' ? 'square' : 'triangle', .07);

      fact.style.visibility = cur.fact ? 'visible' : 'hidden'; if (cur.fact) fact.innerHTML = `<b>${esc(cur.text)}</b> : ${esc(cur.fact)}`;
      setTimeout(next, cur.fact ? 1300 : 650);

      missed = true; target.classList.add('shake'); setTimeout(() => target.classList.remove('shake'), 400); sfx('bad'); buzz(30);
      bEls[cur.bucket].classList.add('hint');

// ----- Compléter des phrases (texte ou nombres) -----
GAMES.fill = (stage, s, api) => {
  const head = el(`<div class="panel fadein"><div class="qtitle">${s.titleHtml || esc(s.title)}</div>${s.intro ? `<p class="muted" style="margin-top:6px">${esc(s.intro)}</p>` : ''}</div>`); stage.appendChild(head);
  const box = el('<div class="panel sentence"></div>'); stage.appendChild(box);
  const blanks = [];
  s.lines.forEach((line, li) => {
    const p = document.createElement('div'); if (s.lines.length > 1) p.style.marginBottom = '6px';
    line.forEach(part => {
      if (typeof part === 'string') p.appendChild(document.createTextNode(part));
      else { const inp = el(`<input type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ${part.num ? 'inputmode="numeric"' : ''} style="${part.num ? 'width:5em' : part.wide ? 'width:min(13em,62vw)' : ''}">`); blanks.push({ inp, part }); p.appendChild(inp); }
    });
    box.appendChild(p);
  });
  const notes = el('<div></div>'); stage.appendChild(notes);
  const bar = el(`<div class="row"><button class="btn alt" id="hint" ${api.exam ? 'style="display:none"' : ''}>Indice</button><span class="grow"></span><button class="btn" id="chk">Vérifier</button></div>`); stage.appendChild(bar);
  let hinted = false, done = false;
  blanks.forEach((b, i) => b.inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (i < blanks.length - 1) blanks[i + 1].inp.focus(); else check(); } }));
  $('#hint', bar).onclick = () => { hinted = true; blanks.forEach(b => { if (!b.inp.value) { const a = b.part.hint || b.part.a[0]; b.inp.placeholder = b.part.num ? a.charAt(0) + '…' : a.split(' ').filter(w => w.length > 2).slice(0, 3).map(w => w.charAt(0) + '…').join(' '); } }); sfx('tap'); $('#hint', bar).disabled = true; };
  const check = () => {
    if (done) return; done = true; const by = {}; const fixes = [];
    blanks.forEach(b => {
      const m = matchAns(b.inp.value, b.part.a, b.part.num); b.inp.disabled = true;
      b.inp.classList.add(m.ok ? 'ok' : 'ko');
      if (!m.ok) { fixes.push(`<b>${esc(b.part.a[0])}</b>${b.part.unit ? ' ' + b.part.unit : ''}`); b.inp.value = b.part.a[0]; }
      else if (m.near) { fixes.push(`On écrit : <b>${esc(m.right)}</b>`); b.inp.value = m.right; }
      const id = b.part.id || s.item; by[id] = (by[id] === undefined ? true : by[id]) && m.ok && !hinted;
    });
    const res = Object.entries(by).map(([id, ok]) => ({ id, ok }));
    const allOk = res.every(r => r.ok);
    if (allOk) burstAt(box, 26);
    setTimeout(() => api.result(res, { explain: (fixes.length ? (allOk ? fixes.join(' · ') : 'La bonne réponse : ' + fixes.join(' · ')) : (hinted ? 'Bien, avec un indice. La prochaine fois, sans indice.' : '')) + (s.explain ? (fixes.length || hinted ? '<br>' : '') + s.explain : '') }), 500);
  };
  $('#chk', bar).onclick = check;
  if (!s.noFocus) setTimeout(() => blanks[0] && blanks[0].inp.focus({ preventScroll: true }), 350);
};

  const legs = [['europe', 'afrique', 'Produits manufacturés'], ['afrique', 'amerique', 'Esclaves'], ['amerique', 'europe', 'Matières premières']];

/* ---------- Zoom et déplacement ----------

/* ---------- Petits outils sur la couche légère ---------- */
// Rond qui s'efface : montre que le toucher a bien été reçu
function ripple(ctl, pt, col = '#ffffff') { const r = 16 * ctl.px(); const c = svgEl('circle', { cx: r1(pt.x), cy: r1(pt.y), r: r1(r), fill: 'none', stroke: col, 'stroke-width': r1(r * .28), class: 'rip' }); ctl.fx.appendChild(c); setTimeout(() => c.remove(), 520); }

// ----- Nommer un pays en surbrillance -----
GAMES.mapName = (stage, s, api) => {
  const wrap = el(mapMarkup(s.map)); stage.appendChild(wrap); const ctl = mapCtl(wrap, s.map);

// ----- Toucher un pays -----
GAMES.mapTap = (stage, s, api) => {
  stage.appendChild(el(`<div class="panel fadein row"><div class="grow qtitle">${esc(s.prompt)} <span class="hl">${esc(s.target.name)}</span></div></div>`));
  const wrap = el(mapMarkup(s.map)); stage.appendChild(wrap); const ctl = mapCtl(wrap, s.map), M = MAPS[s.map];
  const tip = el('<p class="muted center tipline">Astuce : touche directement le pays. Tu peux zoomer avec deux doigts ou avec + et −.</p>'); stage.appendChild(tip);
  api.ctx.found = api.ctx.found || { world: new Set(), sa: new Set() };
  const pathOf = id => $(`path.c[data-id="${id}"]`, wrap), cOf = id => M.countries.find(x => x.id === id);
  api.ctx.found[s.map].forEach(id => { const p = pathOf(id); if (p && id !== s.target.id) p.classList.add('found'); });
  let tries = 0, done = false;
  const targetPath = pathOf(s.target.id);
  const finish = (ok) => {
    done = true; api.ctx.found[s.map].add(s.target.id);
    targetPath.classList.remove('bad'); targetPath.classList.add(ok ? 'good' : 'glow'); ctl.toEl(targetPath);
    const c = cOf(s.target.id); if (c) mapLabel(ctl, c.c[0], c.c[1], s.target.name, 16);
    if (ok) setTimeout(() => { const r = targetPath.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 30); }, 620);
    const where = s.map === 'sa' ? (s.target.id === 'GUF' ? 'C’est un territoire de la France, en Amérique du Sud.' : '') : '';
    setTimeout(() => api.result([{ id: s.item, ok }], { explain: ok ? `Oui, voilà ${esc(COUNTRY_FR[s.target.id] || s.target.name)}. ${where}` : `Le voici, en jaune : <b>${esc(s.target.name)}</b>. ${where} Regarde bien sa place sur la carte.` }), 1200);
  };
  ctl.inner.addEventListener('click', (ev) => {
    if (done) return; const pt = ctl.pt(ev), near = hitsNear(ev, 'path.c'), p = near.find(q => q === targetPath) || near[0];
    // dans l'eau : si un pays est tout près, on le prend ; sinon on le dit (sans pénalité)
    if (!p) { ripple(ctl, pt); sfx('tap'); tip.textContent = 'Là, c’est de l’eau. Touche un pays (zoome avec + si c’est petit).'; return; }
    const id = p.dataset.id;
    if (id === s.target.id) { finish(tries === 0); return; }

    const c = cOf(id), lb = c ? mapLabel(ctl, c.c[0], c.c[1], COUNTRY_FR[id] ? 'Ça, c’est ' + COUNTRY_FR[id] : 'Pas ce pays-là', 14) : null;
    setTimeout(() => { p.classList.remove('bad'); if (lb) lb.remove(); }, 1300);
    if (tries >= (api.exam ? 1 : 2)) finish(false);
    else tip.textContent = 'Essaie encore. ' + (s.map === 'world' ? 'Pense au continent où il se trouve.' : 'Pense à sa position autour de l’Amazone.');
  });
};

// ----- Placer une ville -----
GAMES.cityTap = (stage, s, api) => {
  const NAME = { manaus: 'Manaus', belem: 'Belém' };
  const EXPL = { manaus: '<b>Manaus</b> est au milieu de l’Amazonie, sur le fleuve Amazone, en plein cœur de la forêt.', belem: '<b>Belém</b> est près de l’embouchure de l’Amazone, sur la côte de l’océan Atlantique.' };
  stage.appendChild(el(`<div class="panel fadein"><div class="qtitle">Place la ville de <span class="hl">${NAME[s.city]}</span> : touche l’endroit sur la carte.</div><p class="muted" style="margin-top:6px">Le fleuve Amazone est dessiné en bleu pâle.</p></div>`));
  const wrap = el(mapMarkup('sa')); stage.appendChild(wrap); const ctl = mapCtl(wrap, 'sa');
  const city = MAPS.sa.cities[s.city];
  let tries = 0, done = false;
  const pin = (x, y, col, label) => { const u = ctl.px(), g = svgEl('g'); g.innerHTML = `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(14 * u)}" fill="${col}" opacity=".35" class="pulse"/><circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(7 * u)}" fill="${col}" stroke="#fff" stroke-width="${r1(2.5 * u)}"/>`; ctl.fx.insertBefore(g, ctl.fx.firstChild); if (label) mapLabel(ctl, x + 36 * u, y - 14 * u, label, 19); return g; };
  ctl.inner.addEventListener('click', (ev) => {
    if (done) return; const pt = ctl.pt(ev); const d = Math.hypot(pt.x - city[0], pt.y - city[1]);
    if (d < 48) { done = true; pin(city[0], city[1], '#2fa84f', NAME[s.city]); burst(ev.clientX, ev.clientY, 30); setTimeout(() => api.result([{ id: s.item, ok: tries === 0 }], { explain: EXPL[s.city] }), 700); return; }
    tries++; sfx('bad'); buzz(30); const g = pin(pt.x, pt.y, '#d8432f', ''); setTimeout(() => g.remove(), 900);
    if (tries >= (api.exam ? 1 : 2)) { done = true; pin(city[0], city[1], '#f2c335', NAME[s.city]); setTimeout(() => api.result([{ id: s.item, ok: false }], { explain: EXPL[s.city] }), 900); }
  });
};

// ----- Tracer le fleuve -----
GAMES.trace = (stage, s, api) => {
  stage.appendChild(el(`<div class="panel fadein"><div class="qtitle">Trace le fleuve <span class="hl">Amazone</span> avec ton doigt, d’ouest en est.</div><p class="muted" style="margin-top:6px">Pars du point qui clignote (au Pérou) et suis le fleuve jusqu’à l’océan Atlantique.</p></div>`));
  const R = MAPS.sa.river, st0 = R[0]; let prog = 0, active = false, done = false, fingers = 0;
  const wrap = el(mapMarkup('sa', { over: `<polyline class="river-draw" points=""/><polyline class="river-flow" points="" style="display:none"/><circle cx="${st0[0]}" cy="${st0[1]}" r="18" fill="#e0249a" opacity=".6" class="pulse"/><circle cx="${st0[0]}" cy="${st0[1]}" r="9" fill="#e0249a" stroke="#fff" stroke-width="3"/>` }));
  stage.appendChild(wrap); const ctl = mapCtl(wrap, 'sa', { pan: false, touch: 'none', focus: () => R[Math.min(R.length - 1, prog + 4)] });
  const help = el('<div class="row"><span class="grow"></span><button class="btn alt" id="show">Je n’y arrive pas, montre-moi</button></div>'); stage.appendChild(help);
  const draw = $('.river-draw', wrap), flow = $('.river-flow', wrap);
  const render = () => draw.setAttribute('points', R.slice(0, prog + 1).map(p => p.join(',')).join(' '));
  const complete = (ok) => {
    done = true; prog = R.length - 1; render(); if (!LITE) { flow.style.display = ''; flow.setAttribute('points', R.map(p => p.join(',')).join(' ')); }
    const r = wrap.getBoundingClientRect(); if (ok) burst(r.left + r.width * .64, r.top + r.height * .35, 40);
    setTimeout(() => api.result([{ id: s.item, ok }], { explain: 'L’Amazone coule d’ouest en est : des Andes, au Pérou, jusqu’à l’océan Atlantique. Elle passe par Manaus.' }), 900);
  };
  const move = (ev) => {
    if (!active || done) return; const pt = ctl.pt(ev);
    for (let i = prog; i < Math.min(R.length, prog + 6); i++) { if (Math.hypot(pt.x - R[i][0], pt.y - R[i][1]) < 34) { if (i > prog) { prog = i; render(); if (prog % 8 === 0) sfx('tap'); } } }
    if (prog >= R.length - 2) complete(true);
  };

  ctl.inner.addEventListener('pointerdown', (ev) => { fingers++; active = fingers === 1; if (active) move(ev); });

};

const RCOL = { caboto: '#2f7fd6', cartier: '#8e44c9', colomb: '#e0452f', cabral: '#1f9d55', magellan: '#e67e22', gama: '#0f9aa8' };
const CIVCOL = { azteques: '#e5533d', mayas: '#f2a43a', incas: '#9b59d0' };

// Les six routes A à F dans le fond de carte (encre sépia, ou en couleurs pour la fiche)
function routesUnder(color) {
  const W = MAPS.world; let h = '<g class="routes">';
  EXPLORERS.forEach(e => { const r = W.routes[e.key], col = color ? RCOL[e.key] : '#4b3b28';
    h += `<path d="${r.d}" fill="none" stroke="#fff8e6" stroke-width="${color ? 5.6 : 4.6}" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/><path class="rt" data-k="${e.key}" d="${r.d}" fill="none" stroke="${col}" stroke-width="${color ? 3 : 2.2}" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 0L-10 -5L-10 5Z" transform="translate(${r.end[0]} ${r.end[1]}) rotate(${r.ang})" fill="${col}"/>`; });
  EXPLORERS.forEach(e => { const r = W.routes[e.key], col = color ? RCOL[e.key] : '#2b2118'; [r.letter, r.letter2].filter(Boolean).forEach(p => { h += `<circle cx="${p[0]}" cy="${p[1]}" r="12.5" fill="${col}" stroke="#fff8e6" stroke-width="2.2"/><text x="${p[0]}" y="${r1(p[1] + 5.5)}" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" font-family="Nunito,sans-serif">${e.letter}</text>`; }); });
  return h + '</g>';
}
// Surligne une route dans la couche légère (le fond de carte n'est pas redessiné)
function routeHi(ctl, k, col = '#f2b705', ink = '#1d2330') {
  const r = MAPS.world.routes[k], e = EXPLORERS.find(x => x.key === k), g = svgEl('g', { class: 'rhi' });
  g.innerHTML = `<path d="${r.d}" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/><path d="${r.d}" fill="none" stroke="${col}" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 0L-12 -7.5L-12 7.5Z" transform="translate(${r.end[0]} ${r.end[1]}) rotate(${r.ang})" fill="${col}" stroke="#fff" stroke-width="1.2"/>`
    + [r.letter, r.letter2].filter(Boolean).map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="15.5" fill="${col}" stroke="#fff" stroke-width="2.8"/><text x="${p[0]}" y="${r1(p[1] + 6.4)}" text-anchor="middle" font-size="19" font-weight="900" fill="${ink}" font-family="Nunito,sans-serif">${e.letter}</text>`).join('');
  ctl.fx.insertBefore(g, ctl.fx.firstChild); return g;
}
function shipOnPath(ctl, d, ms = 2400, done) {
  const path = svgEl('path', { d, fill: 'none', stroke: 'none' }); ctl.fx.appendChild(path);
  const g = svgEl('g'), u = 2.4; let h = '';
  ICONS.boat.forEach((row, y) => row.split('').forEach((c, x) => { if (c !== '.') h += `<rect x="${r1((x - 3.5) * u)}" y="${r1((y - 6) * u)}" width="${u + .1}" height="${u + .1}" fill="${PAL[c]}"/>`; }));
  g.innerHTML = h; ctl.fx.appendChild(g);
  const L = path.getTotalLength(), t0 = performance.now(); let lastT = 0;
  const put = k => { const p = path.getPointAtLength(k * L); g.setAttribute('transform', `translate(${r1(p.x)},${r1(p.y)})`); };
  const end = () => { path.remove(); if (done) done(); };
  if (REDUCED || LITE) { put(1); setTimeout(end, 600); return g; }
  const fr = t => { if (!g.isConnected) return; const k = Math.min(1, (t - t0) / ms); if (k === 1 || t - lastT > 30) { lastT = t; put(k); } if (k < 1) requestAnimationFrame(fr); else end(); };
  requestAnimationFrame(fr); return g;
}
function routeMap(stage, o = {}) {
  const wrap = el(mapMarkup('world', { skin: 'parch', under: routesUnder(o.color) })); stage.appendChild(wrap);
  return mapCtl(wrap, 'world', { maxZoom: 6 });
}

// ----- Routes des explorateurs : qui a suivi quelle route ? -----
GAMES.route = (stage, s, api) => {
  const x = s.ex, mode = s.mode;
  if (mode === 'tap') stage.appendChild(el(`<div class="panel fadein"><div class="qtitle">Touche la route de <span class="hl">${esc(x.name)}</span></div><p class="muted" style="margin-top:4px">Touche la ligne ou sa lettre. Les lettres A à F sont placées comme sur la carte de ton cahier.</p></div>`));
  if (mode === 'type' || mode === 'table') return routeWrite(stage, s, api);
  const ctl = routeMap(stage);
  if (mode === 'name') { routeHi(ctl, x.key); setTimeout(() => shipOnPath(ctl, MAPS.world.routes[x.key].d, x.key === 'magellan' ? 4200 : 2400), 400); GAMES.mcq(stage, s, api); return; }
  if (mode === 'match') { let hi = null; s.onSel = r => { if (hi) hi.remove(); hi = routeHi(ctl, r.to); }; GAMES.match(stage, s, api); return; }
  // mode « tap » : on prend la route la plus proche du doigt (pas besoin de viser pile sur la ligne)
  const tip = el('<p class="muted center tipline">Zoome avec + si les routes sont collées.</p>'); stage.appendChild(tip);
  const bar = el('<div class="row"><span class="grow"></span><button class="btn alt" id="idk">Je ne sais pas, montre-moi</button></div>'); stage.appendChild(bar);
  const W = MAPS.world, samples = {};
  $$('path.rt', ctl.base).forEach(p => { const L = p.getTotalLength(), a = []; for (let d = 0; d <= L; d += 5) { const q = p.getPointAtLength(d); a.push([q.x, q.y]); } samples[p.dataset.k] = a; });
  const distTo = (k, pt) => { let d = 1e9; samples[k].forEach(q => { d = Math.min(d, Math.hypot(q[0] - pt.x, q[1] - pt.y)); }); const r = W.routes[k];[r.letter, r.letter2].filter(Boolean).forEach(q => { d = Math.min(d, Math.hypot(q[0] - pt.x, q[1] - pt.y) - 12); }); return d; };
  let tries = 0, done = false;
  const show = (ok) => { done = true; $('#idk', bar).disabled = true; routeHi(ctl, x.key, ok ? '#2fa84f' : '#f2b705', ok ? '#fff' : '#1d2330'); if (ok) sfx('whoosh'); shipOnPath(ctl, W.routes[x.key].d, x.key === 'magellan' ? 3200 : 1900, () => api.result([{ id: s.item, ok }], { explain: (ok ? '' : 'La voici en jaune. ') + routeExplain(x) })); };
  ctl.inner.addEventListener('click', ev => {
    if (done) return; const pt = ctl.pt(ev), u = ctl.px(), tol = 26 * u;
    const ds = EXPLORERS.map(e => ({ e, d: distTo(e.key, pt) })).sort((a, b) => a.d - b.d);
    if (ds[0].d > tol) { ripple(ctl, pt); sfx('tap'); tip.innerHTML = 'Touche une des <b>lignes</b> ou une des <b>lettres</b> (A à F).'; return; }
    // si la bonne route est presque aussi proche que la plus proche, on lui donne raison
    const mine = ds.find(q => q.e.key === x.key), hit = mine.d <= ds[0].d + 4 * u ? mine : ds[0];
    if (hit.e.key === x.key) { burst(ev.clientX, ev.clientY, 30); show(tries === 0); return; }
    tries++; sfx('bad'); buzz(30);
    const bad = routeHi(ctl, hit.e.key, '#d8432f', '#fff'), lb = mapLabel(ctl, pt.x, pt.y - 14 * u, `Ça, c’est ${hit.e.letter} : ${exName(hit.e)}`, 15);
    setTimeout(() => { bad.remove(); lb.remove(); }, 1500);
    if (tries >= (api.exam ? 1 : 2)) { done = true; setTimeout(() => show(false), 700); }
    else tip.innerHTML = `Essaie encore. Indice : cette route part de <b>${x.from}</b> et va vers <b>${x.to}</b>.`;
  });
  $('#idk', bar).onclick = () => { if (!done) show(false); };
};

// Écrire le nom de l'explorateur, une route à la fois. Le champ est AU-DESSUS de la carte :
// quand le clavier de la tablette s'ouvre, on voit encore la route en jaune.
function routeWrite(stage, s, api) {
  const list = s.keys.map(k => EXPLORERS.find(x => x.key === k)), N = list.length;
  const box = el(`<div class="panel fadein"><div class="qtitle" id="q"></div>
    <div class="row" style="margin-top:10px"><input class="txt" id="nm" style="flex:1;min-width:200px" placeholder="Nom de l’explorateur" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"><button class="btn" id="ok">Valider</button></div>
    <p class="muted tipline" id="msg" style="margin-top:8px">Le nom de famille suffit. Les petites fautes sont acceptées.</p>
    <div class="row" style="margin-top:10px">${api.exam ? '' : '<button class="btn alt sm" id="hint">Indice</button>'}<span class="grow"></span><button class="btn alt sm" id="idk">Je ne sais pas</button></div>
    <div class="reveal-list" id="done" style="margin-top:10px"></div></div>`);
  stage.appendChild(box);
  const ctl = routeMap(stage), inp = $('#nm', box), msg = $('#msg', box), doneBox = $('#done', box);
  const res = []; let i = 0, hi = null, hinted = false, lock = false;
  const show = () => {
    const x = list[i]; if (hi) hi.remove(); hi = routeHi(ctl, x.key); hinted = false; inp.value = ''; inp.placeholder = 'Nom de l’explorateur';
    $('#q', box).innerHTML = `${N > 1 ? `<span class="muted" style="font-size:.7em">${i + 1} sur ${N} · </span>` : ''}Qui a suivi la route <span class="hl">${x.letter}</span>, en jaune ? Écris son nom.`;
  };
  const finish = () => { inp.disabled = true; inp.blur(); const good = res.filter(r => r.ok).length; api.result(res, { explain: (N > 1 ? `${good} sur ${N}. ` : '') + (s.explain || '') }); };
  const answer = (v, giveUp) => {
    if (lock) return; if (!giveUp && !v.trim()) { inp.focus(); return; }
    const x = list[i], m = giveUp ? { ok: false } : matchAns(v, x.syn);
    lock = true; const ok = m.ok && !hinted; res.push({ id: 'eu-r-' + x.key, ok });
    if (hi) hi.remove(); hi = routeHi(ctl, x.key, m.ok ? '#2fa84f' : '#d8432f', '#fff');
    doneBox.appendChild(el(`<span class="pop ${ok ? 'got' : 'miss'}">${x.letter} · ${esc(x.name)}</span>`));
    msg.innerHTML = m.ok ? (hinted ? `Oui, avec l’indice : <b>${esc(x.name)}</b>.` : `Oui : <b>${esc(x.name)}</b>.`) : `C’était <b>${esc(x.name)}</b>.`;
    if (m.ok) { tone(700, 0, .08, 'triangle', .07); tone(1050, .07, .1, 'triangle', .07); } else { sfx('bad'); buzz(30); }
    setTimeout(() => { lock = false; i++; if (i < N) { show(); msg.textContent = 'Le nom de famille suffit. Les petites fautes sont acceptées.'; } else finish(); }, m.ok ? 900 : 1700);
  };
  $('#ok', box).onclick = () => answer(inp.value);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); answer(inp.value); } });
  $('#idk', box).onclick = () => answer('', true);
  if ($('#hint', box)) $('#hint', box).onclick = () => { if (lock) return; hinted = true; const x = list[i]; inp.placeholder = exName(x).split(' ').filter(w => w.length > 2).map(w => w.charAt(0) + '…').join(' '); msg.innerHTML = `Indice : cette route part de ${x.from} et va vers ${x.to}.`; sfx('tap'); };
  show();
}

// Territoires hachurés (comme les zones à colorier du cahier) : empires (monde) ou civilisations (Amériques)
function zonesMarkup(map, u, fillOf) {
  const W = MAPS[map];
  let defs = `<pattern id="hatch${u}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f8efd8"/><rect width="2.2" height="6" fill="#c9a66b"/></pattern>`, under = '<g class="zones">';
  const fill = k => fillOf ? fillOf(k) : `url(#hatch${u})`;
  if (map === 'world') {
    let ci = 0;
    Object.entries(W.empires).forEach(([k, e]) => {
      e.ids.concat(e.home).forEach(id => { const c = W.countries.find(q => q.id === id); if (!c) return; const d = id === '250' ? c.d.split(/(?=M)/).filter(q => parseFloat(q.slice(1)) > 440).join('') : c.d; under += `<path class="zn" data-k="${k}" d="${d}" fill="${fill(k)}"/>`; });
      e.clip.forEach(q => { const c = W.countries.find(t => t.id === q.c); if (!c) return; defs += `<clipPath id="cz${u}-${ci}"><path d="${c.d}"/></clipPath>`; under += `<path class="zn" data-k="${k}" d="${q.d}" clip-path="url(#cz${u}-${ci})" fill="${fill(k)}"/>`; ci++; });
      e.dots.forEach(p => under += `<circle class="zn dot" data-k="${k}" cx="${p[0]}" cy="${p[1]}" r="5" fill="${fill(k)}"/>`);
    });
  } else {
    Object.entries(W.civClip).forEach(([k, ids]) => { defs += `<clipPath id="cc${u}-${k}">${ids.map(id => { const c = W.countries.find(q => q.id === id); return c ? `<path d="${c.d}"/>` : ''; }).join('')}</clipPath>`; });
    Object.entries(W.civ).forEach(([k, c]) => under += `<path class="zn" data-k="${k}" d="${c.d}" clip-path="url(#cc${u}-${k})" fill="${fill(k)}"/>`);
  }
  return { defs, under: under + '</g>' };
}

// ----- Territoires : colorier les empires ou les civilisations, ou nommer une zone en jaune -----
GAMES.zone = (stage, s, api) => {
  const isEmp = s.map === 'world', W = MAPS[s.map], u = ++MAPUID, pre = isEmp ? 'eu-e-' : 'eu-c-';
  const NAME = isEmp ? KINGDOMS : CIVNAME, WHERE = isEmp ? KWHERE : CIVWHERE, COLOR = isEmp ? KCOLORS : CIVCOL;
  const art = k => isEmp ? 'le ' + NAME[k] : 'les ' + NAME[k], de = k => isEmp ? 'du ' + NAME[k] : 'des ' + NAME[k];
  const color = s.mode === 'color', target = isEmp ? s.kingdom : s.civ;
  const title = !color ? (isEmp ? 'À quel royaume appartiennent les territoires <span class="hl">en jaune</span> ?' : 'Quelle grande civilisation vivait dans le territoire <span class="hl">en jaune</span> ?')
    : isEmp ? 'Colorie les <b>empires coloniaux</b>, comme dans ton cahier.' : 'Colorie le territoire des <b>grandes civilisations</b>, comme dans ton cahier.';
  const sub = !color ? (isEmp ? 'Les territoires des empires sont hachurés, comme les zones à colorier de ton cahier.' : 'Les trois territoires sont hachurés, comme sur la carte de ton cahier.')
    : isEmp ? '1. Choisis un royaume. 2. Touche un de ses territoires hachurés sur la carte.' : '1. Choisis une civilisation. 2. Touche son territoire hachuré sur la carte.';
  stage.appendChild(el(`<div class="panel fadein"><div class="qtitle">${title}</div><p class="muted" style="margin-top:4px">${sub}</p></div>`));
  const todo = color ? s.keys.slice() : [];
  const pal = el(`<div class="palette">${shuffle(todo).map(k => `<button class="pal" data-k="${k}" style="--c:${COLOR[k]}"><i></i>${NAME[k]}</button>`).join('')}</div>`);
  const tip = el('<p class="muted center tipline">Choisis d’abord une couleur.</p>');
  if (color) { stage.appendChild(pal); stage.appendChild(tip); }
  const z = zonesMarkup(s.map, u);
  const wrap = el(mapMarkup(s.map, { uid: u, skin: 'parch', defs: z.defs, under: z.under })); stage.appendChild(wrap);
  const ctl = mapCtl(wrap, s.map); ctl.frame(isEmp ? W.views.emp : W.views.civ);
  const zn = k => $$(`.zn[data-k="${k}"]`, ctl.base), body = k => zn(k).filter(q => !q.classList.contains('dot'));
  const paint = (k, col) => zn(k).forEach(q => { q.setAttribute('fill', col); q.classList.add('on'); q.classList.remove('ask'); });
  const labelAt = k => { if (isEmp) return; const c = W.civ[k]; mapLabel(ctl, c.c[0], c.c[1], NAME[k], 16); };

  if (!color) { // une zone en jaune : à qui est-elle ?
    Object.keys(NAME).forEach(k => { if (k !== target && (api.ctx.foundK || new Set()).has(k)) { paint(k, COLOR[k]); labelAt(k); } });
    zn(target).forEach(q => { q.setAttribute('fill', '#f2c335'); q.classList.add('ask'); });
    const b0 = unionBox(body(target)); let pulse = null;
    setTimeout(() => { ctl.toBox(b0, isEmp ? 1.7 : 2.2, isEmp ? .4 : .5); if (Math.max(b0.width, b0.height) < 60) pulse = pulseAt(ctl, b0.x + b0.width / 2, b0.y + b0.height / 2, '#f2c335', 28); }, 350);
    const keys = shuffle(Object.keys(NAME)), box = el('<div class="opts"></div>'); let lock = false;
    keys.forEach(k => { const b = el(`<button class="opt">${NAME[k]}</button>`); b.onclick = () => {
      if (lock) return; lock = true; const ok = k === target; b.classList.add(ok ? 'good' : 'bad'); if (!ok) { box.children[keys.indexOf(target)].classList.add('good'); b.classList.add('shake'); }
      if (pulse) pulse.remove(); paint(target, COLOR[target]); labelAt(target); (api.ctx.foundK = api.ctx.foundK || new Set()).add(target);
      if (ok) burstAt(b, 20);
      setTimeout(() => api.result([{ id: s.item, ok }], { explain: `<b>${NAME[target]}</b> : ${WHERE[target]}` }), 900);
    }; box.appendChild(b); });
    stage.appendChild(box); return;
  }

  // coloriage : on choisit une couleur (un royaume), puis on touche son territoire
  const res = {}, miss = {}; let active = null, done = false, dead = 0;
  Object.keys(NAME).filter(k => !todo.includes(k)).forEach(k => { paint(k, COLOR[k]); labelAt(k); });
  const btn = k => $(`.pal[data-k="${k}"]`, pal);
  const pickKey = k => { if (done || res[k] !== undefined) return; active = k; $$('.pal', pal).forEach(b => b.classList.toggle('sel', b.dataset.k === k)); sfx('tap'); tip.innerHTML = `Touche maintenant un territoire ${de(k)} sur la carte.`; };
  $$('.pal', pal).forEach(b => b.onclick = () => pickKey(b.dataset.k));
  const settle = (k, ok) => {
    res[k] = ok; paint(k, COLOR[k]); labelAt(k); const b = btn(k); b.classList.remove('sel'); b.classList.add('done'); b.disabled = true; active = null;
    if (ok) { tone(700, 0, .08, 'triangle', .07); tone(1050, .07, .1, 'triangle', .07); const r = body(k)[0].getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 26); }
    const left = todo.filter(q => res[q] === undefined);
    if (!left.length) { done = true; const good = todo.filter(q => res[q]).length, bad = todo.filter(q => !res[q]);
      tip.textContent = ''; setTimeout(() => api.result(todo.map(q => ({ id: pre + q, ok: res[q] })), { explain: `${good} sur ${todo.length} du premier coup.` + bad.map(q => `<br><b>${NAME[q]}</b> : ${WHERE[q]}`).join('') }), 900); }
    else if (left.length === 1) pickKey(left[0]);
    else tip.innerHTML = (ok ? 'Oui. ' : `Voilà ${art(k)}. `) + 'Choisis la couleur suivante.';
  };
  ctl.inner.addEventListener('click', ev => {
    if (done) return; const pt = ctl.pt(ev), px = ctl.px();
    // un toucher juste à côté d'une petite zone compte ; si la zone de la couleur choisie est tout près, on lui donne raison
    const ks = hitsNear(ev, '.zn').map(q => q.dataset.k).filter(q => res[q] === undefined || q === active), k = ks.includes(active) ? active : ks[0] || null;
    if (!active) { ripple(ctl, pt); sfx('tap'); pal.classList.add('shake'); setTimeout(() => pal.classList.remove('shake'), 400); tip.innerHTML = '<b>Choisis d’abord une couleur</b> : touche le nom d’un royaume ou d’une civilisation.'; return; }
    if (!k) { // rien de touché : on le dit, sans pénalité
      ripple(ctl, pt); sfx('tap'); dead++; tip.innerHTML = 'Ici, il n’y a pas de zone. Touche une zone <b>hachurée</b>' + (dead >= 2 ? ' (zoome avec + pour voir les petites).' : '.');
      if (dead >= 2) { const hs = $$('.zn:not(.on)', ctl.base); hs.forEach(q => q.classList.add('flash')); setTimeout(() => hs.forEach(q => q.classList.remove('flash')), 900); }
      return;
    }
    if (!todo.includes(k)) { ripple(ctl, pt); sfx('tap'); tip.innerHTML = `Ce territoire est déjà colorié (${NAME[k]}). Touche une zone encore hachurée.`; return; }
    if (k === active) { settle(k, !miss[k]); return; }
    miss[active] = (miss[active] || 0) + 1; sfx('bad'); buzz(30);
    const lb = mapLabel(ctl, pt.x, pt.y - 12 * px, 'Pas ici', 15); zn(k).forEach(q => q.classList.add('dim'));
    setTimeout(() => { lb.remove(); zn(k).forEach(q => q.classList.remove('dim')); }, 1200);
    if (miss[active] >= (api.exam ? 1 : 2)) { const a = active; ctl.toBox(unionBox(body(a)), 1.7, isEmp ? .4 : .5); setTimeout(() => { if (res[a] === undefined) settle(a, false); }, 500); active = null; }
    else tip.innerHTML = `Non, ce territoire n’appartient pas ${isEmp ? 'au ' : 'aux '}${NAME[active]}. Indice : ${WHERE[active]}`;
  });
};

// ----- Peuples autochtones sur la carte -----
GAMES.peoples = (stage, s, api) => {
  const A = MAPS.am, uniq = A.peuples.filter((p, i, a) => a.findIndex(q => q.n === p.n) === i), rounds = shuffle(uniq).slice(0, 3);
  stage.appendChild(el(`<div class="panel fadein"><div class="qtitle">Quel peuple autochtone vivait à l’endroit qui clignote ?</div><p class="muted" style="margin-top:4px">3 peuples à reconnaître, placés comme sur la carte de ton cahier.</p></div>`));
  const under = '<g>' + A.peuples.map(p => `<circle cx="${p.p[0]}" cy="${p.p[1]}" r="6" fill="#2b2118" stroke="#fff8e6" stroke-width="2"/>`).join('') + '</g>';
  const wrap = el(mapMarkup('am', { skin: 'parch', under })); stage.appendChild(wrap); const ctl = mapCtl(wrap, 'am');
  const box = el('<div class="opts"></div>'); stage.appendChild(box);
  let r = 0, okAll = true, pulse = null, lock = false;
  const names = uniq.map(q => q.n);
  const next = () => {
    box.innerHTML = ''; lock = false;
    if (r >= rounds.length) { setTimeout(() => api.result([{ id: s.item, ok: okAll }], { explain: 'Quelques peuples de ta carte : Inuits, Cris, Algonquiens, Iroquoiens, Sioux, Apaches, Navajos, Pueblos, Taïnos, Arawaks, Tupians, Araucaniens.' }), 500); return; }
    const p = rounds[r]; if (pulse) pulse.remove();
    const zw = 440, zh = zw * A.h / A.w; ctl.tween([p.p[0] - zw / 2, p.p[1] - zh / 2, zw], 600);
    pulse = pulseAt(ctl, p.p[0], p.p[1], '#f2c335', 17);
    const opts = shuffle(shuffle(names.filter(n => n !== p.n)).slice(0, 3).concat(p.n));

let busy = false, queued = null, AT_HOME = false;
async function go(render, queue) {
  if (busy) { if (queue) queued = render; return; }
  busy = true;
  const cv = $('#wipe'), c = cv.getContext('2d'); const w = innerWidth, h = innerHeight;
  try {
    if (REDUCED || LITE) { safeRender(render); return; }
    cv.width = w; cv.height = h;
    const col = getComputedStyle(document.body).getPropertyValue('--bg2').trim() || '#204';
    if (S.theme === 'blocs') {
      const sz = Math.ceil(Math.max(w, h) / 12), cells = []; for (let y = 0; y < h; y += sz) for (let x = 0; x < w; x += sz) cells.push([x, y]);
      const order = shuffle(cells); const steps = 7;
      for (let k = 0; k < steps; k++) { order.slice(k * order.length / steps, (k + 1) * order.length / steps).forEach(([x, y]) => { c.fillStyle = (x / sz + y / sz) % 2 ? '#3d5a2a' : '#4b6b33'; c.fillRect(x, y, sz, sz); }); await sleep(16); }

      for (let k = 0; k < steps; k++) { order.slice(k * order.length / steps, (k + 1) * order.length / steps).forEach(([x, y]) => c.clearRect(x, y, sz, sz)); await sleep(16); }
    } else {

      for (let k = 1; k <= N; k++) { c.clearRect(0, 0, w, h); c.fillStyle = col; c.beginPath(); c.arc(w / 2, h / 2, R * k / N, 0, 7); c.fill(); await sleep(16); }

      for (let k = N; k >= 0; k--) { c.clearRect(0, 0, w, h); c.fillStyle = col; c.beginPath(); c.arc(w / 2, h / 2, R * k / N, 0, 7); c.fill(); await sleep(16); }

}

/* ---------- Mise à jour automatique ----------
   À l'ouverture et à chaque retour dans l'appli, on regarde s'il existe une version plus récente.
   Si oui, on recharge la page, mais seulement à l'accueil : jamais au milieu d'une partie. */
let UPDATE = null, lastCheck = 0;
const HOSTED = location.protocol === 'https:' || location.hostname === 'localhost'; // en ligne (ou serveur d'essai) : mises à jour et mode hors ligne
async function checkUpdate(manual) {
  if (!HOSTED || APP_VERSION.charAt(0) === '/') return 'local';
  if (!manual && Date.now() - lastCheck < 120000) return 'wait';
  lastCheck = Date.now();
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return 'local';
    const j = await r.json(); if (!j || !j.v) return 'local';
    if (j.v !== APP_VERSION) { UPDATE = j.v; applyUpdate(manual); return 'new'; }
    return 'ok';
  } catch (e) { return 'err'; }
}
function applyUpdate(force) {
  if (!UPDATE || UPDATE === APP_VERSION) return;
  let tried = null; try { tried = sessionStorage.getItem('ef.upd'); } catch (e) { }
  if (tried === UPDATE && force !== true) return; // déjà essayé pendant cette visite : on n'insiste pas
  if (!AT_HOME && force !== true) return;
  try { sessionStorage.setItem('ef.upd', UPDATE); } catch (e) { }
  save(); location.replace(location.pathname + '?v=' + encodeURIComponent(UPDATE));
}

// Séance du jour : courte, et les sujets sont mélangés (une étape par sujet à tour de rôle).

function sessionSteps() {

  for (let r = 0; steps.length < SESSION_MAX && lists.some(l => l.length > r); r++) lists.forEach(l => { if (l[r] && steps.length < SESSION_MAX) steps.push(l[r]); });
