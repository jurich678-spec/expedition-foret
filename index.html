.pv-briques{background:linear-gradient(#4fc3ff,#c4ecff 62%,#3cc46a 62%,#3cc46a 74%,#2a9a52 74%)}
.pv-briques:before,.pv-briques:after{content:'';position:absolute;width:26px;height:26px;border-radius:5px;background:#ff5a5a;box-shadow:inset -5px -5px 0 rgba(0,0,0,.2),inset 4px 4px 0 rgba(255,255,255,.4);left:25%;top:30%;animation:fly 2.6s ease-in-out infinite alternate}
.pv-briques:after{background:#ffd23f;left:62%;top:22%;width:20px;height:20px;animation-delay:-1.3s}
body.t-aurore{
  --bg1:#081430;--bg2:#13284d;--ink:#eef4ff;--ink2:#a9b8d6;--panel:rgba(20,34,66,.82);--panel2:rgba(40,62,110,.7);--line:#6fe3c1;
  --acc:#4fd6a8;--acc2:#2aa883;--radius:18px;--shadow:0 0 24px rgba(79,214,168,.25);--border:2px solid rgba(111,227,193,.55);
  --title:'Nunito',system-ui,sans-serif;
}
body.t-jungle{
  --bg1:#0f3b25;--bg2:#1f5f33;--ink:#f3f8ea;--ink2:#bdd6b0;--panel:rgba(16,52,32,.86);--panel2:rgba(34,90,52,.75);--line:#b8e65a;
  --acc:#b8e65a;--acc2:#7fb52f;--radius:24px;--shadow:0 10px 30px rgba(0,0,0,.35);--border:2px solid rgba(184,230,90,.5);
  --title:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--body);color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));user-select:none;-webkit-user-select:none;touch-action:manipulation}
#bg,#fx,#wipe{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:50}#wipe{z-index:60}
#app{position:fixed;inset:0;z-index:10;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen{min-height:100%;max-width:980px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 18px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,.btn,.title{font-family:var(--title)}
h1{font-size:clamp(34px,7vw,64px);margin:0;line-height:1.05;letter-spacing:.5px}
h2{font-size:clamp(24px,4.4vw,36px);margin:0}
h3{font-size:clamp(19px,3.2vw,24px);margin:0}
p{margin:0;line-height:1.45;font-size:clamp(16px,2.6vw,20px)}
.muted{color:var(--ink2)}
.panel{background:var(--panel);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.t-blocs .panel{box-shadow:inset -4px -4px 0 rgba(0,0,0,.12),inset 4px 4px 0 rgba(255,255,255,.6),0 6px 0 rgba(0,0,0,.25)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.center{text-align:center;align-items:center;justify-content:center}
.btn{appearance:none;border:var(--border);border-radius:var(--radius);background:var(--acc);color:#fff;font-size:clamp(18px,3vw,24px);padding:14px 22px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.25)}
body.t-blocs .btn{box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.35),0 6px 0 rgba(0,0,0,.3)}
body.t-aurore .btn,body.t-jungle .btn{color:#06210f;text-shadow:none}
body.t-aurore .btn.alt,body.t-jungle .btn.alt,body.t-aurore .btn.ghost,body.t-jungle .btn.ghost{color:var(--ink)}
body.t-aurore .btn.warn,body.t-jungle .btn.warn{color:#2a1200}
.btn:active{transform:translateY(4px) scale(.98)}
.btn.big{font-size:clamp(22px,3.8vw,30px);padding:20px 26px}
.btn.alt{background:var(--panel2);color:var(--ink);text-shadow:none}
.btn.warn{background:var(--warn)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink);text-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.pix{image-rendering:pixelated;display:block}
input.txt{font:inherit;font-size:clamp(18px,3vw,24px);padding:12px 14px;border:var(--border);border-radius:calc(var(--radius) / 2);background:rgba(255,255,255,.95);color:#1d2330;width:100%;user-select:text;-webkit-user-select:text}
input.txt:focus{outline:4px solid var(--gold)}
/* topbar */
.topbar{display:flex;align-items:center;gap:10px}
.topbar .btn{padding:8px 14px;font-size:18px}
.progress{flex:1;height:18px;background:rgba(0,0,0,.18);border-radius:var(--radius);overflow:hidden;border:2px solid var(--line)}
.progress>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));width:0;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel2);border:2px solid var(--line);font-weight:800;font-size:16px}
/* choix (onboarding) */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.choice{cursor:pointer;padding:16px;text-align:center;transition:transform .15s}
.choice.sel{outline:5px solid var(--gold);transform:translateY(-4px)}
.choice .pix{margin:0 auto 8px}
.preview{height:110px;border-radius:calc(var(--radius) / 1.5);margin-bottom:10px;position:relative;overflow:hidden;border:2px solid rgba(0,0,0,.25)}
.pv-blocs{background:linear-gradient(#7ec8f0,#bfe6ff 60%,#5aa83a 60%,#5aa83a 72%,#8a5a32 72%);image-rendering:pixelated}
.pv-blocs:after{content:'';position:absolute;left:10%;top:18%;width:40px;height:16px;background:#fff;box-shadow:16px -8px 0 #fff,32px 0 0 #fff;animation:cloud 6s linear infinite}
.pv-aurore{background:linear-gradient(#050c22,#1a2f5a)}
.pv-aurore:before{content:'';position:absolute;inset:-20% -10% 40%;background:linear-gradient(100deg,transparent 20%,rgba(79,214,168,.7) 40%,rgba(140,110,255,.5) 60%,transparent 80%);filter:blur(10px);animation:aur 4s ease-in-out infinite alternate}
.pv-jungle{background:radial-gradient(circle at 30% 70%,#2f8a45,#0f3b25 70%)}
.pv-jungle:before,.pv-jungle:after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:#e9ff8a;box-shadow:0 0 12px #e9ff8a;left:30%;top:40%;animation:fly 3s ease-in-out infinite alternate}
.pv-jungle:after{left:70%;top:60%;animation-delay:-1.5s}
@keyframes cloud{from{transform:translateX(-60px)}to{transform:translateX(260px)}}
@keyframes aur{to{transform:translateX(20%) skewX(-10deg)}}
@keyframes fly{to{transform:translate(30px,-25px)}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hop{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{30%{transform:translateY(-22px) scale(1.08,.94)}60%{transform:translateY(0) scale(.95,1.06)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.fadein{animation:fadein .4s both}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}}
/* accueil */
.hero{display:flex;align-items:center;gap:16px}
.hero .comp{flex:none}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),rgba(0,0,0,.15) 0);display:grid;place-items:center;flex:none}
.ring>span{width:72px;height:72px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:900;font-size:22px;font-family:var(--title)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.menu .btn{justify-content:flex-start;text-align:left;min-height:84px}
.menu .btn small{display:block;font-family:var(--body);font-weight:600;font-size:15px;opacity:.9;text-shadow:none}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.day{flex:none;width:64px;padding:8px 4px;text-align:center;border:2px solid var(--line);border-radius:calc(var(--radius) / 2);background:var(--panel2);font-weight:800;font-size:14px}
.day.done{background:var(--good);color:#fff}
.day.today{outline:4px solid var(--gold)}
.day.exam{background:var(--warn);color:#fff}
/* carte d'expédition */
.trail{position:relative;display:grid;gap:14px}
.node{display:flex;align-items:center;gap:14px;cursor:pointer;padding:14px}
.node:nth-child(even){margin-left:8%}
.node .badge{width:64px;height:64px;flex:none;display:grid;place-items:center;background:var(--panel2);border:var(--border);border-radius:calc(var(--radius) / 1.2)}
.node .mini{height:10px;background:rgba(0,0,0,.15);border-radius:6px;overflow:hidden;margin-top:6px}
.node .mini>div{height:100%;background:var(--acc)}
/* jeux */
.qtitle{font-size:clamp(20px,3.4vw,28px);font-weight:900;line-height:1.25}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{font-family:var(--body);font-size:clamp(17px,2.8vw,22px);font-weight:800;padding:16px;text-align:left;background:var(--panel);color:var(--ink);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;transition:transform .1s,background .2s}
.opt:active{transform:scale(.97)}
.opt.good{background:var(--good);color:#fff}
.opt.bad{background:var(--bad);color:#fff}
.opt.sel{outline:5px solid var(--gold)}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px 18px max(16px,env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1)}
.feedback.show{transform:none}
.feedback .panel{max-width:940px;margin:0 auto;display:flex;gap:14px;align-items:center}
.feedback.good .panel{border-color:var(--good)}
.feedback.bad .panel{border-color:var(--warn)}
.fb-title{font-family:var(--title);font-size:24px;font-weight:900}
.feedback.good .fb-title{color:var(--good)}
.feedback.bad .fb-title{color:var(--warn)}
.mapwrap{position:relative;width:100%;border:var(--border);border-radius:var(--radius);overflow:hidden;background:#a9d3ee;touch-action:none}
body.t-aurore .mapwrap{background:#0d2148}
body.t-jungle .mapwrap{background:#174a59}
.mapwrap svg{display:block;width:100%;height:auto;max-height:62vh;margin:0 auto}
.mapwrap path.c{fill:#f3efe2;stroke:#6b7280;stroke-width:.6;transition:fill .3s}
body.t-aurore .mapwrap path.c{fill:#2a3f6e;stroke:#5c7bb3}
body.t-jungle .mapwrap path.c{fill:#2f6a3c;stroke:#5c9a5a}
.mapwrap path.c.good{fill:var(--good)!important}
.mapwrap path.c.found{fill:#8ad08f!important}
.mapwrap path.c.bad{fill:var(--bad)!important}
.mapwrap path.c.glow{fill:var(--gold)!important;filter:drop-shadow(0 0 6px var(--gold))}
.maplabel{font-family:var(--body);font-weight:900;font-size:16px;fill:#1d2330;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}
.river-faint{fill:none;stroke:#7fb2d9;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.river-draw{fill:none;stroke:#e0249a;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #ff6ad5)}
.river-flow{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:6 18;stroke-linecap:round;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
/* tri */
.buckets{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.bucket{min-height:110px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.bucket.hint{outline:4px dashed var(--gold)}
.bucket h3{font-size:18px;font-family:var(--body);font-weight:900;line-height:1.2}
.bucket .dropped{font-size:14px;font-weight:700;padding:4px 8px;background:var(--panel2);border-radius:8px}
.card{padding:16px;font-size:clamp(18px,3vw,23px);font-weight:800;text-align:center}
/* phrases à compléter */
.sentence{font-size:clamp(19px,3.2vw,26px);line-height:2.1;font-weight:700}
.sentence input{font:inherit;font-weight:900;width:7.5em;padding:2px 8px;border:none;border-bottom:4px solid var(--acc);background:rgba(255,255,255,.9);color:#1d2330;border-radius:6px;text-align:center;user-select:text;-webkit-user-select:text}
.sentence input.ok{border-color:var(--good);background:#d9f5df}
.sentence input.ko{border-color:var(--warn);background:#ffe6d6}
.pick{display:inline-flex;gap:6px;vertical-align:middle}
.pick button{font:inherit;font-size:.9em;font-weight:800;padding:2px 12px;border-radius:999px;border:3px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.pick button.on{background:var(--gold);color:#1d2330;box-shadow:0 0 0 4px rgba(242,195,53,.4)}
.pick button.good{background:var(--good);color:#fff}
.pick button.bad{background:var(--bad);color:#fff;text-decoration:line-through}
/* relier */
.match{position:relative;display:grid;grid-template-columns:1.4fr .5fr 1fr;gap:10px;align-items:center}
.match svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mrow{padding:12px 14px;font-weight:800;font-size:clamp(15px,2.5vw,19px);cursor:pointer;position:relative}
.mrow.sel{outline:5px solid var(--gold)}
.mrow.done{opacity:.75}
.mtarget{padding:16px;font-weight:900;font-size:clamp(16px,2.7vw,21px);cursor:pointer;text-align:center}
/* swipe */
.deck{position:relative;height:300px;max-width:520px;width:100%;margin:0 auto}
.swcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-size:clamp(22px,4vw,30px);font-weight:900;padding:24px;touch-action:none;cursor:grab}
.swcard .tag{position:absolute;top:18px;padding:6px 14px;border:4px solid;border-radius:10px;font-family:var(--title);font-size:22px;opacity:0}
.swcard .tag.l{left:18px;color:var(--good);border-color:var(--good);transform:rotate(-12deg)}
.swcard .tag.r{right:18px;color:var(--warn);border-color:var(--warn);transform:rotate(12deg)}
.sides{display:flex;justify-content:space-between;gap:12px;max-width:520px;margin:0 auto;width:100%}
/* ordre */
.zonecanvas{width:100%;display:block;border:var(--border);border-radius:var(--radius);background:#cfe0e6}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips .opt{text-align:center;flex:1 1 180px}
/* forêt */
.forestcv{width:100%;display:block;border:var(--border);border-radius:var(--radius)}
.species{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.sp{padding:8px;text-align:center;cursor:pointer;font-weight:800;font-size:15px}
.sp canvas{display:block;margin:0 auto}
.fact{font-size:16px;font-weight:700;padding:10px 14px;border-left:6px solid var(--gold);background:var(--panel2);border-radius:8px}
.reveal-list{display:flex;flex-wrap:wrap;gap:8px}
.reveal-list span{padding:6px 12px;border-radius:999px;font-weight:800;border:2px solid var(--line);background:var(--panel2)}
.reveal-list span.got{background:var(--good);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-weight:800;font-size:18px}
.toggle input{width:28px;height:28px}
.score{font-family:var(--title);font-size:clamp(48px,10vw,88px);font-weight:900;line-height:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (orientation:landscape) and (min-width:900px){.deck{height:260px}}

.aura-verte{filter:drop-shadow(0 0 4px #6cff8a) drop-shadow(0 0 12px #2bff5a) drop-shadow(0 0 20px #2bff5a)}
.aura-doree{filter:drop-shadow(0 0 4px #ffd84a) drop-shadow(0 0 12px #ffb800) drop-shadow(0 0 20px #ffb800)}
.aura-arc{filter:drop-shadow(0 0 5px #ff5ab4) drop-shadow(0 0 14px #ff5ab4) drop-shadow(0 0 22px #ff5ab4);animation:hue 3s linear infinite}
.aura-arc.bob{animation:hue 3s linear infinite,bob 1.6s ease-in-out infinite}
@keyframes hue{to{filter:drop-shadow(0 0 4px #ff5ab4) drop-shadow(0 0 9px #ff5ab4) hue-rotate(360deg)}}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{padding:12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800}
.item.worn{outline:5px solid var(--gold)}
.item .price{font-size:15px}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.bdg{width:96px;text-align:center;font-size:13px;font-weight:800;padding:8px 4px;border-radius:12px;border:2px solid var(--line);background:var(--panel2)}
.bdg .pix{margin:0 auto 4px}
.bdg.off{opacity:.35;filter:grayscale(1)}
.bdg.new{outline:4px solid var(--gold);animation:pop .5s}
.scene{display:block;width:100%;height:170px;border:var(--border);border-radius:var(--radius);image-rendering:pixelated}
.scene.tappable{cursor:pointer;outline:5px solid var(--gold);animation:pulsebox .6s ease-in-out infinite alternate}
@keyframes pulsebox{to{outline-color:#ff5a5a}}
.flyseed{position:fixed;z-index:70;pointer-events:none;transition:transform .8s cubic-bezier(.4,-0.3,.6,1),opacity .8s;margin:-15px 0 0 -15px}
.sp.sel{outline:5px solid var(--gold);transform:translateY(-3px)}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);cursor:pointer}
.sw.on{outline:4px solid var(--gold);transform:scale(1.12)}
.mapwrap{position:relative}
.zoombar{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zb{width:48px;height:48px;border-radius:12px;border:3px solid #1d2330;background:#fff;color:#1d2330;font:900 26px Nunito,sans-serif;box-shadow:0 4px 0 rgba(0,0,0,.3);cursor:pointer;line-height:1}
.zb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.maplegend{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.9);color:#1d2330;border:2px solid #1d2330;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;pointer-events:none}
.maplegend i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#2e7d32}
.maplegend i.r{border-radius:2px;height:4px;width:18px;background:#7fb2d9}
.zoomhint{position:absolute;left:8px;top:8px;background:rgba(29,35,48,.75);color:#fff;font-size:13px;font-weight:800;padding:4px 8px;border-radius:8px;pointer-events:none;transition:opacity .6s}
.tiltin svg{animation:tiltin .9s cubic-bezier(.2,.8,.3,1) both;transform-origin:50% 90%}
@keyframes tiltin{from{transform:perspective(900px) rotateX(42deg) scale(.88);opacity:.15}}
.mapwrap .waves{animation:waves 5s linear infinite}
@keyframes waves{to{transform:translateX(40px)}}
.mapwrap.moving .land{filter:none}
@media (max-height:900px){.scene{height:130px}}
.tline{position:relative;height:150px;border:var(--border);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.tbar{position:absolute;left:3%;right:3%;top:70px;height:8px;background:linear-gradient(90deg,var(--acc),var(--gold));border-radius:4px}
.tmark{position:absolute;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;width:84px;text-align:center}
.tmark b{font-family:var(--title);font-size:18px;background:var(--ink);color:var(--panel);padding:2px 6px;border-radius:6px;margin-bottom:28px}
.tmark span{font-size:11px;font-weight:800;line-height:1.15}
.tmark:after{content:'';position:absolute;top:44px;width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid var(--ink)}
.tspan{position:absolute;bottom:4px;background:rgba(242,195,53,.35);border:2px dashed var(--ink);border-radius:8px;font-weight:900;font-size:13px;text-align:center;padding:2px}
.opt.chk{display:flex;gap:12px;align-items:center}
.opt.chk .box{flex:none;width:26px;height:26px;border:3px solid var(--line);border-radius:6px;background:#fff}
.opt.chk.sel .box{background:var(--gold)}
.opt.chk.good .box{background:#fff}

<body class="t-briques">
<canvas id="bg"></canvas>
<div id="app"></div>
<canvas id="fx"></canvas>

function buildItems() {
  const it = [];
  WORLD_TARGETS.forEach(c => it.push({ id: 'w-' + c.id, quest: 'monde', label: c.name + ' (carte du monde)' }));
  AMAZON_TARGETS.forEach(c => it.push({ id: 'a-' + c.id, quest: 'carto', label: c.name + ' (Amazonie)' }));

  FAO.cases.forEach(c => it.push({ id: c.id, quest: 'labo', label: 'Est-ce une forêt ?' }));
  FORESTS.forEach(f => { it.push({ id: 'f-' + f.key + '-arbres', quest: 'labo', label: f.name + ' : arbres' }); it.push({ id: 'f-' + f.key + '-climat', quest: 'labo', label: f.name + ' : climat' }); });
  SPECIES.forEach(s => it.push({ id: 'sp-' + s.key, quest: 'labo', label: s.name }));
  it.push({ id: 'z-ordre', quest: 'nord', label: 'Les 5 zones dans l’ordre' });
  ['z-nord', 'z-sud', 'z-avant-boreale', 'z-apres-boreale'].forEach(z => it.push({ id: z, quest: 'nord', label: 'Position des zones' }));
  it.push({ id: 'act-6', quest: 'roles', label: 'Six activités en forêt' });
  ROLES.forEach(r => it.push({ id: r.id, quest: 'roles', label: r.text }));
  AMAZON_FILL.forEach(f => it.push({ id: f.id, quest: 'coeur', label: 'Compléter : Amazonie' }));
  AMAZON_CIRCLE.forEach(f => it.push({ id: f.id, quest: 'coeur', label: 'Population de l’Amazonie' }));
  TRANSPORT.rows.forEach(r => it.push({ id: r.id, quest: 'transport', label: r.text }));
  CUT_KEEP.forEach(c => it.push({ id: c.id, quest: 'couper', label: c.text }));
  return it;
}

  EXPLORERS.forEach(x => { it.push({ id: 'eu-x-' + x.key, quest: 'eu-explo', label: x.name + ' : année' }); it.push({ id: 'eu-r-' + x.key, quest: 'eu-explo', label: x.name + ' : route ' + x.letter }); });
  Object.keys(KINGDOMS).forEach(k => it.push({ id: 'eu-e-' + k, quest: 'eu-empires', label: KINGDOMS[k] }));
  it.push({ id: 'eu-tordesillas', quest: 'eu-empires', label: 'Objectif du traité de Tordesillas' });
  CIVS.forEach(c => it.push({ id: 'eu-c-' + c.key, quest: 'eu-ameriques', label: c.name }));
  it.push({ id: 'eu-peuples', quest: 'eu-ameriques', label: 'Peuples autochtones' }, { id: 'eu-peuples-carte', quest: 'eu-ameriques', label: 'Peuples sur la carte' });
  DATES.forEach(d => it.push({ id: d.id, quest: 'eu-temps', label: d.label }));
  it.push({ id: 'eu-chrono', quest: 'eu-temps', label: 'Ligne du temps' });
  ENJEUX.forEach(e => it.push({ id: e.id, quest: 'eu-bord', label: e.text }));
  TECHS.forEach(t => it.push({ id: 'eu-t-' + t.key, quest: 'eu-bord', label: t.name }));
  TRIANGLE.forEach(t => it.push({ id: t.id, quest: 'eu-triangle', label: t.text }));
  it.push({ id: 'eu-tr-limite', quest: 'eu-triangle', label: 'Pourquoi les colonies ne se développent pas' }, { id: 'eu-tr-esclaves', quest: 'eu-triangle', label: 'Le rôle des esclaves' });
  it.push({ id: 'eu-cons', quest: 'eu-colonie', label: 'Conséquences pour les Autochtones' });
  DEFS.forEach(d => it.push({ id: 'eu-def-' + d.key, quest: 'eu-colonie', label: d.term }));
  POWERS.forEach(p => it.push({ id: 'eu-pw-' + p.key, quest: 'eu-aujourdhui', label: p.name }));
  MONDIAL.forEach(m => it.push({ id: m.id, quest: 'eu-aujourdhui', label: m.text }));
  it.push({ id: 'eu-lang', quest: 'eu-aujourdhui', label: 'Les 4 langues' }, { id: 'eu-lang-origine', quest: 'eu-aujourdhui', label: 'Origine des langues' });
  return it;
}

function gridSVG(grid, size = 64, extra = '', pal = null) {
  const h = grid.length, w = grid[0].length;
  let r = '';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = grid[y][x]; if (c === '.') continue;
    r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${(pal && pal[c]) || PAL[c] || c}"/>`;
  }
  return `<svg class="pix" ${extra} viewBox="0 0 ${w} ${h}" width="${size}" height="${size * h / w}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

// growth : 0..1 (animation de pousse)
function drawTree(ctx, sp, x, base, s, growth = 1, autumn = false) {
  const px = (dx, dy, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x + dx * s), Math.round(base - dy * s * growth), Math.ceil(s), Math.ceil(s * growth) + 1); };
  const blob = (cx, cy, r, c1, c2) => {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy <= r * r + r * 0.6) px(cx + dx, cy + dy, (dx + dy + cy) % 3 === 0 ? c2 : c1);
    }
  };
  const trunk = (h, c = '#6b4423') => { for (let i = 0; i < h; i++) { px(0, i, c); } };
  const cone = (h, w, c1, c2, start = 2) => {
    for (let i = 0; i < h; i++) {
      const half = Math.max(0, Math.round((h - i) * w / h - (i % 3 === 0 ? 1 : 0)));
      for (let dx = -half; dx <= half; dx++) px(dx, start + i, (dx + i) % 4 === 0 ? c2 : c1);
    }
    px(0, start + h, c1);
  };
  switch (sp) {
    case 'epinette': trunk(3); cone(12, 3, '#1f5a3a', '#174630'); break;
    case 'sapin': trunk(2); cone(10, 4, '#2c7a4b', '#1f5a3a'); break;
    case 'pin': trunk(7, '#7a4a2a'); blob(-2, 8, 2, '#3f8a4f', '#2d6b3b'); blob(2, 10, 2, '#3f8a4f', '#2d6b3b'); blob(0, 12, 2, '#3f8a4f', '#2d6b3b'); break;
    case 'meleze': trunk(3); cone(10, 3, autumn ? '#e3b23c' : '#8fbf4d', autumn ? '#c99526' : '#78a63e'); break;
    case 'erable': trunk(5); blob(0, 9, 4, autumn ? '#d8432f' : '#3f9a48', autumn ? '#f08a24' : '#2f7d3a'); break;
    case 'chene': trunk(5, '#5a3a20'); blob(-2, 9, 3, '#2f6e35', '#245a2a'); blob(2, 9, 3, '#2f6e35', '#3a8040'); blob(0, 12, 3, '#3a8040', '#245a2a'); break;
    case 'bouleau': for (let i = 0; i < 6; i++) px(0, i, i % 2 ? '#e7d29a' : '#c8a85c'); blob(0, 9, 3, autumn ? '#f2c335' : '#7cbf4a', autumn ? '#e0a82a' : '#5ea83c'); break;
    case 'hetre': trunk(5, '#8a8f96'); blob(0, 9, 4, autumn ? '#c9772a' : '#4a9a4a', autumn ? '#a85c1e' : '#3a8a3a'); break;
    case 'palmier': for (let i = 0; i < 12; i++) px(i > 8 ? 1 : 0, i, i % 2 ? '#8a6a3a' : '#a07a44');

function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function drawZoneBand(ctx, zi, x0, y0, w, h, growth, s) {
  const z = ZONE_STYLE[zi];
  ctx.fillStyle = z.ground; ctx.fillRect(x0, y0, w, h);

}

/* ---------- Réponses tapées : tolérance aux accents et fautes ---------- */
function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’'`\-]/g, ' ').replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim(); }
const stripArt = s => s.replace(/^(le|la|les|l|un|une|des|du|de|d|faire de la|faire du|faire la) /, '');
function lev(a, b) { const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let p = Array.from({ length: n + 1 }, (_, j) => j); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
function matchAns(v, answers, numeric) {
  if (numeric) { const d = String(v).replace(/\D/g, ''); return { ok: answers.some(a => a.replace(/\D/g, '') === d && d !== '') }; }
  const x = stripArt(norm(v)); if (!x) return { ok: false };
  for (const a of answers) { if (x === stripArt(norm(a))) { const exact = v.trim().toLowerCase() === a.toLowerCase(); return { ok: true, near: !exact, right: answers[0] }; } }
  for (const a of answers) { const y = stripArt(norm(a)); const tol = y.length >= 8 ? 2 : y.length >= 5 ? 1 : 0; if (tol && lev(x, y) <= tol) return { ok: true, near: true, right: answers[0] }; }
  return { ok: false, right: answers[0] };
}

const GAMES = {};

// ----- Choix multiple -----
GAMES.mcq = (stage, s, api) => {
  stage.appendChild(el(`<div class="panel fadein"><div class="qtitle">${s.q}</div></div>`));
  const box = el('<div class="opts"></div>'); let locked = false;
  s.options.forEach((o, i) => {
    const b = el(`<button class="opt">${esc(o)}</button>`);
    b.onclick = () => {
      if (locked) return; locked = true; const ok = i === s.answer;
      b.classList.add(ok ? 'good' : 'bad'); if (!ok) { box.children[s.answer].classList.add('good'); b.classList.add('shake'); } else burstAt(b, 20);
      setTimeout(() => api.result([{ id: s.item, ok }], { explain: s.explain }), ok ? 450 : 700);
    };
    box.appendChild(b);
  });

// ----- Nommer un pays en surbrillance -----
GAMES.mapName = (stage, s, api) => {
  const wrap = el(mapMarkup(s.map)); stage.appendChild(wrap); enableZoom(wrap, s.map);
  const svg = $('svg', wrap); const p = $(`path[data-id="${s.target.id}"]`, svg);
  p.classList.add('glow'); setTimeout(() => zoomTo(svg, p, s.map), 300);
  GAMES.mcq(stage, s, api);
};

// ----- Toucher un pays -----
GAMES.mapTap = (stage, s, api) => {
  stage.appendChild(el(`<div class="panel fadein row"><div class="grow qtitle">${esc(s.prompt)} <span style="color:var(--acc);font-size:1.25em">${esc(s.target.name)}</span></div></div>`));
  const wrap = el(mapMarkup(s.map)); stage.appendChild(wrap); enableZoom(wrap, s.map);
  const tip = el('<p class="muted center" style="font-weight:700">Astuce : touche directement le pays. Tu peux zoomer avec deux doigts ou avec + et −.</p>'); stage.appendChild(tip);
  const svg = $('svg', wrap); api.ctx.found = api.ctx.found || { world: new Set(), sa: new Set() };
  api.ctx.found[s.map].forEach(id => { const p = $(`path[data-id="${id}"]`, svg); if (p && id !== s.target.id) p.classList.add('found'); });
  let tries = 0, done = false;
  const targetPath = $(`path[data-id="${s.target.id}"]`, svg);
  const finish = (ok) => {
    done = true; api.ctx.found[s.map].add(s.target.id);
    targetPath.classList.remove('bad'); targetPath.classList.add(ok ? 'good' : 'glow'); zoomTo(svg, targetPath, s.map);
    setTimeout(() => addLabel(svg, s.map, s.target.id, s.target.name), 500);
    if (ok) { const r = targetPath.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 30); }
    const where = s.map === 'sa' ? (s.target.id === 'GUF' ? 'C’est un territoire de la France, en Amérique du Sud.' : '') : '';
    setTimeout(() => api.result([{ id: s.item, ok }], { explain: ok ? `Oui, voilà ${esc(COUNTRY_FR[s.target.id] || s.target.name)}. ${where}` : `Le voici, en jaune : <b>${esc(s.target.name)}</b>. ${where} Regarde bien sa place sur la carte.` }), 1100);
  };
  svg.addEventListener('click', (ev) => {
    if (done) return; const p = ev.target.closest('path.c'); if (!p) return;
    const id = p.dataset.id;
    if (id === s.target.id) { finish(tries === 0); return; }
    tries++; p.classList.add('bad'); sfx('bad'); buzz(30);
    const lb = addLabel(svg, s.map, id, COUNTRY_FR[id] ? 'Ça, c’est ' + COUNTRY_FR[id] : 'Pas ce pays-là', '');
    setTimeout(() => { p.classList.remove('bad'); if (lb) lb.remove(); }, 1300);
    if (tries >= (api.exam ? 1 : 2)) finish(false);
    else tip.textContent = 'Essaie encore. ' + (s.map === 'world' ? 'Pense au continent où il se trouve.' : 'Pense à sa position autour de l’Amazone.');
  });
};

// ----- Placer une ville -----
GAMES.cityTap = (stage, s, api) => {
  const NAME = { manaus: 'Manaus', belem: 'Belém' };
  const EXPL = { manaus: '<b>Manaus</b> est au milieu de l’Amazonie, sur le fleuve Amazone, en plein cœur de la forêt.', belem: '<b>Belém</b> est près de l’embouchure de l’Amazone, sur la côte de l’océan Atlantique.' };
  stage.appendChild(el(`<div class="panel fadein"><div class="qtitle">Place la ville de <span style="color:var(--acc);font-size:1.25em">${NAME[s.city]}</span> : touche l’endroit sur la carte.</div><p class="muted" style="margin-top:6px">Le fleuve Amazone est dessiné en bleu pâle.</p></div>`));
  const wrap = el(mapMarkup('sa', '<g class="pins"></g>')); stage.appendChild(wrap); enableZoom(wrap, 'sa');
  const svg = $('svg', wrap); const pins = $('.pins', svg); const city = MAPS.sa.cities[s.city];
  let tries = 0, done = false;
  const pin = (x, y, col, label, cls = 'pop') => { const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.innerHTML = `<circle cx="${x}" cy="${y}" r="16" fill="${col}" opacity=".35" class="pulse"/><circle cx="${x}" cy="${y}" r="8" fill="${col}" stroke="#fff" stroke-width="3" class="${cls}"/>${label ? `<text x="${x + 14}" y="${y - 12}" class="maplabel" font-size="24">${label}</text>` : ''}`; pins.appendChild(g); return g; };
  svg.addEventListener('click', (ev) => {
    if (done) return; const pt = svgPoint(svg, ev); const d = Math.hypot(pt.x - city[0], pt.y - city[1]);
    if (d < 48) { done = true; pin(city[0], city[1], '#2fa84f', NAME[s.city]); burst(ev.clientX, ev.clientY, 30); setTimeout(() => api.result([{ id: s.item, ok: tries === 0 }], { explain: EXPL[s.city] }), 700); return; }
    tries++; sfx('bad'); buzz(30); const g = pin(pt.x, pt.y, '#d8432f', ''); setTimeout(() => g.remove(), 900);
    if (tries >= (api.exam ? 1 : 2)) { done = true; pin(city[0], city[1], '#f2c335', NAME[s.city]); setTimeout(() => api.result([{ id: s.item, ok: false }], { explain: EXPL[s.city] }), 900); }
  });
};

// ----- Tracer le fleuve -----
GAMES.trace = (stage, s, api) => {
  stage.appendChild(el(`<div class="panel fadein"><div class="qtitle">Trace le fleuve <span style="color:var(--acc)">Amazone</span> avec ton doigt, d’ouest en est.</div><p class="muted" style="margin-top:6px">Pars du point qui clignote (au Pérou) et suis le fleuve jusqu’à l’océan Atlantique.</p></div>`));
  const R = MAPS.sa.river; const st0 = R[0];
  const wrap = el(mapMarkup('sa', `<polyline class="river-draw" points=""/><polyline class="river-flow" points="" style="display:none"/><circle cx="${st0[0]}" cy="${st0[1]}" r="18" fill="#e0249a" class="pulse"/><circle cx="${st0[0]}" cy="${st0[1]}" r="9" fill="#e0249a" stroke="#fff" stroke-width="3"/>`));
  stage.appendChild(wrap); enableZoom(wrap, 'sa', { pan: false, focus: () => R[Math.min(R.length - 1, prog + 4)] });
  const help = el('<div class="row"><span class="grow"></span><button class="btn alt" id="show">Je n’y arrive pas, montre-moi</button></div>'); stage.appendChild(help);
  const svg = $('svg', wrap), draw = $('.river-draw', svg), flow = $('.river-flow', svg);
  let prog = 0, active = false, done = false;
  const render = () => draw.setAttribute('points', R.slice(0, prog + 1).map(p => p.join(',')).join(' '));
  const complete = (ok) => {
    done = true; prog = R.length - 1; render(); flow.style.display = ''; flow.setAttribute('points', R.map(p => p.join(',')).join(' '));
    const r = wrap.getBoundingClientRect(); if (ok) burst(r.left + r.width * .64, r.top + r.height * .35, 40);
    setTimeout(() => api.result([{ id: s.item, ok }], { explain: 'L’Amazone coule d’ouest en est : des Andes, au Pérou, jusqu’à l’océan Atlantique. Elle passe par Manaus.' }), 900);
  };
  const move = (ev) => {
    if (!active || done) return; const pt = svgPoint(svg, ev);
    for (let i = prog; i < Math.min(R.length, prog + 6); i++) { if (Math.hypot(pt.x - R[i][0], pt.y - R[i][1]) < 34) { if (i > prog) { prog = i; render(); if (prog % 8 === 0) sfx('tap'); } } }
    if (prog >= R.length - 2) complete(true);
  };
  let fingers = 0;
  svg.addEventListener('pointerdown', (ev) => { fingers++; active = fingers === 1; if (active) move(ev); });
  svg.addEventListener('pointerup', () => { fingers = Math.max(0, fingers - 1); });
  svg.addEventListener('pointercancel', () => { fingers = Math.max(0, fingers - 1); });
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerup', () => active = false);
  svg.addEventListener('pointercancel', () => active = false);
  $('#show', help).onclick = () => { if (done) return; done = true; const t0 = performance.now(); const fr = (t) => { const k = Math.min(1, (t - t0) / 1600); prog = Math.floor(k * (R.length - 1)); render(); if (k < 1) requestAnimationFrame(fr); else { done = false; complete(false); } }; requestAnimationFrame(fr); };
};

// ----- Mettre les zones en ordre (paysage qui se construit) -----
GAMES.order = (stage, s, api) => {
  stage.appendChild(el(`<div class="panel fadein"><div class="qtitle">Descends du nord au sud : touche les 5 zones de végétation <b>dans l’ordre</b>.</div></div>`));
  const cv = el('<canvas class="zonecanvas"></canvas>'); stage.appendChild(cv);
  const chips = el('<div class="chips"></div>'); stage.appendChild(chips);
  const tip = el('<p class="muted center" style="font-weight:700"></p>'); stage.appendChild(tip);
  let k = 0, mistakes = 0; const growth = [0, 0, 0, 0, 0];
  const draw = () => {
    const w = cv.clientWidth || 600, bh = Math.round(Math.max(56, Math.min(92, w * .13))), h = bh * 5;
    const dpr = Math.min(2, devicePixelRatio || 1); cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.imageSmoothingEnabled = false;
    const sz = Math.max(2, Math.round(w / 240));
    for (let i = 0; i < 5; i++) {
      if (growth[i] > 0) { drawZoneBand(c, i, 0, i * bh, w, bh, growth[i], sz); c.font = `900 ${Math.round(bh * .24)}px Nunito, sans-serif`; c.lineWidth = 5; c.strokeStyle = 'rgba(255,255,255,.9)'; c.fillStyle = '#1d2330'; c.strokeText(ZONES[i], 12, i * bh + bh * .32); c.fillText(ZONES[i], 12, i * bh + bh * .32); }
      else { c.fillStyle = i % 2 ? '#2c3a4a' : '#334457'; c.fillRect(0, i * bh, w, bh); c.fillStyle = 'rgba(255,255,255,.35)'; c.font = `900 ${Math.round(bh * .4)}px Nunito, sans-serif`; c.fillText('?', w / 2 - 8, i * bh + bh * .65); }
    }
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(w - 64, 6, 58, 26); c.fillRect(w - 64, h - 32, 58, 26);
    c.fillStyle = '#fff'; c.font = '900 15px Nunito, sans-serif'; c.fillText('NORD', w - 56, 25); c.fillText('SUD', w - 50, h - 13);
  };
  const grow = (i) => { const t0 = performance.now(); const fr = (t) => { growth[i] = Math.min(1, (t - t0) / 900); draw(); if (growth[i] < 1) requestAnimationFrame(fr); }; requestAnimationFrame(fr); };
  shuffle(ZONES).forEach(z => {
    const b = el(`<button class="opt">${z}</button>`);
    b.onclick = () => {
      if (z === ZONES[k]) {

// ----- Trier dans des paniers -----
GAMES.sort = (stage, s, api) => {
  stage.appendChild(el(`<div class="panel fadein"><div class="qtitle">${esc(s.title)}</div><p class="muted" style="margin-top:4px">Touche le bon panier pour chaque carte.</p></div>`));
  const cardBox = el('<div style="min-height:96px"></div>'); stage.appendChild(cardBox);
  const fact = el('<div class="fact" style="visibility:hidden">.</div>'); stage.appendChild(fact);
  const bk = el('<div class="buckets"></div>'); stage.appendChild(bk);
  const res = []; const queue = s.cards.slice(); let cur = null, missed = false, lock = false;
  const bEls = {};
  s.buckets.forEach(b => { const d = el(`<div class="panel bucket" data-k="${b.key}"><h3>${esc(b.label)}</h3>${b.hint ? `<p class="muted" style="font-size:14px">${esc(b.hint)}</p>` : ''}<div class="drops row" style="gap:6px"></div></div>`); bEls[b.key] = d; d.onclick = () => choose(b.key); bk.appendChild(d); });
  const next = () => {
    $$('.bucket', bk).forEach(x => x.classList.remove('hint'));
    cur = queue.shift(); missed = false; lock = false; cardBox.innerHTML = '';
    if (!cur) { const first = res.filter(r => r.ok).length; const fin = () => api.result(res, { explain: `${first} sur ${res.length} du premier coup.` + (s.finale === 'triangle' ? ' Le trajet : l’Europe envoie des produits manufacturés en Afrique, des esclaves sont transportés de force d’Afrique vers l’Amérique, puis les matières premières d’Amérique partent vers l’Europe.' : '') }); if (s.finale === 'triangle') triangleAnim(stage, fin); else fin(); return; }
    cardBox.appendChild(el(`<div class="panel card pop">${esc(cur.text)}</div>`));
  };
  const choose = (k) => {
    if (!cur || lock) return;
    const target = bEls[k];
    if (k === cur.bucket) {
      lock = true; res.push({ id: cur.id, ok: !missed });
      const card = $('.card', cardBox); const a = card.getBoundingClientRect(), b = target.getBoundingClientRect();
      card.style.transition = 'transform .45s cubic-bezier(.5,-0.3,.6,1), opacity .45s'; card.style.transform = `translate(${b.left + b.width / 2 - a.left - a.width / 2}px,${b.top + b.height / 2 - a.top - a.height / 2}px) scale(.35)`; card.style.opacity = '.2';
      tone(700, 0, .08, S.theme === 'blocs' ? 'square' : 'triangle', .07); tone(1050, .07, .1, S.theme === 'blocs' ? 'square' : 'triangle', .07);
      setTimeout(() => { burstAt(target, 16); $('.drops', target).appendChild(el(`<span class="dropped pop">${esc(cur.text)}</span>`)); }, 420);
      fact.style.visibility = cur.fact ? 'visible' : 'hidden'; if (cur.fact) fact.innerHTML = `<b>${esc(cur.text)}</b> : ${esc(cur.fact)}`;
      setTimeout(next, cur.fact ? 1300 : 650);
    } else {
      missed = true; target.classList.add('shake'); setTimeout(() => target.classList.remove('shake'), 400); sfx('bad'); buzz(30);
      bEls[cur.bucket].classList.add('hint');
      if (api.exam) { lock = true; setTimeout(() => { lock = false; choose(cur.bucket); }, 800); }
      else { fact.style.visibility = 'visible'; fact.innerHTML = 'Pas ce panier. Celui qui clignote est le bon : touche-le pour bien l’ancrer.'; }

  s.lines.forEach((line, li) => {

      if (typeof part === 'string') p.appendChild(document.createTextNode(part));

  const notes = el('<div></div>'); stage.appendChild(notes);

function triangleAnim(stage, done) {

  const w = cv.clientWidth || 600, h = Math.round(Math.min(260, w * .45)), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px'; const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const N = { europe: [w * .78, h * .2, 'EUROPE'], afrique: [w * .72, h * .78, 'AFRIQUE'], amerique: [w * .2, h * .55, 'AMÉRIQUE'] };
  const legs = [['europe', 'afrique', 'Produits manufacturés'], ['afrique', 'amerique', 'Esclaves'], ['amerique', 'europe', 'Matières premières']];
  const t0 = performance.now(); const D = 1500;
  const fr = t => {
    if (!cv.isConnected) return; const e = (t - t0) / D;
    c.fillStyle = '#3f8fd0'; c.fillRect(0, 0, w, h);
    c.fillStyle = 'rgba(255,255,255,.18)'; for (let i = 0; i < 30; i++) c.fillRect((i * 97 + t / 30) % w, (i * 53) % h, 14, 3);
    Object.values(N).forEach(([x, y, n]) => { c.fillStyle = '#e8d9a8'; c.fillRect(x - 46, y - 20, 92, 40); c.fillStyle = '#6b8a3a'; c.fillRect(x - 40, y - 14, 80, 28); c.font = '900 14px Nunito, sans-serif'; c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(n, x, y + 5); });
    legs.forEach(([a, b, lab], i) => {
      const k = Math.max(0, Math.min(1, e - i)); if (k <= 0) return; const A = N[a], B = N[b];
      c.strokeStyle = '#f2c335'; c.lineWidth = 4; c.setLineDash([10, 8]); c.beginPath(); c.moveTo(A[0], A[1]); c.lineTo(A[0] + (B[0] - A[0]) * k, A[1] + (B[1] - A[1]) * k); c.stroke(); c.setLineDash([]);
      const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2; c.font = '900 13px Nunito, sans-serif'; c.lineWidth = 4; c.strokeStyle = '#1d2330'; c.fillStyle = '#fff'; c.strokeText(lab, mx, my - 8); c.fillText(lab, mx, my - 8);
      if (k < 1) { const x = A[0] + (B[0] - A[0]) * k, y = A[1] + (B[1] - A[1]) * k; ICONS.boat.forEach((row, yy) => row.split('').forEach((q, xx) => { if (q !== '.') { c.fillStyle = PAL[q]; c.fillRect(x - 10 + xx * 3, y - 18 + yy * 3, 3, 3); } })); }
    });
    if (e < 3.3) requestAnimationFrame(fr); else done();
  };

}

function startQuest(key) { const steps = buildAny(key, null); runSteps(steps, { mode: 'quest', title: ALL_QUESTS.find(q => q.key === key).title, quest: key }); }
function startSession() {
  const C = CH(); let due = C.items.filter(i => isDue(i.id));
  if (!due.length) { go(() => screenNothingDue()); return; }
  // priorité : jamais vus et boîtes faibles ; limite ~28 éléments ; quêtes entremêlées
  due.sort((a, b) => st(a.id).b - st(b.id).b || Math.random() - .5);
  const chosen = new Set(due.slice(0, 28).map(i => i.id));
  const quests = shuffle(C.quests.map(q => q.key).filter(k => C.items.some(i => i.quest === k && chosen.has(i.id))));
  let steps = [];
  quests.forEach(k => steps = steps.concat(buildAny(k, chosen)));
  runSteps(steps, { mode: 'session', title: 'Séance du jour' });
}
function screenNothingDue() {
  const n = mount(`<div class="screen fadein center" style="justify-content:center;min-height:90vh"><div class="panel hero">${compSVG(90)}<div><h2>Tout est à jour</h2><p>${esc(compName())} : « Tu as fait tout ce qu’il fallait pour aujourd’hui. Ton cerveau a besoin de temps entre les séances pour bien retenir. Tu peux quand même jouer une quête ou faire un examen blanc. »</p></div></div><div class="row center"><button class="btn" id="m">L’expédition</button><button class="btn alt" id="h">Accueil</button></div></div>`);
  $('#m', n).onclick = () => go(screenMap); $('#h', n).onclick = () => go(screenHome);
}
function startExam() { runSteps(CH().exam(), { mode: 'exam', title: 'Examen blanc' }); }

function runSteps(steps, opt) {
  const run = { steps: steps.slice(), i: 0, opt, results: [], seeds: 0, total: steps.length, ctx: {}, retried: new Set() };
  go(() => renderStep(run));
}
function renderStep(run) {
  if (run.i >= run.steps.length) { finishRun(run); return; }
  const step = run.steps[run.i]; window.__step = step; window.__run = run;
  const q = ALL_QUESTS.find(x => x.key === step.quest);
  setBiome(q ? q.biome : 'default');
  const done = run.i, pct = Math.round(100 * done / run.steps.length);
  const n = mount(`<div class="screen fadein">
    <div class="topbar"><button class="btn alt" id="quit">Quitter</button><div class="progress"><div style="width:${pct}%"></div></div><span class="chip" id="seedchip">${icon('seed', 18)} <b>${S.seeds}</b></span></div>
    <div id="scenebox"></div>
    <div class="row muted" style="font-weight:800;font-size:15px"><span>${esc(run.opt.title)}${q && run.opt.mode !== 'quest' ? ' · ' + esc(q.title) : ''}</span><span class="grow"></span><span>${q ? q.q + ' du cahier' : ''}</span></div>
    <div id="stage" class="grow" style="display:flex;flex-direction:column;gap:14px"></div></div>`);
  $('#quit', n).onclick = () => { if (run.results.length) finishRun(run, true); else go(screenHome); };
  const api = {
    ctx: run.ctx, exam: run.opt.mode === 'exam',
    result: (results, info = {}) => onResult(run, step, results, info)
  };
  // scène animée
  if (!run.scene) run.scene = makeScene();
  $('#scenebox', n).appendChild(run.scene.cv);
  $('#app').scrollTop = 0;
  run.scene.setBiome(SCENE_BIOME[step.quest] || 'forest');
  run.monsterNow = false;
  if (run.opt.mode !== 'exam' && !step.serious && run.i >= 2 && (run.cool || 0) <= 0 && (Math.random() < .28 || (!run.hadMonster && run.i >= 3))) {
    run.monsterNow = true; run.hadMonster = true; run.cool = 3;
    const name = run.scene.monster();
    $('#stage', n).appendChild(el(`<div class="fact pop"><b>Attention : un ${esc(name)} bloque le chemin.</b> Réponds bien, puis tape-le 3 fois avec ton bâton pour gagner 2 graines bonus. Si tu te trompes, il te vole une graine.</div>`));
  } else { run.cool = (run.cool || 0) - 1; run.scene.arrive(); }
  GAMES[step.type]($('#stage', n), step, api);
}
async function onResult(run, step, results, info) {
  if (run.busy) return; run.busy = true;
  let gained = 0;
  results.forEach(r => { run.results.push(Object.assign({ q: step.qnum || '' }, r)); if (record(r.id, r.ok)) gained++; });
  run.seeds += gained;
  const allOk = results.every(r => r.ok);
  // Requeue des éléments ratés (une fois), sauf en examen
  if (!allOk && run.opt.mode !== 'exam' && step.subset) {
    const failed = results.filter(r => !r.ok).map(r => r.id);
    const key = step.type + ':' + failed.join(',');
    if (!run.retried.has(key)) { run.retried.add(key); const again = step.subset(failed); if (again) run.steps.push(Object.assign(again, { retry: true })); }
  }
  let extra = '';
  const sc = run.scene;
  if (sc) {
    if (run.monsterNow) {
      run.monsterNow = false;
      if (allOk) { $('#app').scrollTo({ top: 0, behavior: 'smooth' }); const hits = await sc.bonk(); const bonus = hits >= 3 ? 2 : 1; S.seeds += bonus; save(); extra = hits >= 3 ? `Monstre bonké : +${bonus} graines bonus.` : `Le monstre s’est enfui, étourdi : +${bonus} graine bonus.`; }
      else { const has = S.seeds > 0; await sc.steal(has); if (has) { S.seeds--; save(); } extra = has ? 'Le monstre s’est sauvé avec une de tes graines.' : 'Le monstre s’est sauvé en riant.'; }
    } else if (allOk) { if (gained) flySeeds(sc, gained); if (!step.serious) await sc.success(); }
    else if (!step.serious) await sc.fail();
  }
  const chip = $('#seedchip b'); if (chip) chip.textContent = S.seeds;
  run.busy = false;
  showFeedback(allOk, Object.assign({}, info, { extra, serious: info.serious || step.serious }), gained, () => { run.i++; renderStep(run); });
}
function flySeeds(sc, n) {
  const from = sc.avatarScreen(), chip = $('#seedchip'); if (!chip) return;
  const to = chip.getBoundingClientRect();
  for (let i = 0; i < Math.min(n, 4); i++) {
    const s = el(`<div class="flyseed">${icon('seed', 30)}</div>`); document.body.appendChild(s);
    s.style.left = from.x + 'px'; s.style.top = from.y + 'px';
    setTimeout(() => { s.style.transform = `translate(${to.left + to.width / 2 - from.x}px,${to.top - from.y}px) scale(.6)`; s.style.opacity = '.4'; }, 60 + i * 120);
    setTimeout(() => { s.remove(); chip.classList.add('hop'); setTimeout(() => chip.classList.remove('hop'), 500); }, 900 + i * 120);
  }
}
function showFeedback(ok, info, gained, next) {
  if (ok) { sfx('good'); buzz(25); } else { sfx('bad'); buzz([40, 60, 40]); }
  const fb = el(`<div class="feedback ${ok ? 'good' : 'bad'}"><div class="panel">
    <div class="comp">${compSVG(64, ok ? 'hop' : 'shake')}</div>
    <div class="grow"><div class="fb-title">${esc(info.title || (info.serious ? (ok ? 'C’est exact.' : 'Pas tout à fait.') : fmt(pick(ok ? PRAISE : OOPS))))}</div>
    ${info.explain ? `<p style="margin-top:4px">${info.explain}</p>` : ''}
    ${info.extra ? `<p style="margin-top:4px;font-weight:900">${esc(info.extra)}</p>` : ''}
    ${gained ? `<p class="muted" style="font-size:15px;margin-top:4px">+${gained} graine${gained > 1 ? 's' : ''} pour ta forêt</p>` : ''}</div>
    <button class="btn" id="cont">Continuer</button></div></div>`);
  document.body.appendChild(fb);
  requestAnimationFrame(() => requestAnimationFrame(() => fb.classList.add('show')));
  if (ok && !info.serious) burst(innerWidth / 2, innerHeight - 120, 22);
  let used = false;
  const go2 = () => { if (used) return; used = true; sfx('tap'); fb.classList.remove('show'); setTimeout(() => fb.remove(), 350); next(); };
  $('#cont', fb).onclick = go2;
  $('#cont', fb).focus({ preventScroll: true });
}
function finishRun(run, quit) {
  if (run.scene) run.scene.stop();
  const total = run.results.length, good = run.results.filter(r => r.ok).length;
  if (total) { S.sessions[dayStr()] = (S.sessions[dayStr()] || 0) + 1; }

  const nb = checkBadges();

    const weak = Object.entries(byQ).filter(([, v]) => v[0] < v[1]).map(([k]) => k);
    examBlock = `<div class="panel center"><div class="score">${score} %</div><p class="muted">Résultat de l’examen blanc</p></div>
      <div class="panel"><h3>Par question du cahier</h3><div class="reveal-list" style="margin-top:10px">${Object.entries(byQ).sort((a, b) => parseInt(a[0].slice(1)) - parseInt(b[0].slice(1))).map(([k, v]) => `<span class="${v[0] === v[1] ? 'got' : ''}">${k} : ${v[0]}/${v[1]}</span>`).join('')}</div>
      ${weak.length ? `<p style="margin-top:10px">À revoir : <b>${weak.join(', ')}</b>. La séance du jour va te les ramener.</p>` : '<p style="margin-top:10px"><b>Tout est réussi.</b></p>'}</div>`;
  }
  save();
  go(() => {
    setBiome('default');
    const n = mount(`<div class="screen fadein">
      <div class="panel hero">${compSVG(90, 'hop')}<div class="grow"><h2>${quit ? 'Pause bien méritée' : 'Expédition terminée'}</h2><p>${esc(compName())} : « ${total ? `${good} bonne${good > 1 ? 's' : ''} réponse${good > 1 ? 's' : ''} sur ${total}.` : 'À la prochaine !'} ${good === total && total ? 'Impressionnant, ' + esc(S.name) + '.' : 'Chaque erreur d’aujourd’hui, c’est une réponse que tu vas retenir.'} »</p></div></div>
      ${examBlock}
      ${nb.length ? `<div class="panel"><h3>Nouveau badge${nb.length > 1 ? 's' : ''}</h3><div class="badges" style="margin-top:10px">${nb.map(b => `<div class="bdg new">${icon(b.icon, 40)}${esc(b.name)}</div>`).join('')}</div></div>` : ''}
      ${run.seeds ? `<div class="panel row">${icon('seed', 40)}<p class="grow"><b>+${run.seeds} graine${run.seeds > 1 ? 's' : ''}</b> à planter dans ta forêt.</p><button class="btn" id="pl">Planter</button></div>` : ''}
      <div class="row"><button class="btn alt" id="hm">Accueil</button><span class="grow"></span><button class="btn" id="mp">L’expédition</button></div></div>`);
    if (!quit && total) { sfx('win'); confetti(); }
    $('#hm', n).onclick = () => go(screenHome); $('#mp', n).onclick = () => go(screenMap);
    if ($('#pl', n)) $('#pl', n).onclick = () => go(screenForest);
  });
}

const FZONES = [
  { k: 'boreale', a: .02, b: .26, ok: ['conifere'], name: 'forêt boréale', g: ['#5a7a48', '#4d6b3d'] },
  { k: 'mixte', a: .26, b: .48, ok: ['conifere', 'feuillu'], name: 'forêt mixte', g: ['#6a8a46', '#5c7a3c'] },
  { k: 'feuillus', a: .48, b: .69, ok: ['feuillu'], name: 'forêt de feuillus', g: ['#7a9a44', '#6b8a3a'] },
  { k: 'eau', a: .69, b: .76, ok: [], name: 'l’océan', g: ['#4aa3df', '#4aa3df'] },
  { k: 'tropicale', a: .76, b: .98, ok: ['tropical'], name: 'forêt tropicale', g: ['#3f8f4a', '#357a3f'] }
];
const zoneAt = x => FZONES.find(z => x >= z.a && x < z.b) || (x < .5 ? FZONES[0] : FZONES[4]);
function whyNot(sp, z) {
  const fam = sp.fam;
  if (z.k === 'eau') return `Oups, ton ${sp.name.toLowerCase()} est tombé à l’eau. Plante-le dans le sol.`;
  if (fam === 'tropical') return `Le ${sp.name.toLowerCase()} est un arbre tropical : il a besoin d’un climat chaud et humide. Il ne survit pas dans la ${z.name}. Essaie la forêt tropicale.`;
  if (z.k === 'tropicale') return `La forêt tropicale, c’est pour les arbres tropicaux (climat chaud et humide). Le ${sp.name.toLowerCase()} est un ${FAMILIES[fam].toLowerCase()} : il pousse ${fam === 'conifere' ? 'dans la forêt boréale ou la forêt mixte' : 'dans la forêt de feuillus ou la forêt mixte'}.`;
  if (fam === 'conifere') return `Le ${sp.name.toLowerCase()} est un conifère : sa place est dans la forêt boréale ou la forêt mixte, pas dans la forêt de feuillus.`;
  return `Le ${sp.name.toLowerCase()} est un feuillu : sa place est dans la forêt de feuillus ou la forêt mixte. La forêt boréale, c’est surtout des conifères.`;
}
function screenForest() {
  setBiome('default');
  let sel = null, anim = null, wilt = null;
  const n = mount(`<div class="screen fadein">
    <div class="topbar"><button class="btn alt" id="bk">Retour</button><h2 class="grow">Ma forêt</h2><span class="chip" id="sd">${icon('seed', 20)} ${S.seeds}</span></div>
    <div id="msg" class="fact">${S.seeds ? '1. Choisis un arbre en bas. 2. Touche l’endroit où tu veux le planter. Attention : s’il n’est pas dans la bonne forêt, il ne poussera pas.' : 'Plus de graines pour l’instant. Réponds à des défis pour en gagner.'}</div>
    <canvas class="forestcv" id="fc" style="touch-action:manipulation"></canvas>
    <div class="species" id="spl">${SPECIES.map(s => `<div class="panel sp" data-k="${s.key}"><canvas width="60" height="70"></canvas>${s.name}</div>`).join('')}</div></div>`);
  $('#bk', n).onclick = () => go(screenHome);
  const cv = $('#fc', n);
  let geo = { w: 0, h: 0, gy: 0 };
  const draw = (grow) => {
    const w = cv.clientWidth, h = Math.round(Math.min(460, Math.max(280, w * .5)));
    const dpr = Math.min(2, devicePixelRatio || 1); if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px'; }
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.imageSmoothingEnabled = false;
    const night = S.theme === 'aurore';
    const sky = c.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, night ? '#0b1a3f' : S.theme === 'jungle' ? '#5fa86a' : '#8fd3f5'); sky.addColorStop(1, night ? '#24467a' : S.theme === 'jungle' ? '#b6e08a' : '#e4f6ff');
    c.fillStyle = sky; c.fillRect(0, 0, w, h);
    const gy = Math.round(h * .3); geo = { w, h, gy };
    FZONES.forEach(z => { c.fillStyle = z.g[0]; c.fillRect(z.a * w, gy, (z.b - z.a) * w, h - gy); if (z.k !== 'eau') { c.fillStyle = z.g[1]; for (let i = 0; i < 46; i++) c.fillRect(z.a * w + ((i * 53) % ((z.b - z.a) * w)), gy + ((i * 37) % (h - gy)), 6, 6); } else { c.fillStyle = 'rgba(255,255,255,.4)'; for (let i = 0; i < 10; i++) c.fillRect(z.a * w + 6 + (i % 2) * 12, gy + 14 + i * 24 + Math.sin(performance.now() / 400 + i) * 2, 14, 3); } });
    c.fillStyle = 'rgba(0,0,0,.15)'; FZONES.forEach(z => c.fillRect(z.b * w - 1, gy, 2, h - gy));
    c.font = '900 12px Nunito, sans-serif'; c.fillStyle = night ? '#fff' : '#1d2330';
    FZONES.filter(z => z.k !== 'eau').forEach(z => c.fillText(z.name.toUpperCase(), z.a * w + 6, gy - 8));
    const s = Math.max(3, Math.round(w / 150));
    S.forest.slice().sort((p, q) => p.y - q.y).forEach(t => { const g = (grow && t === grow.t) ? grow.g : 1; drawTree(c, t.sp, t.x * w, gy + t.y * (h - gy - 10) + 10, s, g, true); });
    if (wilt) { const k = wilt.k; c.save(); c.globalAlpha = 1 - k * .8; c.filter = 'sepia(1) saturate(.5) brightness(.8)'; drawTree(c, wilt.sp, wilt.x * w, gy + wilt.y * (h - gy - 10) + 10, s, Math.max(.05, 1 - k), false); c.restore(); }
    if (!S.forest.length && !grow && !wilt) { c.font = '800 18px Nunito, sans-serif'; c.fillStyle = 'rgba(0,0,0,.45)'; c.fillText('Ta forêt est encore vide…', w * .3, h * .75); }
  };
  draw();
  const ro = new ResizeObserver(() => draw()); ro.observe(cv);
  $$('.sp', n).forEach(d => { const c = $('canvas', d).getContext('2d'); drawTree(c, d.dataset.k, 30, 66, 3, 1, true);
    d.onclick = () => {
      if (S.seeds <= 0) { d.classList.add('shake'); setTimeout(() => d.classList.remove('shake'), 400); $('#msg', n).textContent = 'Plus de graines. Fais une séance pour en gagner.'; sfx('bad'); return; }
      sel = d.dataset.k; $$('.sp', n).forEach(x => x.classList.toggle('sel', x === d)); sfx('tap');
      const sp = SPECIES.find(x => x.key === sel);
      $('#msg', n).innerHTML = `<b>${sp.name}</b> choisi. Touche l’endroit dans ta forêt où tu veux le planter.`;
      cv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  });
  cv.addEventListener('click', (ev) => {
    const r = cv.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width, py = ev.clientY - r.top;
    if (!sel) { $('#msg', n).textContent = 'Choisis d’abord un arbre en bas, puis touche ici pour le planter.'; sfx('tap'); return; }
    if (S.seeds <= 0) { $('#msg', n).textContent = 'Plus de graines. Fais une séance pour en gagner.'; return; }
    if (py < geo.gy) { $('#msg', n).textContent = 'Plante-le dans le sol, pas dans le ciel.'; sfx('tap'); return; }
    const y = Math.max(0, Math.min(1, (py - geo.gy - 10) / (geo.h - geo.gy - 10)));
    const sp = SPECIES.find(s => s.key === sel), z = zoneAt(x);
    if (!z.ok.includes(sp.fam)) {
      sfx('bad'); buzz([30, 40, 30]); burst(ev.clientX, ev.clientY, 16, 'bad');
      $('#msg', n).innerHTML = `<b>Il fane…</b> ${whyNot(sp, z)} <span class="muted">(Tu gardes ta graine.)</span>`;
      wilt = { sp: sel, x, y, k: 0 }; const t0 = performance.now(); cancelAnimationFrame(anim);
      const fr = (tt) => { wilt.k = Math.min(1, (tt - t0) / 1300); draw(); if (wilt.k < 1) anim = requestAnimationFrame(fr); else { wilt = null; draw(); } };
      anim = requestAnimationFrame(fr); return;
    }
    const t = { sp: sel, x, y };
    S.forest.push(t); S.seeds--; save();
    $('#sd', n).innerHTML = icon('seed', 20) + ' ' + S.seeds;
    $('#msg', n).innerHTML = `<b>Bien planté.</b> ${sp.name} → ${z.name}. ${sp.fact}${S.seeds ? '' : ' Plus de graines pour l’instant.'}`;
    sfx('plant'); buzz(20); burst(ev.clientX, ev.clientY, 30);
    if (checkBadges().length) setTimeout(() => { sfx('win'); confetti(); $('#msg', n).innerHTML += ' <b>Nouveau badge : Jardinière.</b>'; }, 800);
    const t0 = performance.now(); cancelAnimationFrame(anim);
    const fr = (tt) => { const g = Math.min(1, (tt - t0) / 700); draw({ t, g: 1 - Math.pow(1 - g, 3) }); if (g < 1) anim = requestAnimationFrame(fr); };
    anim = requestAnimationFrame(fr);
  });
}

/* =========================================================
   BADGES
   ========================================================= */
const BADGES = ALL_QUESTS.map(q => ({ id: 'q-' + q.key, name: q.title, icon: q.icon, ok: () => masteryPct(q.key) === 100 })).concat([
  { id: 'premiere', name: 'Première séance', icon: 'star', ok: () => Object.keys(S.sessions).length >= 1 },
  { id: 'trois-jours', name: '3 jours d’étude', icon: 'seed', ok: () => Object.keys(S.sessions).length >= 3 },
  { id: 'jardin', name: 'Jardinière : 10 arbres', icon: 'tree', ok: () => S.forest.length >= 10 },
  { id: 'style', name: 'Premier accessoire', icon: 'leaf', ok: () => (S.acc || []).length >= 1 },
  { id: 'examen90', name: 'Examen blanc 90 %', icon: 'lab', ok: () => (S.exams || []).some(e => e.score >= 90) }
]);
function checkBadges() {
  const fresh = BADGES.filter(b => !S.badges.includes(b.id) && b.ok());
  fresh.forEach(b => { S.badges.push(b.id); S.newBadges = (S.newBadges || []).concat(b.id); });
  if (fresh.length) save();
  return fresh;
}

/* =========================================================
   BOUTIQUE
   ========================================================= */
function screenShop() {
  setBiome('default');
  const groups = [
    ['Chapeaux', 'hat', HATS], ['Lunettes', 'glasses', GLASSES], ['Bâtons pour bonker les monstres', 'bat', BATS], ['Auras', 'aura', AURAS]
  ];
  const render = () => {
    const prev = (slot, k) => slot === 'hat' ? compSVG(64, '', k, '', '') : slot === 'glasses' ? compSVG(64, '', '', '', k) : slot === 'aura' ? compSVG(64, '', '', k, '') : batSVG(k);
    const n = mount(`<div class="screen fadein">
      <div class="topbar"><button class="btn alt" id="bk">Retour</button><h2 class="grow">Boutique</h2><span class="chip">${icon('seed', 20)} ${S.seeds}</span></div>
      <div class="panel hero" style="justify-content:center"><div id="big" class="row" style="gap:4px;align-items:flex-end">${compSVG(150)}${batSVG(S.wear.bat, 70)}</div><div class="grow"><h3>${esc(compName())}</h3><p class="muted">Touche un objet pour l’acheter, puis pour le porter ou le retirer. Tes graines servent aussi à planter tes arbres : à toi de choisir.</p><button class="btn alt" id="chg" style="margin-top:10px">Changer de personnage</button></div></div>
      ${S.comp === 'explo' ? `<div class="panel"><h3>Couleurs (gratuit)</h3>${Object.entries(LOOK_SWATCHES).map(([k, g]) => `<div class="row" style="margin-top:8px"><b style="width:100px">${g.label}</b>${g.colors.map(col => `<button class="sw ${(S.look[k] || LOOK_DEFAULT[k]) === col ? 'on' : ''}" data-k="${k}" data-c="${col}" style="background:${col}" aria-label="${g.label}"></button>`).join('')}</div>`).join('')}</div>` : ''}
      ${groups.map(([title, slot, set]) => `<h3>${title}</h3><div class="shop">${Object.entries(set).map(([k, it]) => { const own = S.acc.includes(k), worn = S.wear[slot] === k;
        return `<div class="panel item ${worn ? 'worn' : ''}" data-k="${k}" data-slot="${slot}">${prev(slot, k)}<span>${esc(it.name)}</span><span class="price chip">${own ? (worn ? 'Porté' : 'À toi') : icon('seed', 16) + ' ' + it.price}</span></div>`; }).join('')}</div>`).join('')}
      <div id="msg" class="fact">${S.acc.length > 1 ? 'Ta collection : ' + (S.acc.length - 1) + ' objet' + (S.acc.length > 2 ? 's' : '') + '.' : 'Ton premier accessoire débloque un badge.'}</div></div>`);
    $('#bk', n).onclick = () => go(screenHome);
    $('#chg', n).onclick = () => go(() => screenCompanion(true));
    $$('.sw', n).forEach(b => b.onclick = () => { S.look[b.dataset.k] = b.dataset.c; save(); sfx('tap'); const y = $('#app').scrollTop; render(); $('#app').scrollTop = y; });
    $$('.item', n).forEach(d => d.onclick = () => {
      const slot = d.dataset.slot, k = d.dataset.k, it = groups.find(g => g[1] === slot)[2][k];
      const y = $('#app').scrollTop;
      if (S.acc.includes(k)) { S.wear[slot] = S.wear[slot] === k ? (slot === 'bat' ? 'bois' : '') : k; save(); sfx('tap'); render(); $('#app').scrollTop = y; burstAt($('#big'), 20); return; }
      if (S.seeds < it.price) { d.classList.add('shake'); setTimeout(() => d.classList.remove('shake'), 400); sfx('bad'); $('#msg', n).textContent = `Il te manque ${it.price - S.seeds} graine${it.price - S.seeds > 1 ? 's' : ''}. Une séance du jour t’en donnera.`; return; }
      S.seeds -= it.price; S.acc.push(k); S.wear[slot] = k; save(); checkBadges();
      sfx('win'); buzz([20, 40, 20]); render(); $('#app').scrollTop = y; burstAt($('#big'), 40, 'gold');
    });
  };
  render();
}
function batSVG(k, size = 44) {
  const b = BATS[k] || BATS.bois; const col = b.c1 === 'rainbow' ? 'url(#rb)' : b.c1;
  return `<svg class="pix" viewBox="0 0 12 40" width="${size * .3}" height="${size}" shape-rendering="crispEdges" style="transform:rotate(18deg)"><defs><linearGradient id="rb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a5a"/><stop offset=".3" stop-color="#ffd23f"/><stop offset=".55" stop-color="#3cc46a"/><stop offset=".8" stop-color="#2f8cff"/><stop offset="1" stop-color="#b06bff"/></linearGradient></defs><rect x="1" y="0" width="10" height="20" fill="${col}"/><rect x="2" y="18" width="8" height="12" fill="${col}"/><rect x="3" y="30" width="6" height="10" fill="${b.c2}"/><rect x="2" y="2" width="3" height="16" fill="rgba(255,255,255,.35)"/></svg>`;
}

/* =========================================================
   MATIÈRES
   ========================================================= */
function screenChapters() {
  setBiome('default');
  const n = mount(`<div class="screen fadein">
    <div class="topbar"><button class="btn alt" id="bk">Retour</button><h2 class="grow">Mes matières</h2></div>
    ${Object.values(CHAPTERS).map(c => { const d = dayNum((S.examDates[c.key]) || c.date) - today(); const p = Math.round(100 * c.items.filter(i => mastered(i.id)).length / c.items.length);
      return `<div class="panel node ${S.chapter === c.key ? 'sel' : ''}" data-k="${c.key}"><div class="badge">${icon(c.icon, 40)}</div><div class="grow"><p class="muted" style="font-size:14px;font-weight:800">${c.subject} · ${d > 0 ? 'examen dans ' + d + ' jour' + (d > 1 ? 's' : '') : d === 0 ? 'examen aujourd’hui' : 'examen passé'}</p><h3>${c.title}</h3><div class="mini"><div style="width:${p}%"></div></div></div><span class="chip">${p}%</span></div>`; }).join('')}
    <p class="muted">Tes graines, ta forêt, tes accessoires et tes badges restent les mêmes peu importe la matière.</p></div>`);
  $('#bk', n).onclick = () => go(screenHome);
  $$('.node', n).forEach(d => d.onclick = () => { S.chapter = d.dataset.k; save(); sfx('good'); go(screenHome); });
}
function screenNewChapter() {
  S.chapter = 'europe'; if (!S.seenChapters.includes('europe')) S.seenChapters.push('europe'); save();
  setBiome('stars');
  const d = daysLeft();
  const n = mount(`<div class="screen fadein">
    <canvas id="logo" width="480" height="150" style="width:min(480px,90vw);image-rendering:pixelated;margin:0 auto"></canvas>
    <h1 class="center" style="text-align:center">Nouvelle expédition</h1>
    <div class="panel hero">${compSVG(84)}<div><p><b>${esc(compName())}</b> : « ${esc(S.name)}, on embarque sur une caravelle. Cette fois, c’est l’Histoire : <b>l’expansion européenne dans le monde</b>. Ton examen est le <b>${longDate(exDate())}</b>${d > 0 ? `, dans <b>${d} jour${d > 1 ? 's' : ''}</b>` : ''}. »</p></div></div>
    <div class="panel"><h3>Le plan</h3><p style="margin-top:8px">Une <b>séance du jour</b> chaque jour jusqu’à l’examen. ${d >= 3 ? 'Mardi, mercredi et jeudi, ça suffit pour tout retenir.' : ''} Les questions plus difficiles vont revenir plus souvent.</p>
    <p style="margin-top:8px">Tes graines, ta forêt, ta boutique et tes badges te suivent. Il y a aussi de nouveaux monstres… en mer.</p></div>
    <div class="row"><span class="grow"></span><button class="btn big" id="go">Embarquer</button></div></div>`);
  const cv = $('#logo', n), c = cv.getContext('2d'); const t0 = performance.now();
  const fr = t => { if (!cv.isConnected) return; const k = (t - t0) / 1000; c.clearRect(0, 0, 480, 150); c.fillStyle = '#2f7fc4'; c.fillRect(0, 110, 480, 40); c.fillStyle = 'rgba(255,255,255,.4)'; for (let i = 0; i < 12; i++) c.fillRect((i * 47 + k * 30) % 480, 118 + (i % 3) * 8, 18, 3);
    const x = ((k * 60) % 560) - 60, y = 92 + Math.sin(k * 2) * 3; c.fillStyle = '#6b4420'; c.fillRect(x - 40, y, 80, 14); c.fillRect(x - 30, y + 14, 60, 6); c.fillStyle = '#f6f3ea'; c.fillRect(x - 4, y - 60, 5, 60); c.fillRect(x - 30, y - 54, 22, 40); c.fillRect(x + 4, y - 48, 26, 40); c.fillStyle = '#d8432f'; c.fillRect(x - 2, y - 70, 14, 8); c.fillStyle = '#d8432f'; c.fillRect(x - 22, y - 40, 6, 14); c.fillRect(x - 26, y - 36, 14, 6);
    requestAnimationFrame(fr); };
  requestAnimationFrame(fr);
  $('#go', n).onclick = () => { sfx('win'); confetti(); go(screenHome); };
}

/* ---------- Démarrage ---------- */
function boot() {
  applyTheme(); bgInit();
  document.addEventListener('pointerdown', () => audio(), { once: true });
  if (S.onboarded && !S.seenChapters.includes('europe')) screenNewChapter(); else if (S.onboarded) screenHome(); else screenWelcome();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
}

boot();
</script>
